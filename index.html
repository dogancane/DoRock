<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Keep this page out of search results. On a GitHub Pages PROJECT site
     (user.github.io/repo/) robots.txt is not read by crawlers, because they
     only fetch it from the domain root, so these tags are what actually does
     the work. They stop indexing; they do not make the page private. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="slurp" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Internal engineering tool. Not for public use.">
<title>DoRock</title>
<style>
:root{
  --ink:#1a242c;        --ink-2:#41525e;      --ink-3:#71828e;
  --line:#dde4e9;       --line-2:#eef2f5;
  --bg:#f2f5f7;         --surface:#ffffff;
  --deep:#12303f;       --deep-2:#1c4459;     --deep-3:#2b6a8f;
  --rust:#c2761b;       --rust-soft:#fdf3e3;
  --moss:#3f7d5c;       --moss-soft:#eaf4ee;
  --clay:#a5382c;       --clay-soft:#fbecea;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  --r:5px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{width:212px;flex:0 0 212px;background:var(--deep);color:#c5d5df;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{display:flex;align-items:center;gap:8px}
.brand .mark svg{flex:0 0 auto}
.brand .title{font-size:13.5px;font-weight:600;color:#fff;line-height:1.25}
.brand .proj{font-size:11px;color:#7fa0b4;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .scen{font-size:10.5px;color:#5f8299;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{flex:1;overflow-y:auto;padding:8px 0 14px}
.nav-group{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5b7d92;padding:14px 16px 5px}
.tab-btn{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
  color:#adc2cf;padding:7px 16px;font-size:13px;cursor:pointer;transition:none}
.tab-btn:hover{background:rgba(255,255,255,.05);color:#fff}
.tab-btn.active{background:var(--deep-2);color:#fff;border-left-color:var(--rust);font-weight:600}
.tab-btn:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.side-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:5px}
.side-foot button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#cfdde6;
  border-radius:var(--r);padding:5px 8px;font-size:11.5px;cursor:pointer;text-align:left}
.side-foot button:hover{background:rgba(255,255,255,.14);color:#fff}

.body{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- live results bar ---------- */
.results{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;gap:0;padding:0 22px;overflow-x:auto}
.rb-item,.rb-status{padding:9px 20px 9px 0;margin-right:20px;border-right:1px solid var(--line-2);white-space:nowrap}
.rb-item:last-of-type{border-right:0}
.rb-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.rb-value{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--deep);line-height:1.25}
.rb-unit{font-size:10.5px;color:var(--ink-3);font-weight:400;margin-left:3px}
.rb-status{cursor:pointer;border-right:0;padding-right:0}
.rb-status .rb-value{font-size:12.5px;font-family:var(--sans)}
.rb-status.good .rb-value{color:var(--moss)}
.rb-status.mid .rb-value{color:var(--rust)}
.rb-status.bad .rb-value{color:var(--clay)}
.rb-err{padding:9px 0;color:var(--clay);font-size:12.5px}

main{padding:22px 26px 70px;max-width:1240px}
.page{display:none}
.page.active{display:block}
.page-head{margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.ph-text{flex:1 1 380px;min-width:0}
.page-actions{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;padding-top:4px}
.page-head h1{font-size:21px;color:var(--deep)}
.page-desc{color:var(--ink-2);font-size:13px;max-width:74ch;margin-top:4px}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card.vessel{border-left:3px solid var(--deep-3)}
.card.vessel.inactive{opacity:.6;border-left-color:var(--line)}
.sec{margin:0 0 11px}
.sec + .grid, .sec + .field{margin-top:0}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.sec-note{font-size:12px;color:var(--ink-2);margin-top:4px;max-width:78ch}
.card .sec:not(:first-child){margin-top:16px;padding-top:13px;border-top:1px solid var(--line-2)}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}
.grid.wide-narrow{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:1080px){.grid.wide-narrow,.grid.three,.grid.four{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.grid.two,.grid.three,.grid.four,.grid.wide-narrow{grid-template-columns:1fr}
  .side{position:static;height:auto;width:100%;flex:1 1 auto}.shell{flex-direction:column}}

/* ---------- inputs ---------- */
.field{margin-bottom:11px}
label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:3px;font-weight:500}
label.inline{display:flex;align-items:center;gap:7px;margin:0;cursor:pointer}
.lab-note{color:var(--ink-3);font-weight:400}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r);background:#fff;
  font-family:var(--mono);font-size:13px}
select{font-family:var(--sans)}
textarea{font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:2px solid #9ec6dd;outline-offset:-1px;border-color:var(--deep-3)}
input[type=checkbox]{width:auto;accent-color:var(--deep-3)}
.inp-unit{display:flex;align-items:center;gap:7px}
.inp-unit .unit,.triple .unit{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;flex:0 0 auto}
.triple{display:flex;align-items:center;gap:5px}
.triple input{text-align:right}
.triple input.nom{border-color:var(--deep-3);background:#f8fbfd;font-weight:600}
.hint{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.field.check{padding-top:14px}
.readout{background:#f7fafb;border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;
  font-size:12.5px;margin-top:8px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.readout strong{font-family:var(--mono);color:var(--deep)}
.muted{color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{background:var(--deep);color:#fff;border:1px solid var(--deep);padding:6px 13px;border-radius:var(--r);
  font-size:12.5px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--deep-2);border-color:var(--deep-2)}
.btn.ghost{background:#fff;color:var(--deep);border-color:var(--line)}
.btn.ghost:hover{background:#f0f5f8;border-color:var(--deep-3)}
.btn.danger{background:#fff;color:var(--clay);border-color:var(--line)}
.btn.danger:hover{background:var(--clay-soft);border-color:var(--clay)}
.btn.tiny{padding:2px 7px;font-size:11px}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:1px}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.spacer{flex:1}

/* ---------- tables ---------- */
.tbl-scroll{overflow-x:auto;margin:0 -4px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-2);background:#f4f7f9;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:4px 9px;border-bottom:1px solid var(--line-2);font-family:var(--mono);vertical-align:middle}
table.data td:first-child{font-family:var(--sans)}
table.data tr:hover td{background:#fafcfd}
table.data tr.total td{font-weight:700;background:#f4f7f9;border-top:1px solid var(--line)}
table.data tr.is-ref td{background:#fdf6ea}
table.data tr.is-best td{background:var(--moss-soft)}
table.data td.delta{color:var(--rust)}
table.data input{padding:2px 5px;font-size:12px}
input.w-id{width:74px}input.w-n{width:66px}input.w-s{width:54px}
table.data select{padding:2px 4px;font-size:11.5px;width:auto}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;border-top:2px solid var(--deep-3)}
.k-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.k-value{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--deep);line-height:1.1}
.k-unit{font-size:11px;color:var(--ink-3);font-weight:400;margin-left:3px}

/* ---------- traces ---------- */
details.trace{border:1px dashed var(--line);border-radius:var(--r);margin-top:10px;background:#fbfdfe}
details.trace summary{cursor:pointer;padding:7px 11px;font-size:11.5px;font-weight:600;color:var(--deep-3)}
details.trace summary:focus-visible{outline:2px solid var(--rust)}
details[open].trace summary{border-bottom:1px solid var(--line-2)}
.trace-body{padding:6px 11px 10px}
.trace-line{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dotted #e6ecf0;
  font-size:11.5px;line-height:1.45}
.trace-line:last-child{border-bottom:0}
.trace-line.strong{font-weight:700;color:var(--deep)}
.t-label{color:var(--ink-2)}
.t-val{font-family:var(--mono);white-space:nowrap;color:var(--ink)}
.trace-body > .trace-line:not(:has(.t-val)){display:block;color:var(--ink-2)}

/* ---------- notices ---------- */
.notice{border-radius:var(--r);padding:7px 11px;font-size:12.5px;margin-top:8px;border:1px solid}
.notice.warn{background:var(--rust-soft);border-color:#efd3a3;color:#7d4c0d}
.notice.error{background:var(--clay-soft);border-color:#e8b9b3;color:#8a2c22}
.notice.ok{background:var(--moss-soft);border-color:#bcdcc8;color:#2c5d43}
.notice.info{background:#eef4f8;border-color:#c6dae6;color:#22516b}

/* ---------- bars ---------- */
.bar-row{display:grid;grid-template-columns:150px 1fr 66px 48px;gap:9px;align-items:center;padding:2px 0}
.b-label{font-size:12px;color:var(--ink-2)}
.b-track{background:#eef2f5;border-radius:2px;height:11px;overflow:hidden}
.b-fill{background:var(--deep-3);height:100%}
.b-fill.alt{background:var(--rust)}
.b-val,.b-pct{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink-2)}
.stack{display:flex;height:22px;border-radius:3px;overflow:hidden;margin-bottom:10px}
.stack-seg{height:100%}
.legend{display:grid;grid-template-columns:14px 1fr 70px 52px;gap:7px;align-items:center;font-size:12px;padding:2px 0}
.legend .dot{width:9px;height:9px;border-radius:2px}
.l-val,.l-pct{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink-2)}

/* ---------- tornado ---------- */
.tor-row{display:grid;grid-template-columns:172px 1fr 108px;gap:11px;align-items:center;padding:3px 0}
.t-name{font-size:12px;color:var(--ink-2)}
.t-track{position:relative;height:15px;background:#f4f7f9;border-radius:2px}
.t-axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.t-seg{position:absolute;top:2px;bottom:2px;border-radius:1px}
.t-seg.lo{background:var(--deep-3)}
.t-seg.hi{background:var(--rust)}
.tor-row .t-val{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink-2)}

/* ---------- plots ---------- */
.plot{background:#fbfcfd;border:1px solid var(--line-2);border-radius:var(--r);padding:8px;text-align:center;overflow:hidden}
.plot svg,.plot canvas{max-width:100%;height:auto;display:block;margin:0 auto}
canvas.calib{border:1px solid var(--line);border-radius:var(--r);margin-top:8px;cursor:crosshair;max-width:100%}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(18,48,63,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:7px;padding:20px 22px;max-width:720px;width:100%;max-height:86vh;overflow-y:auto}
.modal h2{font-size:16px;color:var(--deep);margin-bottom:5px}
.wedge-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 34px;gap:9px;align-items:end;
  padding:9px 0;border-bottom:1px solid var(--line-2)}
.wedge-row .field{margin-bottom:0}

/* ---------- report ---------- */
#reportView{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 34px;margin-top:12px}
#reportView h1{font-size:20px;color:var(--deep)}
#reportView h2{font-size:14px;color:var(--deep);margin:22px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.rep-head{border-bottom:2px solid var(--deep);padding-bottom:11px}
.rep-meta{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.6}
ul.assump{font-size:12px;padding-left:18px;margin:0;color:var(--ink-2)}
ul.assump li{margin-bottom:5px}
#reportView table.data{margin-top:4px}


/* blank / example presentation */
.banner{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
  border-radius:var(--r);padding:9px 13px;margin-bottom:14px;font-size:12.5px;line-height:1.5}
.banner.example{background:var(--rust-soft);border:1px solid #eaca97;color:#7d4c0d}
.banner strong{font-weight:700}
.rb-chip{align-self:center;margin-right:16px;padding:3px 9px;border-radius:11px;font-size:9.5px;
  font-weight:700;letter-spacing:.08em;white-space:nowrap}
.rb-chip.example{background:var(--rust-soft);color:#7d4c0d;border:1px solid #eaca97}
.rb-empty{padding:11px 0;font-size:12.5px;color:var(--ink-3)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);
  padding:38px 24px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;margin-bottom:6px}
.empty p{font-size:12.5px;max-width:52ch;margin:0 auto 14px}
.card.start{border:1px solid var(--deep-3);border-top:3px solid var(--deep-3);margin-top:14px}
.card.start h2{font-size:16px;color:var(--deep);margin-bottom:4px}
.rep-example{margin-top:7px;display:inline-block;background:var(--rust-soft);border:1px solid #eaca97;
  color:#7d4c0d;padding:3px 9px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.05em}

.liveblock{display:contents}
.wedge-row{grid-template-columns:repeat(5,1fr) 34px}

.card.group{border-left:3px solid var(--rust)}
.pill{background:var(--steel-light);color:var(--deep);border-radius:11px;padding:2px 9px;font-size:10.5px;font-weight:600}
table.data.compact th,table.data.compact td{padding:3px 6px;font-size:11.5px}
.group .inp-unit .btn{flex:0 0 auto}


/* saving */
.save-status{border-radius:var(--r);padding:6px 9px;font-size:11px;font-weight:600;line-height:1.35;margin-bottom:2px}
.save-status.clean{background:rgba(63,125,92,.22);color:#bfe6cf;border:1px solid rgba(63,125,92,.5)}
.save-status.dirty{background:rgba(194,118,27,.22);color:#f4d3a6;border:1px solid rgba(194,118,27,.55)}
.save-status.warn{background:rgba(165,56,44,.22);color:#f0c2bc;border:1px solid rgba(165,56,44,.55)}
.ss-note{font-weight:400;font-size:10px;opacity:.85;margin-top:2px}
.save-row{display:flex;gap:6px;align-items:stretch}
.save-row button.primary{flex:1;background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.save-row button.primary:hover{background:#a9640f}
.save-row .auto{display:flex;align-items:center;gap:4px;font-size:10.5px;color:#cfdde6;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:var(--r);padding:0 7px;cursor:pointer}
.save-row .auto input{width:auto;margin:0}
.banner.restored{background:var(--moss-soft);border:1px solid #b9dcc7;color:#2c5d43}
.grade-ctl select{width:100%}
.grade-ctl input{width:100%}


/* paste / drop */
.dropzone{border:2px dashed var(--line);border-radius:var(--r);background:#fbfcfd;
  padding:18px 14px;text-align:center;cursor:pointer;transition:none}
.dropzone:hover{border-color:var(--steel);background:#f5f9fb}
.dropzone.over{border-color:var(--rust);background:var(--rust-soft)}
.dropzone:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.dz-main{font-size:12.5px;font-weight:600;color:var(--deep)}
.dz-sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.dropzone.image{padding:14px}
.modal.wide{max-width:1040px}
.imp-head{font-size:10px;text-transform:none;letter-spacing:0;color:var(--ink-3);
  font-weight:600;margin-bottom:3px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.data th select{width:100%;font-size:11px;padding:2px 4px;text-transform:none;letter-spacing:0;font-weight:400}


/* in-page dialogs */
.modal.small{max-width:460px}
.modal-back.dialog{z-index:200}
.dlg-msg{font-size:13px;color:var(--ink-2);line-height:1.55;margin:0 0 8px}
.modal.small h2{margin-bottom:10px}
.modal.small .field{margin-bottom:10px}


/* baseline deltas */
.rb-delta{font-size:10px;font-weight:600;margin-top:2px;letter-spacing:.01em}
.rb-delta.up{color:var(--clay)}
.rb-delta.down{color:var(--moss)}
.rb-delta.same{color:var(--ink-3);font-weight:400}
.rb-base{display:flex;flex-direction:column;gap:3px;padding:9px 0 9px 20px;
  border-left:1px solid var(--line-2);margin-left:auto;white-space:nowrap}
.rb-base .btn{padding:2px 8px}
.rb-base + .rb-status{margin-left:20px;padding-left:20px;border-left:1px solid var(--line-2)}


/* five-section nav */
.tab-btn{display:block;padding:9px 14px}
.nav-num{display:inline-block;width:16px;font-family:var(--mono);font-size:10px;opacity:.5}
.nav-main{font-size:13px}
.nav-hint{display:block;margin-left:16px;font-size:10px;color:#6e8ea4;line-height:1.3}
.tab-btn.active .nav-hint{color:#9fbccf}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 0 16px;border-bottom:1px solid var(--line)}
.subtabs:empty{display:none}
.subtab-btn{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;
  font-size:12.5px;color:var(--ink-2);cursor:pointer}
.subtab-btn:hover{color:var(--deep)}
.subtab-btn.active{color:var(--deep);border-bottom-color:var(--rust);font-weight:600}
/* collapsed ranges */
.range-toggle{float:right;background:none;border:0;padding:0;font-size:10px;color:var(--steel);
  cursor:pointer;font-weight:600;letter-spacing:.02em}
.range-toggle:hover{text-decoration:underline}
.range-toggle.on{color:var(--rust)}
.triple input.bound{background:#fbfcfd;color:var(--ink-2)}
details.trace.adv summary{color:var(--ink-2);font-weight:500}

.derived{padding:6px 9px;background:#f7fafb;border:1px solid var(--line-2);border-radius:var(--r);font-size:13px}
.derived strong{font-family:var(--mono);color:var(--deep)}

@media print{
  /* The app lives in nested flex containers with sticky children, and printing
     through those clips to a single page in most browsers. Everything is
     flattened to block flow for print so the report paginates normally. */
  @page{ size:A4 portrait; margin:14mm 12mm; }

    const pop=()=>{ const top=hi[0]; const lf=hf.pop(), li=hi.pop();
      if(hf.length){ hf[0]=lf; hi[0]=li; let p=0;
        for(;;){ const l=2*p+1, r=l+1; let s=p;
          if(l<hf.length&&hf[l]<hf[s]) s=l;
          if(r<hf.length&&hf[r]<hf[s]) s=r;
          if(s===p) break;
          [hf[p],hf[s]]=[hf[s],hf[p]]; [hi[p],hi[s]]=[hi[s],hi[p]]; p=s; } }
      return top; };
    let guard=0;
    while(hi.length && guard++ < 4000000){
      const u=pop();
      if(closed[u]) continue;
      closed[u]=1;
      if(u===goal){
        const legs=A.offsetNM+B.offsetNM;
        return {ok:true, distanceNM:g[u]+legs, gridNM:g[u],
                snapFromNM:A.offsetNM, snapToNM:B.offsetNM};
      }
      const uj=(u/W)|0, ui=u-uj*W;
      const uLon=lonOf(ui), uLat=latOf(uj);
      for(let k=0;k<MOVES.length;k++){
        const mv=MOVES[k];
        const vj=uj+mv.dy, vi=ui+mv.dx;
        if(vj<0||vj>=H||vi<0||vi>=W) continue;
        const v=vj*W+vi;
        if(!mask[v] || closed[v]) continue;
        let blocked=false;
        for(let m=0;m<mv.via.length;m++){
          const cj=uj+mv.via[m][0], ci=ui+mv.via[m][1];
          if(cj<0||cj>=H||ci<0||ci>=W||!mask[cj*W+ci]){ blocked=true; break; }
        }
        if(blocked) continue;
        const vLon=lonOf(vi), vLat=latOf(vj);
        const nd=g[u]+nm(uLon,uLat,vLon,vLat);
        if(nd<g[v]){ g[v]=nd; push(nd+nm(vLon,vLat,gLon,gLat), v); }
      }
    }
    return {ok:false, reason:'no navigable route found between those positions'};
  }

  function greatCircleNM(a,b,c,d){ return nm(a,b,c,d); }
  function coverage(){ return {box:META.box.slice(), step:META.step}; }
  return {route, snap, greatCircleNM, coverage, isSea, nm};
})();

<script>
/* =========================================================================
   SCOUR PROTECTION & ROCK INSTALLATION PLANNER — CALCULATION ENGINE v3

   Reconciled against a working contractor tender model (116 locations).
   Where that model and this engine agree, this engine reproduces it to
   0.0000%. Where they differ, the difference is deliberate and validate()
   reports it.

   UNITS  length m | area m2 | volume m3 | mass t | density t/m3
          speed kn | distance NM | time h | angle deg
   ========================================================================= */
const Engine = (function(){

/* -------------------------------------------------------------------------
   1. MATERIAL
   -------------------------------------------------------------------------
   Two ways of stating the same thing, both supported because tender models
   use both:

     packing  - "fill factor" in the contractor sense, a solidity fraction
                below 1.   bulk = solid x packing       (0.69 -> 1.83 t/m3)
     porosity - void fraction. bulk = solid x (1 - porosity)

   packing = 1 - porosity, so switching mode converts rather than
   reinterprets.

   volumeAllowance is a separate multiplier at or above 1 on the geometric
   volume for overdumping, spread and settlement. It is NOT a density
   multiplier. Leave it at 1.0 to match a model that carries losses as a
   dumping-time contingency instead.
   ------------------------------------------------------------------------- */
function packingOf(m){ return (m.densityMode==='porosity') ? (1-m.porosity) : m.packingFactor; }
function porosityOf(m){ return 1-packingOf(m); }
function bulkDensity(m){ return m.solidDensity*packingOf(m); }
function tonnesPerGeometricM3(m){ return bulkDensity(m)*(m.volumeAllowance||1); }

/* -------------------------------------------------------------------------
   2. EXACT VOLUME INTEGRATION
   -------------------------------------------------------------------------
   Axisymmetric height field:
       h = t                                  innerR <= r <= topR    (crest)
       h = t (bottomR - r)/(bottomR - topR)   topR   <  r <= bottomR (slope)
   V = 2*pi * INTEGRAL h(r) r dr, evaluated analytically per band.

   Algebraically identical to the truncated-cone form
   V = 1/3 pi t (R^2 + r^2 + R r) - pi/4 Di^2 t,
   because pi r^2 t + (pi/3)(2r+R)(R-r) t == (pi t/3)(r^2 + rR + R^2).
   ------------------------------------------------------------------------- */
function revolvedVolume(p, r0, r1){
  const {innerR, topR, bottomR, thickness} = p;
  if(thickness<=0) return 0;
  const a=Math.max(r0,innerR), b=Math.min(r1,bottomR);
  if(b<=a) return 0;
  let V=0;
  const c0=Math.max(a,innerR), c1=Math.min(b,topR);
  if(c1>c0) V += 2*Math.PI*thickness*(c1*c1-c0*c0)/2;
  const s0=Math.max(a,topR), s1=Math.min(b,bottomR);
  if(s1>s0 && bottomR>topR){
    const k=thickness/(bottomR-topR);
    V += 2*Math.PI*k*( bottomR*(s1*s1-s0*s0)/2 - (s1*s1*s1-s0*s0*s0)/3 );
  }
  return V;
}
function revolvedArea(p, r0, r1){
  const a=Math.max(r0,p.innerR), b=Math.min(r1,p.bottomR);
  return b<=a ? 0 : Math.PI*(b*b-a*a);
}

function normaliseWedges(wedges, p){
  const has = v=> v!==undefined && v!==null && v!=='';
  return (wedges||[]).map(w=>({
    angle: Math.max(0,Math.min(360,w.angleDeg||0)),
    minWidth: Math.max(0, w.minWidth||0),
    rStart: Math.max(p.innerR, has(w.startRadius)? w.startRadius : p.innerR),
    rEnd:   Math.min(p.bottomR, has(w.endRadius)? w.endRadius : p.bottomR),
    orientationDeg: w.orientationDeg||0
  })).filter(w=> (w.angle>0 || w.minWidth>0) && w.rEnd>w.rStart);
}

/* Height of the layer profile at radius r. */
function heightAt(p, r){
  if(r < p.innerR || r > p.bottomR) return 0;
  if(r <= p.topR) return p.thickness;
  if(p.bottomR<=p.topR) return 0;
  return p.thickness*(p.bottomR-r)/(p.bottomR-p.topR);
}

/* Half-angle of a corridor at radius r.
   A corridor of fixed angle pinches to nothing at the pile, so a minimum
   width is also carried: close in, the width governs; further out, the angle
   does. The changeover is at r = (w/2)/sin(alpha/2). */
function wedgeHalfAngle(w, r){
  const byAngle = (w.angle*Math.PI/180)/2;
  const byWidth = w.minWidth>0 ? Math.asin(Math.min(1,(w.minWidth/2)/Math.max(r,1e-9))) : 0;
  return Math.min(Math.PI, Math.max(byAngle, byWidth));
}

/* Rock removed by one corridor.
   With no minimum width and no side slopes the angular share is constant with
   radius, so the analytic profile integral is used and the result is exact.
   Otherwise the share varies with radius and the integral is evaluated
   numerically at a resolution where the residual error is far below any
   engineering tolerance.

   Side slopes: the rock cannot stand vertically at the edge of an exclusion
   zone, it falls away at the design slope on BOTH sides of the corridor. That
   removes an extra n*h^2 per unit length (two triangles of h x n*h / 2). */
function wedgeRemoval(profile, w, slopeRatio, sideSlopes){
  const a = Math.max(w.rStart, profile.innerR);
  const b = Math.min(w.rEnd, profile.bottomR);
  if(b<=a) return {volume:0, area:0};
  if(!(w.minWidth>0) && !sideSlopes){
    const f = w.angle/360;
    return {volume: f*revolvedVolume(profile,a,b), area: f*revolvedArea(profile,a,b)};
  }
  const N=4000, dr=(b-a)/N;
  let V=0, A=0;
  for(let i=0;i<N;i++){
    const r=a+(i+0.5)*dr;
    const h=heightAt(profile,r);
    if(h<=0) continue;
    const th=wedgeHalfAngle(w,r);
    const halfArc=r*th;
    let dV = 2*halfArc*h + (sideSlopes ? slopeRatio*h*h : 0);
    let dA = 2*halfArc;
    const grossV = 2*Math.PI*r*h, grossA = 2*Math.PI*r;
    if(dV>grossV) dV=grossV;
    if(dA>grossA) dA=grossA;
    V+=dV*dr; A+=dA*dr;
  }
  return {volume:V, area:A};
}
function wedgesOverlap(ws){
  const sp=ws.map(w=>{const h=w.angle/2,s=((w.orientationDeg-h)%360+360)%360;
    return {s,e:s+w.angle,rStart:w.rStart,rEnd:w.rEnd};});
  for(let i=0;i<sp.length;i++) for(let j=i+1;j<sp.length;j++){
    const A=sp[i],B=sp[j];
    if(Math.min(A.rEnd,B.rEnd)<=Math.max(A.rStart,B.rStart)) continue;
    for(const k of [-360,0,360]) if(Math.max(A.s,B.s+k)<Math.min(A.e,B.e+k)) return true;
  }
  return false;
}

/* -------------------------------------------------------------------------
   3. LAYER GEOMETRY
   -------------------------------------------------------------------------
   Crest, opening and toe can each be a rule or an absolute dimension,
   because tender designs are issued both ways:

     Scour designs state the crest five different ways, so all five are here
     and the result is always reduced to a crest RADIUS:

       'wall'       R = pile radius + extent          15 m at a 9 m pile -> 19.5 m
                    The extent is a fixed distance beyond the pile wall, so it
                    is the same width whatever the pile. The usual convention.
       'wallFactor' R = pile radius + factor x D      1.55D at 9.5 m -> 19.475 m
                    The extent beyond the wall expressed against the pile.
       'radius'     R = crest radius entered directly
       'factor'     R = factor x D / 2                4.1D at 9.5 m -> 19.475 m
                    A crest DIAMETER as a multiple of the pile.
       'absolute'   R = crest diameter / 2
     innerMode  'clearance' opening radius = pile radius + clearance
                'absolute'  opening diameter entered directly
                'none'      continuous disc (pre-lay) or rock abutting the pile
     toeMode    'slope' toe = thickness x slopeRatio, so the toe lengthens with
                        an upper-bound thickness and the design slope holds in
                        every tolerance case
                'fixed' toe held constant, for a design that fixes the
                        footprint. The implied slope then changes with
                        thickness and validate() reports it.
   ------------------------------------------------------------------------- */
function layerPhase(layer, scour){ return layer.layPhase || scour.layPhase || 'post'; }

/* Shape and lay phase are not independent.

   Pancake is a full disc: rock is placed over the whole circle and there is no
   pile in the middle to deduct. That is only possible before the pile is
   driven, so it is a pre-lay shape only.

   Once the pile is in, the placement is necessarily an annulus. A post-lay
   pancake does not exist, so asking for one resolves to a donut and is
   reported. A donut deducts the pile over the full thickness of the layer, and
   leaves a gap beyond the pile wall as well: rock released from a fallpipe
   rolls inward, so the placement is held off the pile deliberately. The size
   of that gap is the user's to set.

   The same follows through a two-layer system: a post-lay filter placed as a
   donut cannot be covered by a pancake armour, because the pile is still there.
   The armour is a donut too, with its own gap. */
function effectiveShape(shape, phase){
  return (phase==='post' && shape==='pancake') ? 'donut' : shape;
}
function resolveLayer(layer, turbine, scour, tolCase){
  const D=turbine.monopileDiameter, monopileR=D/2;
  /* shape is chosen per layer where set, otherwise per location, otherwise for
     the project, so a pre-lay donut filter under a pancake armour is expressible */
  const requestedShape = layer.shape || turbine.geometryOverride || scour.geometryType;
  const phase = layerPhase(layer, scour);
  const shape = effectiveShape(requestedShape, phase);
  const shapeForced = shape!==requestedShape;

  let vTol=0,hTol=0,sTol=0;
  if(tolCase==='max'){ vTol=layer.vertTolMax; hTol=layer.horizTolMax; sTol=Math.max(0,scour.seabedTolMax); }
  else if(tolCase==='min'){ vTol=layer.vertTolMin; hTol=layer.horizTolMin; sTol=Math.min(0,scour.seabedTolMin); }

  const thickness = Math.max(0, layer.thicknessNom+vTol);
  const extMode = layer.extentMode || 'wall';
  const crestNom = (extMode==='absolute')   ? layer.crestDiameter/2
                 : (extMode==='radius')     ? layer.crestRadius
                 : (extMode==='factor')     ? (layer.topExtentFactor*D)/2
                 : (extMode==='wallFactor') ? monopileR + (layer.wallFactor||0)*D
                 :                            monopileR + (layer.crestOffset||0);
  const topR = Math.max(0, crestNom+hTol);
  const toeLength = (layer.toeMode==='fixed') ? Math.max(0,layer.toeLength) : thickness*layer.slopeRatio;
  const bottomR = topR+toeLength;
  const impliedSlope = thickness>0 ? toeLength/thickness : 0;

  let innerR=0, openingReason='continuous disc';
  const mode = layer.innerMode || 'clearance';
  const isAnnulus = (shape==='donut' || shape==='crescent');
  if(!isAnnulus){
    // full pancake: the whole circle is placed and nothing is deducted
    innerR=0; openingReason='pancake, full disc placed with no deduction';
  } else if(mode==='absolute'){
    innerR=layer.innerDiameter/2; openingReason='opening diameter entered directly';
  } else if(mode==='none'){
    innerR=monopileR; openingReason='rock placed against the pile wall, pile footprint deducted';
  } else {
    innerR=monopileR+(layer.innerClearance||0);
    openingReason=`pile radius plus a ${(layer.innerClearance||0).toFixed(2)} m gap`;
  }

  const profile={innerR,topR,bottomR,thickness};
  // Corridors are cut through the layers that opt in. In the usual arrangement
  // the armour is cut and the filter beneath runs continuously under the
  // exclusion zone, so the cable still lies on filter rock rather than seabed.
  const takesWedges = (shape==='crescent') && (layer.applyWedges!==false);
  const wedges = takesWedges ? normaliseWedges(turbine.wedges, profile) : [];

  return {D,monopileR,shape,requestedShape,shapeForced,phase,takesWedges,
          gap: isAnnulus ? Math.max(0,innerR-monopileR) : 0,
          pileDeducted: isAnnulus,
          thickness,topR,bottomR,innerR,toeLength,impliedSlope,
          extentMode:extMode, crestFromWall: topR-monopileR,
          openingReason,profile,wedges,vTol,hTol,seabedTol:sTol,
          topDiameter:topR*2,bottomDiameter:bottomR*2,innerDiameter:innerR*2,
          clearance: innerR>0 ? innerR-monopileR : 0,
          slopeAngleDeg: impliedSlope>0 ? Math.atan(1/impliedSlope)*180/Math.PI : 90};
}

/* Volume basis.
   'frustum'  the real solid: constant thickness across the crest, tapering
              down the side slope, with the central opening deducted.
   'cylinder' a flat disc of full thickness out to the toe radius, with no
              taper deduction and no opening deducted. A simplified basis: on
              typical monopile geometry it overstates the frustum by around
              10 to 13 per cent. Offered so a quantity prepared that way can be
              reconciled against this engine line for line. */
function layerVolume(layer, turbine, scour, tolCase){
  const g = resolveLayer(layer, turbine, scour, tolCase);
  const cylinder = (layer.volumeBasis==='cylinder');
  const grossVolume = cylinder
      ? Math.PI*g.bottomR*g.bottomR*g.thickness
      : revolvedVolume(g.profile, g.innerR, g.bottomR);
  const grossArea   = cylinder
      ? Math.PI*g.bottomR*g.bottomR
      : revolvedArea(g.profile, g.innerR, g.bottomR);
  let wedgeVolume=0, wedgeArea=0;
  const sideSlopes = scour.wedgeSideSlopes!==false;
  const nSlope = (layer.toeMode==='fixed' && layer.thicknessNom>0)
      ? layer.toeLength/layer.thicknessNom : layer.slopeRatio;
  g.wedges.forEach(w=>{
    const rem = wedgeRemoval(g.profile, w, nSlope, sideSlopes);
    wedgeVolume += rem.volume;
    wedgeArea   += rem.area;
  });
  if(wedgeVolume>grossVolume) wedgeVolume=grossVolume;
  if(wedgeArea>grossArea) wedgeArea=grossArea;
  const geometricVolume = Math.max(0, grossVolume-wedgeVolume);
  const footprintArea   = Math.max(0, grossArea-wedgeArea);

  const bears = layer.seabedBearing!==false;
  const share = Math.max(0,Math.min(1,(scour.seabedAdverseSharePct===undefined?50:scour.seabedAdverseSharePct)/100));
  const seabedVolume = (scour.applySeabedTolerance && bears) ? footprintArea*g.seabedTol*share : 0;

  const designVolume = Math.max(0, geometricVolume+seabedVolume);
  const placedVolume = designVolume*(layer.material.volumeAllowance||1);
  const bulk = bulkDensity(layer.material);
  return {geom:g, basis:(cylinder?'cylinder':'frustum'),
          grossVolume, wedgeVolume, geometricVolume, footprintArea, seabedVolume,
          designVolume, placedVolume, bulkDensity:bulk, tonnage:placedVolume*bulk,
          coverageFrac: grossVolume>0 ? geometricVolume/grossVolume : 1};
}


/* -------------------------------------------------------------------------
   DESIGN GROUPS
   -------------------------------------------------------------------------
   A real field is not one design repeated. Locations fall into bands that
   share a monopile diameter, a rock grade and a layer thickness, and a tender
   is priced and reported band by band with a count against each.

   A group overrides, per layer, only the parameters that actually vary between
   bands: grade, thickness, crest extent, slope, density, fill factor and
   spillage, plus the monopile diameter for its locations. Everything else
   (tolerances, lay phase, corridors, dumping rate, seabed bearing) stays with
   the layer, so it is defined once.

   A location with no group uses the layer as defined and its own diameter.
   ------------------------------------------------------------------------- */
const GROUP_LAYER_FIELDS = ['grade','thicknessNom','extentMode','topExtentFactor',
                            'crestDiameter','crestOffset','crestRadius','wallFactor','slopeRatio','shape','toeMode','toeLength',
                            'volumeBasis','vertTolMin','vertTolMax','horizTolMin','horizTolMax'];

function findGroup(scour, turbine){
  if(!turbine || !turbine.groupId || !scour.groups) return null;
  return scour.groups.find(g=>g.id===turbine.groupId) || null;
}
function effectiveLayer(layer, group){
  if(!group || !group.layers || !group.layers[layer.id]) return layer;
  const o = group.layers[layer.id];
  const out = Object.assign({}, layer);
  GROUP_LAYER_FIELDS.forEach(k=>{
    if(o[k]!==undefined && o[k]!==null && o[k]!=='') out[k]=o[k];
  });
  if(o.solidDensity!==undefined || o.packingFactor!==undefined || o.volumeAllowance!==undefined){
    out.material = Object.assign({}, layer.material);
    if(o.solidDensity!==undefined && o.solidDensity!=='')   out.material.solidDensity=o.solidDensity;
    if(o.packingFactor!==undefined && o.packingFactor!==''){
      out.material.densityMode='packing';
      out.material.packingFactor=o.packingFactor;
      out.material.porosity=1-o.packingFactor;
    }
    if(o.volumeAllowance!==undefined && o.volumeAllowance!=='') out.material.volumeAllowance=o.volumeAllowance;
  }
  return out;
}
function effectiveTurbine(turbine, group){
  if(!group || !(group.mpOD>0)) return turbine;
  return Object.assign({}, turbine, {monopileDiameter:group.mpOD});
}
/* The layers and the turbine as they actually apply at one location. */
function resolveContext(scour, turbine){
  const g = findGroup(scour, turbine);
  return {group:g, turbine:effectiveTurbine(turbine,g),
          layers:(scour.layers||[]).map(L=>effectiveLayer(L,g))};
}

/* -------------------------------------------------------------------------
   4. THREE QUANTITIES
     nominal     as drawn
     envelope    every tolerance adverse at once; an exposure limit
     operational what is procured and scheduled against
   ------------------------------------------------------------------------- */
/* The operational quantity is what gets procured and scheduled, so it must
   never be able to fall below what the specification can legitimately demand.

   The upper tolerance bound is therefore the default base, and any contingency
   is applied ON TOP of it. An earlier version let a "nominal plus contingency"
   basis replace the tolerance calculation, which meant a change to a tolerance
   moved nothing downstream and the tool could call for materially less rock
   than the design allows. Running short offshore is the expensive failure, so
   the safe direction is the default and the unsafe one has to be chosen
   deliberately and is flagged wherever it appears. */
function operationalFactor(scour){
  const nominalOnly = (scour.procurementBasis==='nominal');
  const c = (scour.contingencyPct===undefined?0:scour.contingencyPct)/100;
  const pct = (c*100).toFixed(0);
  return {
    basis: nominalOnly ? 'nominal' : 'envelope',
    contingency: c,
    excludesTolerances: nominalOnly,
    describe: nominalOnly
      ? (c ? `nominal plus ${pct}% contingency, tolerances excluded`
           : 'nominal design quantity, tolerances excluded')
      : (c ? `upper tolerance bound plus ${pct}% contingency`
           : 'upper tolerance bound')
  };
}
function applyOperational(nom, env, scour){
  const f=operationalFactor(scour);
  const base = f.basis==='nominal' ? nom : env;
  return base*(1+(f.contingency||0));
}

function turbineQuantity(turbine, scour){
  const ctx = resolveContext(scour, turbine);
  const out={byLayer:{}, group:ctx.group, effTurbine:ctx.turbine, effLayers:ctx.layers};
  ['nom','min','max'].forEach(tc=>{ out[tc]={designVolume:0,placedVolume:0,tonnage:0,layers:{}}; });
  ctx.layers.forEach(L=>{
    out.byLayer[L.id]={};
    ['nom','min','max'].forEach(tc=>{
      const r=layerVolume(L,ctx.turbine,scour,tc);
      out.byLayer[L.id][tc]=r; out[tc].layers[L.id]=r;
      out[tc].designVolume+=r.designVolume;
      out[tc].placedVolume+=r.placedVolume;
      out[tc].tonnage+=r.tonnage;
    });
    out.byLayer[L.id].operational={
      designVolume: applyOperational(out.byLayer[L.id].nom.designVolume,out.byLayer[L.id].max.designVolume,scour),
      tonnage:      applyOperational(out.byLayer[L.id].nom.tonnage,     out.byLayer[L.id].max.tonnage,     scour)
    };
  });
  out.operational={
    designVolume: applyOperational(out.nom.designVolume,out.max.designVolume,scour),
    placedVolume: applyOperational(out.nom.placedVolume,out.max.placedVolume,scour),
    tonnage:      applyOperational(out.nom.tonnage,     out.max.tonnage,     scour),
    layers:{}, basis:operationalFactor(scour)
  };
  ctx.layers.forEach(L=>{ out.operational.layers[L.id]=out.byLayer[L.id].operational; });
  return out;
}

function projectQuantity(state){
  const sc=state.scour;
  const rows=state.turbines.map(t=>({turbine:t,q:turbineQuantity(t,sc)}));
  const blank=()=>({designVolume:0,placedVolume:0,tonnage:0,layers:{}});
  const totals={nom:blank(),min:blank(),max:blank(),operational:blank()};
  ['nom','min','max','operational'].forEach(tc=> sc.layers.forEach(L=>{
    totals[tc].layers[L.id]={designVolume:0,tonnage:0}; }));
  rows.forEach(r=>{
    ['nom','min','max','operational'].forEach(tc=>{
      const q = tc==='operational'? r.q.operational : r.q[tc];
      totals[tc].designVolume+=q.designVolume;
      totals[tc].placedVolume+=(q.placedVolume||0);
      totals[tc].tonnage+=q.tonnage;
      sc.layers.forEach(L=>{
        const lq = tc==='operational'? r.q.byLayer[L.id].operational : r.q.byLayer[L.id][tc];
        totals[tc].layers[L.id].designVolume+=lq.designVolume;
        totals[tc].layers[L.id].tonnage+=lq.tonnage;
      });
    });
  });
  totals.operational.basis=operationalFactor(sc);

  /* Group roll-up, in the shape a tender summary needs: the per-location
     design and installed figures for the band, and the band total. */
  const byGroup = new Map();
  rows.forEach(r=>{
    const g = r.q.group;
    const key = g ? g.id : '_ungrouped';
    if(!byGroup.has(key)) byGroup.set(key,{
      id:key, group:g, name: g? g.name : 'Ungrouped', count:0, ids:[],
      layers:{}, totalDesignMass:0, totalInstalledMass:0,
      totalDesignVolume:0, totalInstalledVolume:0});
    const e=byGroup.get(key);
    e.count++; e.ids.push(r.turbine.id);
    sc.layers.forEach(L=>{
      const lq=r.q.byLayer[L.id];
      if(!lq) return;
      if(!e.layers[L.id]) e.layers[L.id]={
        perLocDesignVolume:0, perLocDesignMass:0,
        perLocInstalledVolume:0, perLocInstalledMass:0, n:0,
        eff: (r.q.effLayers||[]).find(x=>x.id===L.id) || L,
        geom: lq.nom.geom};
      const a=e.layers[L.id];
      a.perLocDesignVolume += lq.nom.designVolume;
      a.perLocDesignMass   += lq.nom.tonnage;
      a.perLocInstalledVolume += lq.max.designVolume;
      a.perLocInstalledMass   += lq.max.tonnage;
      a.n++;
    });
  });
  byGroup.forEach(e=>{
    sc.layers.forEach(L=>{
      const a=e.layers[L.id]; if(!a||!a.n) return;
      a.perLocDesignVolume/=a.n; a.perLocDesignMass/=a.n;
      a.perLocInstalledVolume/=a.n; a.perLocInstalledMass/=a.n;
      a.groupDesignVolume    = a.perLocDesignVolume*e.count;
      a.groupDesignMass      = a.perLocDesignMass*e.count;
      a.groupInstalledVolume = a.perLocInstalledVolume*e.count;
      a.groupInstalledMass   = a.perLocInstalledMass*e.count;
      e.totalDesignVolume    += a.groupDesignVolume;
      e.totalDesignMass      += a.groupDesignMass;
      e.totalInstalledVolume += a.groupInstalledVolume;
      e.totalInstalledMass   += a.groupInstalledMass;
    });
  });
  const groups=[...byGroup.values()];

  const rw=state.cycle.reworkProbabilityPct/100*state.cycle.reworkRockPct/100;
  ['nom','min','max','operational'].forEach(tc=>{
    totals[tc].reworkTonnage=totals[tc].tonnage*rw;
    totals[tc].tonnageWithRework=totals[tc].tonnage*(1+rw);
  });
  return {rows,totals,groups,reworkFactor:rw};
}

/* -------------------------------------------------------------------------
   5. VESSEL CARGO — deadweight or hopper volume, whichever binds
   ------------------------------------------------------------------------- */
/* The quay rate and the vessel's own loading capability both cap loading.
   Whichever is slower governs, and it feeds straight through to trip time and
   therefore to the campaign duration. */
function effectiveLoadRate(vessel, quarry){
  const v = vessel.loadingRateTph.nom>0 ? vessel.loadingRateTph.nom : Infinity;
  const q = (quarry && quarry.loadingRateTPerHour>0) ? quarry.loadingRateTPerHour : Infinity;
  const rate = Math.min(v,q);
  return {rate: isFinite(rate)?rate:0,
          vesselRate: isFinite(v)?v:0, quayRate: isFinite(q)?q:0,
          limitedBy: q<v ? 'quay' : (v<q ? 'vessel' : 'both equal')};
}

/* Cargo capacity is the payload the vessel can carry, in tonnes, and it
   governs. A hold volume limit is optional and only applies if one is entered:
   it exists for the case of light rock in a volume-limited hold, and must never
   quietly override the payload figure the user actually typed. */
function vesselCargo(vessel, effBulk){
  const util=(vessel.utilizationPct===undefined?100:vessel.utilizationPct)/100;
  const byWeight=vessel.capacityT.nom*util;
  const hold=vessel.hopperVolumeM3;
  const byVolume=(hold>0) ? hold*effBulk*util : Infinity;
  const volumeLimits = isFinite(byVolume) && byVolume<byWeight;
  return {cargo: volumeLimits?byVolume:byWeight, byWeight, byVolume,
          holdSet: hold>0, volumeLimits,
          limitedBy: volumeLimits?'hold volume':'cargo capacity'};
}

/* How many whole locations one cargo covers, and what is left on board. */
function cargoFit(cargoT, perLocationT){
  if(!(cargoT>0)||!(perLocationT>0)) return {whole:0, leftover:0};
  const whole=Math.floor(cargoT/perLocationT + 1e-9);
  return {whole, leftover: cargoT - whole*perLocationT};
}

/* -------------------------------------------------------------------------
   6. CYCLE SIMULATION
   -------------------------------------------------------------------------
   Each activity is charged where it actually occurs:
     per trip     load, laden transit, ballast transit, port turnaround
     per visit    approach and DP positioning, fallpipe deploy and retrieve,
                  in-field move if not the first visit of the trip
     per location pre-survey before the first placement, post-survey after the
                  last, expected rework once
     per tonne    dumping, at the rate belonging to that rock layer

   splitPolicy
     'complete' a location is only started if its whole remaining requirement
                fits in the cargo on board; otherwise the vessel returns with
                the remainder and tops up. This is what a real campaign does
                and what the reference tender model does. A location larger
                than a full cargo is split regardless, since it must be.
     'split'    a location may be placed across several trips.

   campaignMode
     'combined'   all layers placed on one visit
     'sequential' a full pass of the field per layer, as when the filter is
                  placed pre-pile and the armour post-pile
   ------------------------------------------------------------------------- */
/* A rate left at zero used to divide through and produce infinite hours, which
   propagated to an invalid completion date and threw. Any non-positive rate now
   contributes no time and validate() reports it as an error to fix. */
function hoursAt(quantity, rate){
  return (rate>0 && isFinite(rate) && isFinite(quantity)) ? quantity/rate : 0;
}
function simulateVessel(vessel, locations, params){
  const {distanceNM, fieldMoveNM, cycle, cargoPerTrip} = params;
  const loadRate = params.loadRateTph>0 ? params.loadRateTph : vessel.loadingRateTph.nom;
  const split = (params.splitPolicy||'complete')==='split';
  const acc={loading:0,ladenTransit:0,ballastTransit:0,fieldTransit:0,positioning:0,
             fallpipeDeploy:0,fallpipeRetrieve:0,dumping:0,preSurvey:0,postSurvey:0,
             portTurnaround:0,rework:0};
  const trips=[];
  const queue=locations.map(l=>({id:l.id, started:false,
    parts:l.layers.map(x=>({layerId:x.layerId, remaining:x.tonnes, rate:x.rateTph}))}));
  const left = l=> l.parts.reduce((a,p)=>a+p.remaining,0);
  const totalNeed = queue.reduce((a,l)=>a+left(l),0);
  if(cargoPerTrip<=0 || totalNeed<=0)
    return {cargoPerTrip,trips:[],visits:0,acc,offshoreHours:0,portHours:0,totalHours:0,leftoverReturned:0};

  const dumpCont = 1+(cycle.dumpingContingencyPct||0)/100;
  /* A location counts as fitting the cargo remaining when the shortfall is
     within a tenth of a per cent of its requirement. Without this a rounding
     difference of a few tens of kilograms on a 30,000 t cargo would reject a
     whole location and add an entire trip, which is a modelling artefact
     rather than an operational reality: placement tolerance is orders of
     magnitude larger than that. */
  const FIT_TOL = 0.001;
  let leftover=0, leftoverReturned=0, guard=0;

  while(queue.some(l=>left(l)>1e-6) && guard++<200000){
    const outstanding = queue.reduce((a,l)=>a+left(l),0);
    const topUp = Math.max(0, Math.min(cargoPerTrip-leftover, outstanding-leftover));
    acc.loading += hoursAt(topUp, loadRate);
    acc.portTurnaround += cycle.portTurnaroundHr;
    acc.ladenTransit += hoursAt(distanceNM, vessel.ladenSpeedKn.nom);
    let cargo = leftover+topUp;
    const trip={loaded:cargo,toppedUp:topUp,visits:[]};
    let first=true, progressed=false;

    while(cargo>1e-6){
      let loc=null, need0=0;
      for(const l of queue){
        const need=left(l);
        if(need<=1e-6) continue;
        // serve it if it fits, or if it could never fit a full cargo anyway
        if(split || need<=cargo*(1+FIT_TOL) || need>cargoPerTrip*(1+FIT_TOL)){ loc=l; need0=need; break; }
      }
      if(!loc) break;
      if(!first) acc.fieldTransit += hoursAt(fieldMoveNM, vessel.fieldSpeedKn.nom);
      if(!loc.started){ acc.preSurvey += cycle.preSurveyHr; loc.started=true; }
      acc.positioning += cycle.positioningHr;
      acc.fallpipeDeploy += vessel.fallpipeDeployHr.nom;
      let placed=0;
      for(const p of loc.parts){
        if(p.remaining<=1e-6 || cargo<=1e-6) continue;
        const t=Math.min(p.remaining,cargo);
        acc.dumping += hoursAt(t, p.rate)*dumpCont;
        p.remaining-=t; cargo-=t; placed+=t;
      }
      acc.fallpipeRetrieve += vessel.fallpipeRetrieveHr.nom;
      // a residue inside the fit tolerance is treated as placed
      const residue=left(loc);
      if(residue>0 && residue<=need0*FIT_TOL) loc.parts.forEach(p=>{p.remaining=0;});
      trip.visits.push({id:loc.id,tonnes:placed,completed:left(loc)<=1e-6});
      if(left(loc)<=1e-6){
        acc.postSurvey += cycle.postSurveyHr;
        acc.rework += (cycle.reworkProbabilityPct/100)*cycle.reworkExtraHr;
      }
      first=false; progressed=true;
      if(placed<=1e-6) break;
    }
    acc.ballastTransit += hoursAt(distanceNM, vessel.ballastSpeedKn.nom);
    leftover=cargo;
    if(leftover>1e-6) leftoverReturned+=leftover;
    trip.leftover=leftover;
    trips.push(trip);
    if(!progressed) break;
  }

  const portHours=acc.loading+acc.portTurnaround;
  const offshoreHours=acc.ladenTransit+acc.ballastTransit+acc.fieldTransit+acc.positioning+
    acc.fallpipeDeploy+acc.fallpipeRetrieve+acc.dumping+acc.preSurvey+acc.postSurvey+acc.rework;
  return {cargoPerTrip,trips,visits:trips.reduce((a,t)=>a+t.visits.length,0),acc,
          offshoreHours,portHours,totalHours:offshoreHours+portHours,leftoverReturned};
}

function applyWeather(sim, weather){
  const f=1-Math.min(0.9,Math.max(0,weather.downtimePct/100));
  const offshore=sim.offshoreHours/f;
  const port=weather.offshoreOnly ? sim.portHours : sim.portHours/f;
  return {offshoreHours:offshore, portHours:port, workingHours:sim.totalHours,
          elapsedHours:offshore+port, weatherFactor:f};
}

function meanNearestNeighbourNM(turbines){
  if(turbines.length<2) return 0;
  let s=0;
  turbines.forEach(a=>{
    let best=Infinity;
    turbines.forEach(b=>{ if(a!==b){const d=Math.hypot(a.x-b.x,a.y-b.y); if(d<best)best=d;} });
    if(isFinite(best)) s+=best;
  });
  return (s/turbines.length)/1852;
}

/* -------------------------------------------------------------------------
   7. FLEET SCHEDULE
   Adds the allowances a tender programme carries on top of vessel time:
   a maintenance and standby percentage, and mobilisation/demobilisation days.
   ------------------------------------------------------------------------- */
/* Campaign structure.
   Layers in different lay phases cannot share a visit: a pre-lay layer goes in
   before the pile exists and a post-lay layer after it is installed, so each
   phase is at least one separate pass of the field. Within a phase, layers are
   either placed together on one visit or given a pass each. */
function campaignGroups(scour, mode){
  const layers = scour.layers||[];
  if(mode==='sequential') return layers.map(L=>({phase:layerPhase(L,scour), layers:[L]}));
  const out=[];
  ['pre','post'].forEach(ph=>{
    const g = layers.filter(L=>layerPhase(L,scour)===ph);
    if(g.length) out.push({phase:ph, layers:g});
  });
  return out.length?out:[{phase:'post', layers:[]}];
}
function campaignLabel(scour, mode){
  return campaignGroups(scour,mode).map(g=>
    `${g.phase==='pre'?'pre-lay':'post-lay'} ${g.layers.map(L=>L.name).join(' + ')}`).join(', then ');
}

function fleetSchedule(state){
  const sc=state.scour;
  const roll=projectQuantity(state);
  const active=state.vessels.filter(v=>v.active);
  const rf=1+roll.reworkFactor;

  const byVessel={};
  active.forEach(v=> byVessel[v.id]={vessel:v,locs:[]});
  const pool=[];
  roll.rows.forEach(r=>{
    const eff=r.q.effLayers||sc.layers;
    const layers=sc.layers.map((L,i)=>({
      layerId:L.id, name:L.name,
      tonnes:r.q.byLayer[L.id].operational.tonnage*rf,
      rateTph:(eff[i]&&eff[i].dumpRateTph?eff[i].dumpRateTph.nom:L.dumpRateTph.nom)
    })).filter(x=>x.tonnes>1e-6);
    const e={id:r.turbine.id, layers, tonnes:layers.reduce((a,x)=>a+x.tonnes,0)};
    if(r.turbine.vesselId && byVessel[r.turbine.vesselId]) byVessel[r.turbine.vesselId].locs.push(e);
    else pool.push(e);
  });
  if(active.length) pool.forEach(e=>{
    let best=null,bt=Infinity;
    active.forEach(v=>{const t=byVessel[v.id].locs.reduce((a,x)=>a+x.tonnes,0); if(t<bt){bt=t;best=v;}});
    byVessel[best.id].locs.push(e);
  });

  const fieldMoveNM = state.quarry.fieldMoveOverrideNM>0
    ? state.quarry.fieldMoveOverrideNM : meanNearestNeighbourNM(state.turbines);

  let wSum=0,wT=0;
  sc.layers.forEach(L=>{
    const t=roll.totals.operational.layers[L.id].tonnage;
    wSum+=bulkDensity(L.material)*t; wT+=t;
  });
  const effBulkDensity = wT>0 ? wSum/wT : (sc.layers[0]?bulkDensity(sc.layers[0].material):1.6);

  const perVessel=Object.values(byVessel).map(entry=>{
    const cg=vesselCargo(entry.vessel,effBulkDensity);
    const lr=effectiveLoadRate(entry.vessel, state.quarry);
    const base={distanceNM:state.quarry.distanceNM, fieldMoveNM, cycle:state.cycle,
                cargoPerTrip:cg.cargo, splitPolicy:state.cycle.splitPolicy,
                loadRateTph:lr.rate};
    const groups = campaignGroups(sc, state.cycle.campaignMode);
    const parts = groups.map(gr=>{
      const ids = gr.layers.map(L=>L.id);
      const locs = entry.locs.map(l=>{
        const lay = l.layers.filter(x=>ids.indexOf(x.layerId)>=0);
        return lay.length ? {id:l.id, layers:lay} : null;
      }).filter(Boolean);
      const p = simulateVessel(entry.vessel, locs, base);
      p.phase = gr.phase;
      p.label = `${gr.phase==='pre'?'pre-lay':'post-lay'} ${gr.layers.map(L=>L.name).join(' + ')}`;
      return p;
    });
    let sim = parts.reduce((a,p)=>{
      if(!a) return {cargoPerTrip:p.cargoPerTrip, trips:p.trips.slice(), visits:p.visits,
                     acc:Object.assign({},p.acc), offshoreHours:p.offshoreHours,
                     portHours:p.portHours, totalHours:p.totalHours,
                     leftoverReturned:p.leftoverReturned};
      Object.keys(p.acc).forEach(k=> a.acc[k]+=p.acc[k]);
      a.trips=a.trips.concat(p.trips); a.visits+=p.visits;
      a.offshoreHours+=p.offshoreHours; a.portHours+=p.portHours;
      a.totalHours+=p.totalHours; a.leftoverReturned+=p.leftoverReturned;
      return a;
    }, null) || simulateVessel(entry.vessel, [], base);
    sim.campaigns = parts.length;
    sim.parts = parts;
    const wx=applyWeather(sim,state.weather);
    const maint=1+(state.cycle.maintenancePct||0)/100;
    let withMaint=wx.elapsedHours*maint;
    if(!isFinite(withMaint)) withMaint=0;
    return {vessel:entry.vessel, locs:entry.locs, cargoInfo:cg, loadRate:lr,
            tonnes:entry.locs.reduce((a,x)=>a+x.tonnes,0), sim, weather:wx,
            maintenanceHours:withMaint-wx.elapsedHours, elapsedHours:withMaint,
            days: withMaint/24 + (state.cycle.mobDemobDays||0)};
  });

  let projectDays=perVessel.length? Math.max(...perVessel.map(p=>p.days)) : 0;
  if(!isFinite(projectDays)) projectDays=0;
  const totalTrips=perVessel.reduce((a,p)=>a+p.sim.trips.length,0);
  const totalVisits=perVessel.reduce((a,p)=>a+p.sim.visits,0);
  const sailingNM=perVessel.reduce((a,p)=> a+p.sim.trips.length*state.quarry.distanceNM*2
      + Math.max(0,p.sim.visits-p.sim.trips.length)*fieldMoveNM, 0);
  return {roll, perVessel, projectDays, projectHours:projectDays*24, totalTrips,
          totalVisits, fieldMoveNM, effBulkDensity, sailingNM};
}

/* -------------------------------------------------------------------------
   8. VALIDATION
   ------------------------------------------------------------------------- */
/* Collapse a list of location ids into readable ranges:
   WTG-001..WTG-100 becomes "WTG-001 to WTG-100 (100 locations)". */
function compressIds(ids){
  if(!ids.length) return '';
  if(ids.length===1) return ids[0];
  const m = ids.map(id=>/^(.*?)(\d+)$/.exec(String(id)));
  if(m.every(Boolean) && new Set(m.map(x=>x[1])).size===1){
    const prefix=m[0][1], width=m[0][2].length;
    const nums=m.map(x=>parseInt(x[2],10)).sort((a,b)=>a-b);
    const runs=[]; let a=nums[0], p=nums[0];
    for(let i=1;i<nums.length;i++){
      if(nums[i]===p+1 || nums[i]===p){ p=nums[i]; continue; }
      runs.push([a,p]); a=p=nums[i];
    }
    runs.push([a,p]);
    const nm=n=>prefix+String(n).padStart(width,'0');
    const parts=runs.map(([x,y])=> x===y ? nm(x) : (y===x+1 ? nm(x)+', '+nm(y) : nm(x)+' to '+nm(y)));
    const tail = ` (${ids.length} locations)`;
    if(parts.length<=4) return parts.join(', ')+tail;
    return parts.slice(0,3).join(', ')+`, and ${parts.length-3} further ranges`+tail;
  }
  if(ids.length<=5) return ids.join(', ');
  return ids.slice(0,3).join(', ')+`, and ${ids.length-3} more (${ids.length} locations)`;
}

function fmt2(v){ return (Math.round(v*100)/100).toFixed(2); }
function validate(state){
  const out=[], err=m=>out.push({level:'error',msg:m}), warn=m=>out.push({level:'warn',msg:m});
  const s=state, sc=s.scour;
  if(!sc.layers || !sc.layers.length){ err('No rock layers defined.'); return out; }

  /* Per-location findings are collected against a key so that an identical
     finding at many locations is reported once, with the ids compressed into
     ranges, instead of once per location. */
  const grouped = new Map();
  const addLoc = (key, level, template, id)=>{
    if(!grouped.has(key)) grouped.set(key,{level, template, ids:[]});
    grouped.get(key).ids.push(id);
  };

  sc.layers.forEach(L=>{
    const n=L.name;
    if(L.thicknessNom<=0) err(`${n}: thickness must be greater than zero.`);
    const em=L.extentMode||'wall';
    if(em==='wall'       && !((L.crestOffset||0)>0)) err(`${n}: the crest extent from the pile wall must be greater than zero.`);
    if(em==='wallFactor' && !((L.wallFactor||0)>0))  err(`${n}: the crest extent factor must be greater than zero.`);
    if(em==='radius'     && !(L.crestRadius>0))      err(`${n}: the crest radius must be greater than zero.`);
    if(em==='factor'     && !(L.topExtentFactor>0))  err(`${n}: the crest extent factor must be greater than zero.`);
    if(em==='absolute'   && !(L.crestDiameter>0))    err(`${n}: the crest diameter must be greater than zero.`);
    if(em==='factor'||em==='wallFactor')
      warn(`${n}: the crest extent is tied to the pile diameter, so it scales with the pile. On a field with more than one pile size the protection will be wider at the larger piles. Use a fixed distance from the wall if the design intends the same width everywhere.`);
    if(L.dumpRateTph.nom<=0) err(`${n}: dumping rate must be greater than zero, otherwise the placing time for this layer counts as zero.`);
    const pk=packingOf(L.material);
    if(!(pk>0) || pk>=1) err(`${n}: fill factor must be between 0 and 1. It is a solidity fraction, so bulk density = solid density x fill factor.`);
    else if(pk<0.5||pk>0.78) warn(`${n}: a fill factor of ${pk.toFixed(2)} gives a placed density of ${bulkDensity(L.material).toFixed(2)} t/m3. Placed quarry rock normally sits between 0.55 and 0.72.`);
    if(L.material.solidDensity<2.0||L.material.solidDensity>3.3) warn(`${n}: solid density of ${L.material.solidDensity} t/m3 is outside the usual range for quarried rock.`);
    if((L.material.volumeAllowance||1)<1) warn(`${n}: a volume allowance below 1.0 assumes less rock is placed than the design volume.`);
    if(L.toeMode==='slope'&&L.slopeRatio<1.5) warn(`${n}: a 1:${L.slopeRatio} slope is steeper than the angle of repose of loose rock and is unlikely to be achievable by fallpipe placement.`);
    if(L.toeMode==='fixed'&&s.turbines.length){
      const t0=s.turbines[0];
      const gn=resolveLayer(L,t0,sc,'nom'), gx=resolveLayer(L,t0,sc,'max');
      if(Math.abs(gn.impliedSlope-gx.impliedSlope)>0.05)
        warn(`${n}: the toe is fixed at ${L.toeLength} m, so thickening the layer to its upper tolerance steepens the slope from 1:${gn.impliedSlope.toFixed(2)} to 1:${gx.impliedSlope.toFixed(2)}. Holding 1:${gn.impliedSlope.toFixed(1)} would need a ${(gx.thickness*gn.impliedSlope).toFixed(2)} m toe and would add rock. Use a slope-driven toe unless the specification genuinely fixes the footprint.`);
      if(gx.impliedSlope<1.5&&gx.impliedSlope>0)
        warn(`${n}: at the upper tolerance the implied slope is 1:${gx.impliedSlope.toFixed(2)}, steeper than loose rock will stand.`);
    }
    if(L.volumeBasis==='cylinder')
      warn(`${n}: volume is on the simplified flat-cylinder basis, so the sloped toe is not deducted and the pile footprint is included. That suits reconciling against an estimate prepared the same way, but it overstates the placed solid, typically by 10 to 13 per cent on monopile geometry.`);
    if(layerPhase(L,sc)==='post' && (L.shape||sc.geometryType)==='pancake')
      warn(`${n} is placed post-lay, so a full pancake is not available: the pile is already in the water. It is being calculated as a donut with a ${fmt2(L.innerClearance||0)} m gap to the pile wall. Set the gap on the layer.`);
    if(effectiveShape(L.shape||sc.geometryType, layerPhase(L,sc))!=='pancake'
       && (L.innerMode||'clearance')==='clearance' && !((L.innerClearance||0)>0))
      warn(`${n}: no gap to the pile wall is set. Rock released from a fallpipe rolls inward, so a donut is normally held off the pile by a deliberate clearance.`);
    if(L.horizTolMax===0&&L.vertTolMax>0)
      warn(`${n}: a vertical tolerance of +${L.vertTolMax} m is set but the horizontal tolerance is zero. Check whether the specification also allows the footprint to grow, since that quantity is easy to leave unbooked.`);
  });

  if(s.turbines.length&&sc.layers.length>1){
    const t0=s.turbines[0];
    for(let i=1;i<sc.layers.length;i++){
      const below=resolveLayer(sc.layers[i-1],t0,sc,'nom');
      const above=resolveLayer(sc.layers[i],t0,sc,'nom');
      if(above.bottomR>below.topR+0.5)
        warn(`${sc.layers[i].name} toe (R ${above.bottomR.toFixed(2)} m) reaches beyond the ${sc.layers[i-1].name} crest (R ${below.topR.toFixed(2)} m), so part of it would rest on the seabed rather than on the layer below.`);
      if(above.innerR<below.innerR-0.01)
        warn(`${sc.layers[i].name} opening (R ${above.innerR.toFixed(2)} m) is inside the ${sc.layers[i-1].name} opening (R ${below.innerR.toFixed(2)} m), leaving it unsupported at the pile.`);
    }
  }

  s.turbines.forEach(t=>{
    const mpEff=(findGroup(sc,t)&&findGroup(sc,t).mpOD>0)?findGroup(sc,t).mpOD:t.monopileDiameter;
    if(mpEff<=0) addLoc('D0','error', sco=>`${sco}: monopile diameter must be greater than zero, either on the location or on its design group.`, t.id);
    if(t.waterDepth<=0)       addLoc('WD0','error', sco=>`${sco}: water depth must be greater than zero.`, t.id);
    const shape=t.geometryOverride||sc.geometryType;
    if(shape==='crescent'){
      const ctxW=resolveContext(sc,t);
      const g=resolveLayer(ctxW.layers[ctxW.layers.length-1],ctxW.turbine,sc,'nom');
      const tot=g.wedges.reduce((a,w)=>a+w.angle,0);
      if(!g.wedges.length) addLoc('noWedge','warn', sco=>`${sco}: crescent geometry selected but no cable corridors defined, so these calculate as a plain donut.`, t.id);
      if(tot>=330) addLoc('bigWedge|'+tot.toFixed(0),'warn', sco=>`${sco}: cable corridors remove ${tot.toFixed(0)} degrees, leaving almost no protection.`, t.id);
      if(wedgesOverlap(g.wedges)) addLoc('overlap','warn', sco=>`${sco}: cable corridors overlap over a shared radius band, so the removed volume is double counted.`, t.id);
    }
    const ctxV=resolveContext(sc,t);
    ctxV.layers.forEach(L=>{
      const g=resolveLayer(L,ctxV.turbine,sc,'nom');
      if(g.innerR>=g.topR)
        addLoc('openTooBig|'+L.id,'error',
          sco=>`${sco} / ${L.name}: the opening radius reaches the crest radius, so no rock would be placed.`, t.id);
      if(g.innerR>0&&g.innerR<g.monopileR-0.01)
        addLoc('openTooSmall|'+L.id,'error',
          sco=>`${sco} / ${L.name}: the opening is smaller than the pile.`, t.id);
      if(sc.layPhase==='post'&&g.clearance>=0&&g.clearance<0.1)
        addLoc('tightClear|'+L.id+'|'+(g.clearance*1000).toFixed(0),'warn',
          sco=>`${sco} / ${L.name}: only ${(g.clearance*1000).toFixed(0)} mm of clearance to the pile wall. Confirm the placement tolerance can hold that.`, t.id);
    });
  });

  grouped.forEach(v=>{
    out.push({level:v.level, msg:v.template(compressIds(v.ids)), count:v.ids.length});
  });

  const active=s.vessels.filter(v=>v.active);
  if(!s.turbines.length) warn('No locations defined yet, so there is nothing to quantify.');
  if(!s.vessels.length) warn('No vessels defined yet, so no programme can be built.');
  else if(!active.length) err('No vessel is active in the fleet, so the programme cannot be computed.');
  const depths=s.turbines.map(t=>t.waterDepth).filter(d=>d>0);
  active.forEach(v=>{
    if(v.capacityT.nom<=0) err(`${v.name}: cargo capacity must be greater than zero.`);
    if(v.loadingRateTph.nom<=0 && !(s.quarry.loadingRateTPerHour>0))
      err(`${v.name}: no loading rate is set, on the vessel or at the quay, so loading time is being counted as zero.`);
    else if(v.loadingRateTph.nom<=0 && s.quarry.loadingRateTPerHour>0)
      warn(`${v.name}: no vessel loading rate is set, so the quay rate of ${Math.round(s.quarry.loadingRateTPerHour).toLocaleString()} t/hr is being used alone.`);
    if(v.ladenSpeedKn.nom<=0||v.ballastSpeedKn.nom<=0) err(`${v.name}: transit speeds must be greater than zero, otherwise no sailing time is counted.`);
    if(v.fieldSpeedKn.nom<=0) warn(`${v.name}: no in-field speed is set, so moves between locations count as zero time.`);
    if(depths.length){
      const minWD=Math.min(...depths), maxWD=Math.max(...depths);
      if(v.maxDraftM+v.ukcRequiredM>minWD) warn(`${v.name}: draft ${v.maxDraftM} m plus ${v.ukcRequiredM} m under-keel clearance exceeds the shallowest location (${minWD} m).`);
      if(maxWD>v.maxWaterDepthM) warn(`${v.name}: the deepest location (${maxWD} m) exceeds the vessel's maximum fallpipe depth (${v.maxWaterDepthM} m).`);
    }
  });

  const of=operationalFactor(sc);
  if(of.excludesTolerances)
    err('The procurement basis is set to nominal, so the upper tolerance bounds are excluded from the quantity being ordered and scheduled. The installed quantity can legitimately exceed it, which is how a campaign runs short of rock. Use the upper tolerance bound unless there is a specific reason not to.');
  const roll=projectQuantity(s);
  const need=roll.totals.operational.tonnageWithRework;
  if(!of.excludesTolerances && roll.totals.max.tonnage>0){
    const head=(roll.totals.max.tonnage/roll.totals.nom.tonnage-1)*100;
    if(head>80) warn(`The upper tolerance bound sits ${head.toFixed(0)}% above nominal. That is what will be ordered. Check the tolerances are stated correctly before pricing on it.`);
  }
  if(s.quarry.availableQuantityT>0&&need>s.quarry.availableQuantityT)
    warn(`Required rock (${Math.round(need).toLocaleString()} t) exceeds stated quarry availability (${Math.round(s.quarry.availableQuantityT).toLocaleString()} t).`);
  if(s.turbines.length && s.quarry.distanceNM<=0)
    warn('Quarry to site distance is zero, so no laden or ballast transit time is being counted in the programme.');
  if(s.turbines.length && !(s.quarry.loadingRateTPerHour>0))
    warn('Quay loading rate is not set. Loading time is being taken from the vessel rate alone, which usually understates it.');
  active.forEach(v=>{
    const lr=effectiveLoadRate(v,s.quarry);
    if(lr.limitedBy==='quay')
      warn(`${v.name}: the quay rate of ${Math.round(lr.quayRate).toLocaleString()} t/hr is slower than the vessel's ${Math.round(lr.vesselRate).toLocaleString()} t/hr, so the quay governs loading time and therefore the campaign.`);
  });
  const sched=fleetSchedule(s);
  if(s.quarry.productionCapacityTPerDay>0&&sched.projectDays>0){
    const d=need/sched.projectDays;
    if(d>s.quarry.productionCapacityTPerDay)
      warn(`Rock demand of ${Math.round(d).toLocaleString()} t/day over ${sched.projectDays.toFixed(0)} days exceeds quarry production of ${s.quarry.productionCapacityTPerDay.toLocaleString()} t/day. The quarry would govern the programme unless stock is built ahead.`);
  }
  sched.perVessel.forEach(p=>{
    if(p.cargoInfo.volumeLimits)
      warn(`${p.vessel.name}: the hold volume limit of ${Math.round(p.cargoInfo.byVolume).toLocaleString()} t is below the stated cargo capacity of ${Math.round(p.cargoInfo.byWeight).toLocaleString()} t, so the hold governs and raising the capacity alone will not add cargo. Clear the hold volume if it is not a real constraint.`);
    if(p.cargoInfo.cargo>0 && p.sim.leftoverReturned>p.cargoInfo.cargo*0.5)
      warn(`${p.vessel.name}: ${Math.round(p.sim.leftoverReturned).toLocaleString()} t is carried back to port unplaced over the campaign, because a whole location did not fit in the cargo remaining. Sizing the cargo nearer a whole multiple of the per-location quantity would cut trips.`);
  });
  if(s.weather.downtimePct>=60) warn(`Weather downtime of ${s.weather.downtimePct}% is very high. Check the seasonal working window.`);
  if(s.turbines.length && s.weather.downtimePct===0) warn('No weather downtime is applied. A North Sea rock campaign normally carries a workability allowance.');
  if(s.turbines.length && (s.cycle.maintenancePct||0)===0) warn('No maintenance or standby allowance is applied to the vessel programme.');
  return out;
}

return {packingOf, porosityOf, bulkDensity, tonnesPerGeometricM3, operationalFactor, compressIds,

})();

/* Depths are spread across the stated range rather than repeated, so the
   shallow and deep ends of the field are both represented and the draft and
   fallpipe checks see the real spread. Any location can be edited afterwards. */
function depthAt(i, n){
  const p=STATE.project;
  const lo=p.waterDepthMin>0?p.waterDepthMin:(p.waterDepth||0);
  const hi=p.waterDepthMax>0?p.waterDepthMax:(p.waterDepth||0);
  if(!(hi>lo)) return lo||hi||p.waterDepth||0;
  if(n<=1) return Math.round(((lo+hi)/2)*10)/10;
  return Math.round((lo + (hi-lo)*i/(n-1))*10)/10;
}
function seedTurbines(n, D, wd){
  const arr=[], cols=Math.ceil(Math.sqrt(n)), sp=1200;
  for(let i=0;i<n;i++) arr.push({ id:'WTG-'+String(i+1).padStart(3,'0'),
    x:(i%cols)*sp, y:Math.floor(i/cols)*sp, monopileDiameter:D,
    waterDepth: depthAt(i,n) || wd,
    geometryOverride:'', wedges:[], vesselId:null, groupId:null });
  return arr;
}
function respreadDepths(){
  const n=STATE.turbines.length;
  STATE.turbines.forEach((t,i)=>{ t.waterDepth=depthAt(i,n); });
}

  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==false) e.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(c=>{ if(c===null||c===undefined||c===false) return;
    e.appendChild(c instanceof Node ? c : document.createTextNode(String(c))); });
  return e;
}
const fmt=(n,d)=> (n===undefined||n===null||isNaN(n))?'—'
  :Number(n).toLocaleString('en-GB',{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});
const fmtI=n=> (n===undefined||n===null||isNaN(n))?'—':Math.round(n).toLocaleString('en-GB');
