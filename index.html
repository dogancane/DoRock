  if(sc.procurementBasis==='envelope') box.appendChild(notice('warn','Pricing on the full envelope is very conservative. It suits a worst-case exposure check, not usually a competitive tender.'));
  }));
  page.appendChild(proc);

  // ---- drawings ----
  const viz=card('Design drawings');
  const sel=el('select',{onchange:e=>{STATE.ui.refTurbineIdx=parseInt(e.target.value); refresh();}});
  STATE.turbines.slice(0,200).forEach((t,i)=>{
    const o=el('option',{value:i},[t.id+'  (D '+t.monopileDiameter+' m)']);
    if(i===STATE.ui.refTurbineIdx) o.setAttribute('selected','selected'); sel.appendChild(o);});
  viz.appendChild(field('Location shown',sel));
  viz.appendChild(liveBlock(box=> box.appendChild(el('div',{class:'grid two'},[
    el('div',{class:'plot',html:sectionSVG()}),
    el('div',{class:'plot',html:planSVG()})]))));
  page.appendChild(viz);
};

function layerCard(L,idx){
  const sc=STATE.scour, t=refTurbine();
  const c=el('div',{class:'card layer'});
  c.style.borderLeftColor=layerColour(idx)[1];

  const hd=el('div',{class:'v-head'});
  hd.appendChild(el('input',{class:'v-name',type:'text',value:L.name,oninput:e=>{L.name=e.target.value;}}));

  hd.appendChild(el('div',{class:'spacer'}));
  if(idx>0) hd.appendChild(el('button',{class:'btn tiny ghost',title:'Move down the stack',
    onclick:()=>{const a=sc.layers; [a[idx-1],a[idx]]=[a[idx],a[idx-1]]; refresh();}},['↑']));
  if(idx<sc.layers.length-1) hd.appendChild(el('button',{class:'btn tiny ghost',title:'Move up the stack',
    onclick:()=>{const a=sc.layers; [a[idx+1],a[idx]]=[a[idx],a[idx+1]]; refresh();}},['↓']));
  hd.appendChild(el('button',{class:'btn tiny ghost',onclick:()=>{
    const cp=clone(L); cp.id='L'+Math.random().toString(36).slice(2,8); cp.name=L.name+' (copy)';
    sc.layers.splice(idx+1,0,cp); refresh();}},['Duplicate']));
  hd.appendChild(el('button',{class:'btn tiny danger',onclick:()=>{
    if(sc.layers.length<=1){uiAlert('At least one layer is required.');return;}
    sc.layers.splice(idx,1); refresh();}},['Remove']));
  c.appendChild(hd);

  // geometry
  c.appendChild(section('Geometry'));
  const gg0=el('div',{class:'grid three'});
  gg0.appendChild(gradeField('Rock grade',L.grading,v=>{L.grading=v;},null,'— not stated —'));
  gg0.appendChild(selField('Lay phase',Engine.layerPhase(L,sc),
    [{value:'pre',label:'Pre-lay, before the monopile'},
     {value:'post',label:'Post-lay, after the monopile'}],
    v=>setLayerPhase(L,v),
    'Going post-lay turns a pancake into a donut, because the pile is then in the water.'));
  gg0.appendChild(selField('Shape',L.shape||'',
    [{value:'',label:'Follow the project ('+sc.geometryType+')'},
     {value:'pancake',label:'Pancake, full disc (pre-lay only)'},
     {value:'donut',label:'Donut, annulus'},
     {value:'crescent',label:'Crescent, donut with corridors'}],
    v=>setLayerShape(L,v),
    'Choosing a pancake puts this layer pre-lay.'));
  c.appendChild(gg0);
  c.appendChild(liveBlock(box=>{
    const g=Engine.resolveLayer(L,refTurbine(),sc,'nom');
    const phase=g.phase==='pre'?'pre-lay':'post-lay';
    box.appendChild(readout([
      strong(phase+' '+g.shape),
      g.pileDeducted
        ? muted(`  ·  V = ⅓πt(R² + r² + Rr) − ¼πØi²t, deducting Ø ${fmt(g.innerDiameter,2)} m (pile ${fmt(g.D,2)} m plus a ${fmt(g.gap,2)} m gap) over the full ${fmt(g.thickness,2)} m thickness`)
        : muted(`  ·  V = ⅓πt(R² + r² + Rr), the full disc with nothing deducted`)]));
    if(g.shapeForced) box.appendChild(notice('warn',
      'A pancake was asked for but this layer is placed post-lay, with the pile already in the water, so it is calculated as a donut.'));
  }));
  const g=el('div',{class:'grid three'});
  g.appendChild(numField('Thickness',L.thicknessNom,'m',v=>{L.thicknessNom=v; refresh();}));
  const EM=L.extentMode||'wall';
  const EM_NOTE={
    wall:'The protection reaches this far beyond the pile wall, the same width whatever the pile.',
    wallFactor:'The extent beyond the pile wall, expressed against the pile diameter. Scales with the pile. Equivalent to a crest diameter of (2×factor + 1)×D, so 1.55 here is the same as 4.1×D below.',
    radius:'The crest radius measured from the pile centre.',
    factor:'A crest diameter as a multiple of the pile. Scales with the pile.',
    absolute:'A fixed crest diameter regardless of pile size.'};
  g.appendChild(selField('Crest extent given as',EM,
    [{value:'wall',label:'Distance beyond the pile wall (m)'},
     {value:'wallFactor',label:'Beyond the pile wall, ×D'},
     {value:'radius',label:'Crest radius from the centre (m)'},
     {value:'factor',label:'Crest diameter, ×D'},
     {value:'absolute',label:'Crest diameter (m)'}],
    v=>{L.extentMode=v; refresh();}, EM_NOTE[EM]));
  if(EM==='absolute')        g.appendChild(numField('Crest diameter',L.crestDiameter,'m',v=>{L.crestDiameter=v;}));
  else if(EM==='radius')     g.appendChild(numField('Crest radius',L.crestRadius,'m',v=>{L.crestRadius=v;}));
  else if(EM==='factor')     g.appendChild(numField('Crest diameter',L.topExtentFactor,'×D',v=>{L.topExtentFactor=v;}));
  else if(EM==='wallFactor') g.appendChild(numField('Extent beyond the wall',L.wallFactor,'×D',v=>{L.wallFactor=v;}));
  else                       g.appendChild(numField('Extent beyond the pile wall',L.crestOffset,'m',v=>{L.crestOffset=v;}));
  c.appendChild(g);
  c.appendChild(liveBlock(box=>{
    const tt=refTurbine();
    const gg=Engine.resolveLayer(L,tt,sc,'nom');
    box.appendChild(readout([
      'Crest radius ',strong(fmt(gg.topR,3)+' m'),
      muted(`  = pile radius ${fmt(gg.monopileR,3)} m + ${fmt(gg.crestFromWall,3)} m beyond the wall  (Ø ${fmt(gg.topDiameter,3)} m)`)]));
    box.appendChild(readout([
      'Toe radius ',strong(fmt(gg.bottomR,3)+' m'),
      muted(`  = crest + ${fmt(gg.toeLength,3)} m, from ${fmt(gg.thickness,2)} m thickness at 1:${fmt(gg.impliedSlope,2)}  (Ø ${fmt(gg.bottomDiameter,3)} m)`)]));
  }));


  const g2=el('div',{class:'grid three'});
  g2.appendChild(selField('Toe',L.toeMode,
    [{value:'slope',label:'From the design slope'},{value:'fixed',label:'Fixed length'}],
    v=>{L.toeMode=v; refresh();},
    L.toeMode==='slope' ? 'The toe lengthens with an upper-bound thickness, so the design slope holds in every tolerance case.'
                        : 'The toe is held constant, so the implied slope changes when a tolerance thickens the layer.'));
  if(L.toeMode==='fixed') g2.appendChild(numField('Toe length',L.toeLength,'m',v=>{L.toeLength=v; refresh();}));
  else g2.appendChild(numField('Side slope 1:n',L.slopeRatio,'n',v=>{L.slopeRatio=v; refresh();}));
  g2.appendChild(selField('Central opening',L.innerMode,
    [{value:'clearance',label:'Pile plus a gap'},
     {value:'absolute',label:'Opening diameter'},
     {value:'none',label:'Rock against the pile wall'}],
    v=>{L.innerMode=v; refresh();},
    (STATE.scour.geometryType==='pancake' && Engine.layerPhase(L,STATE.scour)==='pre')
      ? 'Not used: a pre-lay pancake places the full disc with nothing deducted.'
      : 'Deducted over the full thickness of this layer.'));
  c.appendChild(g2);
  c.appendChild(selField('Volume basis',L.volumeBasis||'frustum',
    [{value:'frustum',label:'Frustum — sloped toe and opening deducted'},
     {value:'cylinder',label:'Flat cylinder to the toe radius — simplified'}],
    v=>{L.volumeBasis=v; refresh();},
    (L.volumeBasis==='cylinder')
      ? 'A flat disc of full thickness out to the toe radius, with no taper deducted and the pile footprint included. A simplified basis that overstates the real solid, typically by 10 to 13% on monopile geometry. Use it only to reconcile against an estimate prepared on the same basis.'
      : 'The real placed solid.'));
  if(L.innerMode==='clearance')
    c.appendChild(numField('Gap from the pile wall',L.innerClearance,'m',v=>{L.innerClearance=v;},
      'Rock released from a fallpipe rolls inward, so a donut is held off the pile deliberately. The opening is the pile plus this gap, and both are deducted over the full thickness of the layer.'));
  if(L.innerMode==='absolute')
    c.appendChild(numField('Opening diameter',L.innerDiameter,'m',v=>{L.innerDiameter=v;},
      `Gap to a ${t.monopileDiameter} m pile = ${fmt((L.innerDiameter-t.monopileDiameter)/2,2)} m`));

  // material
  c.appendChild(section('Material'));
  const gm=el('div',{class:'grid four'});
  gm.appendChild(numField('Solid rock density',L.material.solidDensity,'t/m³',v=>{L.material.solidDensity=v; refresh();},
    'Grain density of the parent rock, not the placed density.'));
  gm.appendChild(selField('Stated as',L.material.densityMode||'packing',
    [{value:'packing',label:'Fill factor (solidity)'},{value:'porosity',label:'Porosity (voids)'}],
    v=>{ const pk=Engine.packingOf(L.material); L.material.densityMode=v;
         L.material.packingFactor=pk; L.material.porosity=1-pk; refresh(); },
    'Two ways of writing the same number. Contractor models normally use fill factor.'));
  if((L.material.densityMode||'packing')==='packing')
    gm.appendChild(numField('Fill factor',L.material.packingFactor,'–',v=>{L.material.packingFactor=v; L.material.porosity=1-v; refresh();},
      'Solidity fraction below 1. Bulk = solid × fill factor.'));
  else
    gm.appendChild(numField('Porosity',L.material.porosity,'–',v=>{L.material.porosity=v; L.material.packingFactor=1-v; refresh();},
      'Void fraction. Bulk = solid × (1 − porosity).'));
  gm.appendChild(numField('Volume allowance',L.material.volumeAllowance,'×',v=>{L.material.volumeAllowance=v; refresh();},
    'Overdumping and spread, applied to volume. Leave at 1.00 if losses are carried as dumping-time contingency instead.'));
  c.appendChild(gm);
  c.appendChild(liveBlock(box=>{
    box.appendChild(readout([ 'Placed bulk density ', strong(fmt(Engine.bulkDensity(L.material),3)+' t/m³'),
      muted(` = ${L.material.solidDensity} × ${fmt(Engine.packingOf(L.material),3)}  (porosity ${fmt(Engine.porosityOf(L.material),3)})`) ]));
  }));

  // tolerances and rate
  const advT=el('details',{class:'trace adv'});
  advT.appendChild(el('summary',{},['Tolerances and placement  ·  '+
    `vertical +${L.vertTolMax} m, horizontal +${L.horizTolMax} m, ${fmtI(L.dumpRateTph.nom)} t/hr`]));
  const advBody=el('div',{style:'padding:4px 11px 10px'});
  advBody.appendChild(el('p',{class:'sec-note'},['The upper bounds go straight into the ordered quantity, so raising one raises the rock, the trips and the programme.']));
  const gt=el('div',{class:'grid four'});
  gt.appendChild(numField('Vertical, lower',L.vertTolMin,'m',v=>{L.vertTolMin=v; refresh();}));
  gt.appendChild(numField('Vertical, upper',L.vertTolMax,'m',v=>{L.vertTolMax=v; refresh();}));
  gt.appendChild(numField('Horizontal, lower',L.horizTolMin,'m',v=>{L.horizTolMin=v; refresh();}));
  gt.appendChild(numField('Horizontal, upper',L.horizTolMax,'m',v=>{L.horizTolMax=v; refresh();}));
  advBody.appendChild(gt);
  const gr=el('div',{class:'grid two'});
  gr.appendChild(rangeField('Dumping rate for this rock',L.dumpRateTph,'t/hr',
    'Filter and armour gradings place at different rates, so each layer carries its own.'));
  gr.appendChild(checkField('Bears on the seabed',L.seabedBearing,v=>{L.seabedBearing=v; refresh();},
    'Only the bearing layer takes the seabed tolerance allowance.'));
  advBody.appendChild(gr);
  if(sc.geometryType==='crescent')
    advBody.appendChild(checkField('Cut cable corridors through this layer',L.applyWedges!==false,
      v=>{L.applyWedges=v; refresh();},
      L.applyWedges!==false
        ? 'This layer is cut back around the exclusion zones.'
        : 'This layer runs continuously beneath the exclusion zones, so the cable still lies on rock rather than bare seabed. That is the usual arrangement for a filter under a cut armour.'));
  advT.appendChild(advBody);
  c.appendChild(advT);

  // resolved figures, recomputed live as any input above changes
  c.appendChild(liveBlock(box=>{
  const t=refTurbine();
  const rn=Engine.layerVolume(L,t,sc,'nom'), rx=Engine.layerVolume(L,t,sc,'max');
  const gn=rn.geom, gx=rx.geom;
  box.appendChild(readout([ 'Crest Ø ',strong(fmt(gn.topDiameter,2)+' m'),' · toe Ø ',strong(fmt(gn.bottomDiameter,2)+' m'),
    ' · opening Ø ',strong(fmt(gn.innerDiameter,2)+' m'),' · slope ',strong('1:'+fmt(gn.impliedSlope,2)),
    ' · ',strong(fmtI(rn.designVolume)+' m³'),' / ',strong(fmtI(rn.tonnage)+' t'),muted(' per location') ]));
  if(gn.takesWedges && rn.wedgeVolume>0)
    box.appendChild(readout(['Cable corridors remove ',strong(fmtI(rn.wedgeVolume)+' m³'),
      muted(` (${fmt((1-rn.coverageFrac)*100,1)}% of this layer)`),
      sc.wedgeSideSlopes!==false?muted(', including the side slopes on both faces of each corridor'):'']));
  if(L.toeMode==='fixed' && Math.abs(gn.impliedSlope-gx.impliedSlope)>0.05)
    box.appendChild(notice('warn',`At the upper tolerance the thickness rises to ${fmt(gx.thickness,2)} m but the toe stays at ${fmt(L.toeLength,2)} m, so the slope steepens to 1:${fmt(gx.impliedSlope,2)}. Holding 1:${fmt(gn.impliedSlope,1)} would need a ${fmt(gx.thickness*gn.impliedSlope,2)} m toe and would add rock.`));

  box.appendChild(trace(`Show calculation — ${t.id}`,[
    {label:'Monopile diameter D',value:fmt(gn.D,2)+' m'},
    {label:L.extentMode==='absolute'?'Crest radius (entered)':'Crest radius = '+L.topExtentFactor+' × D / 2',value:fmt(gn.topR,3)+' m'},
    {label:'Toe length'+(L.toeMode==='slope'?' = thickness × '+L.slopeRatio:' (fixed)'),value:fmt(gn.toeLength,3)+' m'},
    {label:'Toe radius',value:fmt(gn.bottomR,3)+' m'},
    {label:'Opening radius ('+gn.openingReason+')',value:fmt(gn.innerR,3)+' m'},
    {label:'Crest volume  2π ∫ t·r dr over ['+fmt(gn.innerR,2)+', '+fmt(gn.topR,2)+']',value:fmtI(Engine.revolvedVolume(gn.profile,gn.innerR,gn.topR))+' m³'},
    {label:'Slope volume  2π ∫ h(r)·r dr over ['+fmt(gn.topR,2)+', '+fmt(gn.bottomR,2)+']',value:fmtI(Engine.revolvedVolume(gn.profile,gn.topR,gn.bottomR))+' m³'},
    {label:'Gross volume',value:fmtI(rn.grossVolume)+' m³'},
    rn.wedgeVolume>0?{label:'Less cable corridors ('+fmt((1-rn.coverageFrac)*100,1)+'%)',value:'−'+fmtI(rn.wedgeVolume)+' m³'}:null,
    rn.seabedVolume!==0?{label:'Seabed tolerance over '+fmtI(rn.footprintArea)+' m²',value:(rn.seabedVolume>=0?'+':'')+fmtI(rn.seabedVolume)+' m³'}:null,
    {label:'Design volume (nominal)',value:fmtI(rn.designVolume)+' m³',strong:true},
    (L.material.volumeAllowance||1)!==1?{label:'Placed volume = design × '+L.material.volumeAllowance,value:fmtI(rn.placedVolume)+' m³'}:null,
    {label:'Bulk density = '+L.material.solidDensity+' × '+fmt(Engine.packingOf(L.material),3),value:fmt(rn.bulkDensity,4)+' t/m³'},
    {label:'Tonnage (nominal)',value:fmtI(rn.tonnage)+' t',strong:true},
    {label:'Tonnage (tolerance envelope)',value:fmtI(rx.tonnage)+' t',strong:true},
    'Volumes are integrated analytically over the crest and slope of the axisymmetric profile. This is algebraically the truncated-cone form V = ⅓πt(R² + r² + Rr) − ¼πØi²t, so the two agree exactly.',
    gn.takesWedges&&rn.wedgeVolume>0 ? 'Corridor removal is integrated over radius, because a corridor with a minimum width does not occupy a constant angular share, and the rock falls away at the design slope on both faces.' : null
  ].filter(Boolean)));
  }));
  return c;
}

/* =========================================================================
   PAGE: ROCK QUANTITIES
   ========================================================================= */
R.rock = function(page){
  head(page,'Rock quantities','Three quantities kept separate: the as-drawn nominal, the tolerance envelope as an exposure figure, and the operational quantity that everything downstream is built on.');
  if(!STATE.turbines.length){ page.appendChild(emptyState('Rock quantities','No locations to quantify yet.')); return; }
  const roll=Engine.projectQuantity(STATE), T=roll.totals, layers=STATE.scour.layers;

  page.appendChild(kpiRow([
    ['Nominal',fmtI(T.nom.tonnage),'t'],
    ['Envelope',fmtI(T.max.tonnage),'t'],
    ['Operational',fmtI(T.operational.tonnage),'t'],
    ['To procure, with rework',fmtI(T.operational.tonnageWithRework),'t']]));
  page.appendChild(notice('info','The operational quantity is on the '+T.operational.basis.describe+' basis, set on the Scour design tab.'));

  const c1=card('By layer');
  const t1=el('table',{class:'data'});
  t1.appendChild(el('tr',{},['Layer','Grading','Bulk density (t/m³)','Nominal m³','Nominal t','Envelope t','Operational t','Dump rate (t/hr)'].map(h=>el('th',{},[h]))));
  layers.forEach(L=>{
    t1.appendChild(el('tr',{},[
      el('td',{},[L.name]), el('td',{},[L.grading||'—']),
      el('td',{},[fmt(Engine.bulkDensity(L.material),3)]),
      el('td',{},[fmtI(T.nom.layers[L.id].designVolume)]),
      el('td',{},[fmtI(T.nom.layers[L.id].tonnage)]),
      el('td',{},[fmtI(T.max.layers[L.id].tonnage)]),
      el('td',{},[fmtI(T.operational.layers[L.id].tonnage)]),
      el('td',{},[fmtI(L.dumpRateTph.nom)])]));
  });
  t1.appendChild(el('tr',{class:'total'},[
    el('td',{},['Total']),el('td',{},['']),el('td',{},['']),
    el('td',{},[fmtI(T.nom.designVolume)]),el('td',{},[fmtI(T.nom.tonnage)]),
    el('td',{},[fmtI(T.max.tonnage)]),el('td',{},[fmtI(T.operational.tonnage)]),el('td',{},[''])]));
  t1.appendChild(el('tr',{},[el('td',{},['Rework allowance']),el('td',{},['']),el('td',{},['']),
    el('td',{},['']),el('td',{},['']),el('td',{},['']),el('td',{},[fmtI(T.operational.reworkTonnage)]),el('td',{},[''])]));
  t1.appendChild(el('tr',{class:'total'},[el('td',{},['To procure']),el('td',{},['']),el('td',{},['']),
    el('td',{},['']),el('td',{},['']),el('td',{},['']),el('td',{},[fmtI(T.operational.tonnageWithRework)]),el('td',{},[''])]));
  c1.appendChild(t1);
  c1.appendChild(el('p',{class:'sec-note'},['Per location: '+layers.map(L=>`${L.name} ${fmtI(STATE.turbines.length?T.nom.layers[L.id].tonnage/STATE.turbines.length:0)} t`).join(', ')+
    `, total ${fmtI(STATE.turbines.length?T.nom.tonnage/STATE.turbines.length:0)} t nominal.`]));
  page.appendChild(c1);

  const c2=card('By location');
  const showAll=roll.rows.length<=60;
  const sc2=el('div',{class:'tbl-scroll'});
  const t2=el('table',{class:'data'});
  t2.appendChild(el('tr',{},['Location','D (m)','Shape',...layers.map(L=>L.name+' m³'),'Nominal t','Envelope t','Operational t'].map(h=>el('th',{},[h]))));
  (showAll?roll.rows:roll.rows.slice(0,60)).forEach(r=>{
    t2.appendChild(el('tr',{},[
      el('td',{},[r.turbine.id]), el('td',{},[fmt(r.turbine.monopileDiameter,1)]),
      el('td',{},[r.turbine.geometryOverride||STATE.scour.geometryType]),
      ...layers.map(L=>el('td',{},[fmtI(r.q.byLayer[L.id].nom.designVolume)])),
      el('td',{},[fmtI(r.q.nom.tonnage)]), el('td',{},[fmtI(r.q.max.tonnage)]),
      el('td',{},[fmtI(r.q.operational.tonnage)])]));
  });
  sc2.appendChild(t2); c2.appendChild(sc2);
  if(!showAll) c2.appendChild(el('p',{class:'sec-note'},[`Showing the first 60 of ${roll.rows.length}. All are included in the totals.`]));
  page.appendChild(c2);

  if((STATE.scour.groups||[]).length) page.appendChild(liveBlock(box=>box.appendChild(groupSummary())));

  const m=card('Method');
  m.appendChild(trace('Volume',[
    'Each layer is an axisymmetric height field: constant thickness across the crest, tapering linearly down the side slope to zero at the toe. Volume = 2π ∫ h(r)·r dr, evaluated analytically over the crest and slope bands.',
    'This is algebraically the truncated-cone form V = ⅓πt(R² + r² + Rr) − ¼πØi²t, so the two agree exactly and a quantity prepared either way is directly comparable.',
    'Cable corridors are removed by integrating the layer profile over each corridor\u2019s own radial band and angular share, which keeps crest and slope material in their correct proportions. A flat percentage cut on the total does not.',
    'With a slope-driven toe, an upper-bound thickness lengthens the toe so the design slope holds in every tolerance case. With a fixed toe the footprint is held instead and the slope steepens, which the checks report.'
  ],true));
  m.appendChild(trace('Tonnage',[
    'Placed rock is a bulk medium: bulk density = solid density × fill factor, where the fill factor is a solidity fraction below 1. Granite at 2.65 t/m³ and a 0.69 fill factor places at 1.83 t/m³.',
    'Porosity is the same number from the other end: fill factor = 1 − porosity. Either can be entered.',
    'The volume allowance is separate and multiplies volume, not density, for overdumping and spread. A model that carries losses as a dumping-time contingency instead should leave it at 1.00.',
    'Tonnage = design volume × volume allowance × bulk density.',
    'Rework allowance = probability of rework × additional rock per reworked location.'
  ]));
  page.appendChild(m);
};

/* =========================================================================
   PAGE: QUARRY
   ========================================================================= */
R.quarry = function(page){
  head(page,'Quarry and load-out','Sailing distance, quarry production and loading. After vessel capacity, distance is the strongest lever on the programme.');
  const q=STATE.quarry;

  const pick=card('Quarry','Pick a source and the distance, quay rate and draft note are filled in. Adjust the distance to your own site, since the library figures are to a reference North Sea position.');
  const pickQuarry=Q=>{
    q.name=Q.name; q.port=Q.port; q.loadingRateTPerHour=Q.loadTph;
    q.lat=Q.lat; q.lon=Q.lon;
    ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();
    if(!q.autoDistance){
      const d=quarryDistance(Q);
      if(d!==null) q.distanceNM=Math.round(d*10)/10;
    }
    refresh();
  };
  pick.appendChild(liveBlock(box=>{
    const sel=el('select',{onchange:e=>{
      const Q=QUARRIES.find(x=>x.name===e.target.value); if(Q) pickQuarry(Q);
    }});
    sel.appendChild(el('option',{value:''},['Select from the library…']));
    const ranked=quarriesByDistance();
    ranked.forEach(({Q,nm})=>{
      const dist = nm===null ? 'distance needs a site position' : fmt(nm,0)+' NM to site';
      const o=el('option',{value:Q.name},[`${Q.name} (${Q.port}, ${Q.country}) — ${dist}`]);
      if(Q.name===q.name) o.setAttribute('selected','selected');
      sel.appendChild(o);
    });
    box.appendChild(field('Quarry library',sel,
      ranked[0] && ranked[0].nm!==null
        ? 'Listed nearest first, routed over water to this site. Every site sits differently, so these change when the site does.'
        : 'Distances appear once the site has a position, either from location coordinates or from the site latitude and longitude below.'));
  }));
  const chosen=QUARRIES.find(x=>x.name===q.name);
  if(chosen&&chosen.note) pick.appendChild(el('p',{class:'sec-note'},[chosen.note]));

  /* Every source against this site, so the choice can be made on the numbers
     rather than on a distance that belonged to some other project. */
  pick.appendChild(liveBlock(box=>{
    const ranked=quarriesByDistance();
    if(!ranked.length || ranked[0].nm===null) return;
    const det=el('details',{class:'trace'});
    det.appendChild(el('summary',{},['Compare all sources against this site']));
    const wrap=el('div',{style:'padding:4px 11px 10px'});
    const t=el('table',{class:'data compact'});
    t.appendChild(el('tr',{},['Quarry','Load-out','Distance (NM)','vs nearest','Quay (t/hr)','Rock (t/m³)','']
      .map(h=>el('th',{},[h]))));
    const near=ranked[0].nm;
    ranked.forEach(({Q,nm})=>{
      const cur=Q.name===q.name;
      t.appendChild(el('tr',{class:cur?'is-best':''},[
        el('td',{},[Q.name+(cur?'  (selected)':'')]),
        el('td',{},[Q.port]),
        el('td',{},[nm===null?'—':fmt(nm,0)]),
        el('td',{},[nm===null?'—':(nm===near?'nearest':'+'+fmt(nm-near,0))]),
        el('td',{},[fmtI(Q.loadTph)]),
        el('td',{},[fmt(Q.density,2)]),
        el('td',{},[cur?muted('in use'):el('button',{class:'btn tiny ghost',
          onclick:()=>pickQuarry(Q)},['Use this'])])
      ]));
    });
    wrap.appendChild(t);
    const far=ranked.filter(x=>x.nm!==null).slice(-1)[0];
    if(far && far.nm>near)
      wrap.appendChild(el('p',{class:'sec-note'},[
        `Nearest is ${ranked[0].Q.name} at ${fmt(near,0)} NM, furthest ${far.Q.name} at ${fmt(far.nm,0)} NM. `+
        `Rock density and quay rate matter too: a denser rock cuts the volume to place, and a faster quay cuts the loading on every trip.`]));
    det.appendChild(wrap);
    box.appendChild(det);
  }));
  const man=el('details',{class:'trace'});
  man.appendChild(el('summary',{},['Name it something else']));
  const gq=el('div',{class:'grid two',style:'padding:6px 11px 10px'});
  gq.appendChild(txtField('Quarry name',q.name,v=>{q.name=v;}));
  gq.appendChild(txtField('Load-out port',q.port,v=>{q.port=v;}));
  man.appendChild(gq);
  pick.appendChild(man);
  page.appendChild(pick);

  const g=el('div',{class:'grid two'});
  const c1=card('Distance to site','Worked out by routing over navigable water, so it goes round Scotland or through the Danish straits where it has to.');
  const gp=el('div',{class:'grid two'});
  gp.appendChild(numField('Quarry latitude',q.lat,'°N',v=>{q.lat=v; ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();},
    'Approximate load-out position from the library. Correct it if you have the exact quay.'));
  gp.appendChild(numField('Quarry longitude',q.lon,'°E',v=>{q.lon=v; ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();}));
  c1.appendChild(gp);
  const cen=siteCentroid();
  if(!cen || !STATE.turbines.some(t=>t.lat||t.lon)){
    const sp=el('div',{class:'grid two'});
    sp.appendChild(numField('Site latitude',STATE.project.siteLat,'°N',v=>{STATE.project.siteLat=v; ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();},
      'Used when the location schedule carries no coordinates. Import latitude and longitude columns and this is taken from the field itself.'));
    sp.appendChild(numField('Site longitude',STATE.project.siteLon,'°E',v=>{STATE.project.siteLon=v; ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();}));
    c1.appendChild(sp);
  }
  c1.appendChild(checkField('Work the distance out from the positions',q.autoDistance,
    v=>{q.autoDistance=v; ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear(); refresh();},
    q.autoDistance ? 'Recomputed whenever a position changes.'
                   : 'Switched off, so the distance below is whatever you type.'));
  c1.appendChild(liveBlock(box=>{
    const r=seaDistance();
    if(!r){
      box.appendChild(notice('info','Enter a quarry position and either import location coordinates or set a site position, and the distance is worked out for you.'));
      return;
    }
    if(!r.ok){ box.appendChild(notice('warn','Could not route: '+r.reason+'. Enter the distance by hand below.')); return; }
    const c=r.centroid;
    box.appendChild(readout(['Sea route ',strong(fmt(r.distanceNM,1)+' NM'),
      muted(` (${fmt(r.distanceNM*NM_KM,0)} km) against ${fmt(r.greatCircleNM,1)} NM straight line, `+
            `${fmt(r.distanceNM/r.greatCircleNM,2)}× longer`)]));
    box.appendChild(readout(['Site position ',strong(fmt(c.lat,4)+'°N, '+fmt(c.lon,4)+'°E'),
      muted(', from '+c.from)]));
    if(r.snapFromNM>3 || r.snapToNM>3)
      box.appendChild(notice('info',`The route starts ${fmt(r.snapFromNM,1)} NM from the quarry position and ends ${fmt(r.snapToNM,1)} NM from the site, because the nearest navigable cell is that far off. Those legs are included in the total.`));
    if(!q.autoDistance)
      box.appendChild(el('div',{class:'btn-row'},[
        el('button',{class:'btn ghost',onclick:()=>{q.distanceNM=Math.round(r.distanceNM*10)/10; refresh();}},
          ['Use '+fmt(r.distanceNM,1)+' NM'])]));
  }));
  if(q.autoDistance){
    // a field that is recomputed on every keystroke must not look editable
    c1.appendChild(liveBlock(box=>{
      box.appendChild(field('Quarry to site, one way',
        el('div',{class:'derived'},[
          el('strong',{},[fmt(q.distanceNM,1)+' NM']),
          muted(`  ${fmt(q.distanceNM*NM_KM,1)} km · round trip ${fmt(q.distanceNM*2,1)} NM`)]),
        'Worked out from the positions above. Switch off the box to type your own.'));
    }));
  } else {
    c1.appendChild(numField('Quarry to site, one way',q.distanceNM,'NM',v=>{q.distanceNM=v;},
      `${fmt(q.distanceNM*NM_KM,1)} km. Round trip ${fmt(q.distanceNM*2,1)} NM (${fmt(q.distanceNM*2*NM_KM,1)} km).`));
  }
  const nn=Engine.meanNearestNeighbourNM(STATE.turbines);
  c1.appendChild(numField('In-field move between locations',q.fieldMoveOverrideNM,'NM',v=>{q.fieldMoveOverrideNM=v; refresh();},
    q.fieldMoveOverrideNM>0?'Overriding the layout-derived value.'
      :`Zero, so the layout-derived mean spacing of ${fmt(nn,2)} NM is used.`));
  c1.appendChild(liveBlock(box=>{
    const v0=STATE.vessels.find(v=>v.active)||STATE.vessels[0];
    if(!v0) return;
    const lad=q.distanceNM/v0.ladenSpeedKn.nom, bal=q.distanceNM/v0.ballastSpeedKn.nom;
    box.appendChild(readout(['Round trip ',strong(fmt(lad+bal,2)+' h'),
      muted(` (${fmt(lad,2)} h laden out, ${fmt(bal,2)} h ballast back)`),
      '. Both legs are counted in the campaign duration on every trip.']));
    if(STATE.turbines.length){
      const s=Engine.fleetSchedule(STATE), p=s.perVessel[0];
      if(p) box.appendChild(readout([strong(String(p.sim.trips.length)),' trips means ',
        strong(fmtI(p.sim.acc.ladenTransit+p.sim.acc.ballastTransit)+' h'),' of transit in total, ',
        strong(fmt((p.sim.acc.ladenTransit+p.sim.acc.ballastTransit)/24,1)+' days'),' of the programme.']));
    }
  }));
  g.appendChild(c1);

  const c2=card('Quarry capability');
  c2.appendChild(numField('Quay loading rate',q.loadingRateTPerHour,'t/hr',v=>{q.loadingRateTPerHour=v;},
    'Drives loading time on every trip and therefore the campaign duration. The vessel carries its own rate too and the slower of the two governs.'));
  c2.appendChild(liveBlock(box=>{
    const v0=STATE.vessels.find(v=>v.active)||STATE.vessels[0];
    if(!v0) return;
    const lr=Engine.effectiveLoadRate(v0,q);
    box.appendChild(readout(['Effective loading rate ',strong(fmtI(lr.rate)+' t/hr'),
      muted(` — quay ${lr.quayRate?fmtI(lr.quayRate)+' t/hr':'not set'}, ${v0.name} ${fmtI(lr.vesselRate)} t/hr, ${lr.limitedBy} governs`)]));
    if(STATE.turbines.length){
      const s=Engine.fleetSchedule(STATE), p=s.perVessel[0];
      if(p) box.appendChild(readout(['Loading accounts for ',strong(fmtI(p.sim.acc.loading)+' h'),
        muted(` across ${p.sim.trips.length} trips, ${fmt(p.sim.acc.loading/24,1)} days of the programme.`)]));
    }
  }));
  c2.appendChild(numField('Production capacity',q.productionCapacityTPerDay,'t/day',v=>{q.productionCapacityTPerDay=v;},
    'Used only to flag whether the quarry could keep pace. It does not drive the duration.'));
  c2.appendChild(numField('Available quantity',q.availableQuantityT,'t',v=>{q.availableQuantityT=v;},
    'Reference only, for a sense check against what the quarry has agreed to supply. It does not affect the programme.'));
  g.appendChild(c2);
  page.appendChild(g);


  if(!STATE.turbines.length){ page.appendChild(notice('info','Supply against demand appears once locations are defined.')); return; }
  page.appendChild(liveBlock(box=>{
  const roll=Engine.projectQuantity(STATE), s=Engine.fleetSchedule(STATE);
  const need=roll.totals.operational.tonnageWithRework;
  const per=s.projectDays>0?need/s.projectDays:0;
  const bal=card('Supply against demand');
  bal.appendChild(el('table',{class:'data'},[
    el('tr',{},[el('td',{},['Rock required, operational basis with rework']),el('td',{},[fmtI(need)+' t'])]),
    el('tr',{},[el('td',{},['Campaign duration']),el('td',{},[fmt(s.projectDays,1)+' days'])]),
    el('tr',{},[el('td',{},['Average demand on the quarry']),el('td',{},[fmtI(per)+' t/day'])]),
    el('tr',{},[el('td',{},['Stated production capacity']),el('td',{},[fmtI(q.productionCapacityTPerDay)+' t/day'])]),
    el('tr',{},[el('td',{},['Production days to build the full quantity']),el('td',{},[q.productionCapacityTPerDay>0?fmt(need/q.productionCapacityTPerDay,1)+' days':'—'])]),
  ]));
  if(q.productionCapacityTPerDay>0 && per>q.productionCapacityTPerDay)
    bal.appendChild(notice('warn','Demand exceeds production, so the quarry would govern the programme unless stock is built ahead of the campaign. This is a flag only; it does not change the calculated duration.'));
  else if(q.productionCapacityTPerDay>0) bal.appendChild(notice('ok','Production keeps pace with vessel demand.'));
  box.appendChild(bal);
  }));
};

/* =========================================================================
   PAGE: VESSELS
   ========================================================================= */
R.vessels = function(page){
  head(page,'Vessels','The rock installation fleet. Every rate carries a minimum, nominal and maximum; only the nominal drives the programme, the bounds feed the sensitivity study.');
  const lib=allVessels();
  const bar=el('div',{class:'card tight'});
  const sel=el('select');
  lib.forEach((p,i)=> sel.appendChild(el('option',{value:i},[p.name+(p.own?'  (yours)':'')])));
  const noteLine=el('p',{class:'sec-note'},[lib[0]?(lib[0].note||''):'']);
  sel.addEventListener('change',()=>{ const p=lib[parseInt(sel.value)]; noteLine.textContent=p?(p.note||''):''; });
  bar.appendChild(el('div',{class:'row-end'},[
    field('Vessel',sel,'Picking a name fills capacity, speeds, rates, draft and depth limits.'),
    el('button',{class:'btn',onclick:()=>{
      const p=lib[parseInt(sel.value)||0];
      STATE.vessels.push(makeVessel(p.name,p.v)); refresh();
    }},['Add this vessel']),
    el('button',{class:'btn ghost',onclick:()=>{
      STATE.vessels.push(makeVessel('Vessel '+(STATE.vessels.length+1),vesselSpec({
        capacityT:{min:0,nom:0,max:0}, ladenSpeedKn:{min:0,nom:0,max:0},
        ballastSpeedKn:{min:0,nom:0,max:0}, loadingRateTph:{min:0,nom:0,max:0}})));
      refresh();
    }},['Blank vessel'])]));
  bar.appendChild(noteLine);
  bar.appendChild(el('p',{class:'sec-note'},['Library figures are typical for the class, not a specific ship\u2019s certified data. Check them against the vessel you are pricing, then save your corrected version so it is there next time.']));
  page.appendChild(bar);
  STATE.vessels.forEach((v,i)=> page.appendChild(vesselCard(v,i)));
  if(!STATE.vessels.length) page.appendChild(notice('warn','No vessels defined. Add one to compute a programme.'));
};

function vesselCard(v,idx){
  const c=el('div',{class:'card vessel'+(v.active?'':' inactive')});
  const hd=el('div',{class:'v-head'});
  hd.appendChild(el('input',{class:'v-name',type:'text',value:v.name,oninput:e=>{v.name=e.target.value;}}));
  const cb=el('input',{type:'checkbox'}); cb.checked=v.active;
  cb.addEventListener('change',e=>{v.active=e.target.checked; refresh();});
  hd.appendChild(el('label',{class:'inline'},[cb,el('span',{},['In fleet'])]));
  hd.appendChild(el('div',{class:'spacer'}));
  hd.appendChild(el('button',{class:'btn tiny ghost',title:'Keep this vessel in the library for future projects',
    onclick:()=>{
      if(!v.name.trim()){ uiAlert('Give the vessel a name first.'); return; }
      if(saveToFleet(v)) uiAlert('"'+v.name+'" is now in your vessel library.');
      else uiAlert('This browser will not store data, so the library cannot be kept here. Export the project instead.');
      refresh();
    }},['Save to library']));
  hd.appendChild(el('button',{class:'btn tiny ghost',onclick:()=>{
    const cp=clone(v); cp.id='v_'+Math.random().toString(36).slice(2,9); cp.name=v.name+' (copy)';
    STATE.vessels.push(cp); refresh();}},['Duplicate']));
  hd.appendChild(el('button',{class:'btn tiny danger',onclick:()=>{
    STATE.vessels.splice(idx,1);
    STATE.turbines.forEach(t=>{ if(t.vesselId===v.id) t.vesselId=null; });
    refresh();}},['Remove']));
  c.appendChild(hd);

  c.appendChild(section('Cargo'));
  const g1=el('div',{class:'grid three'});
  g1.appendChild(rangeField('Cargo capacity (payload)',v.capacityT,'t',
    'What the vessel can carry. This governs how many locations fit in one trip.'));
  g1.appendChild(numField('Hold volume limit',v.hopperVolumeM3,'m³',val=>{v.hopperVolumeM3=val;},
    'Optional. Leave at zero unless the hold fills before the payload is reached on light rock. When set, it can only reduce the cargo below the capacity above.'));
  g1.appendChild(numField('Cargo utilisation',v.utilizationPct,'%',val=>{v.utilizationPct=clamp(val,10,100);},
    'Share of the payload achievable in practice.'));
  c.appendChild(g1);

  c.appendChild(liveBlock(box=>{
    const s=STATE.turbines.length?Engine.fleetSchedule(STATE):{perVessel:[],effBulkDensity:1.7};
    const cg=Engine.vesselCargo(v,s.effBulkDensity);
    box.appendChild(readout(['Cargo per trip ',strong(fmtI(cg.cargo)+' t'),
      cg.holdSet
        ? muted(` — ${cg.limitedBy} governs (payload ${fmtI(cg.byWeight)} t, hold ${fmtI(cg.byVolume)} t at ${fmt(s.effBulkDensity,3)} t/m³)`)
        : muted(` — the full payload, no hold volume limit set`)]));
    if(cg.volumeLimits)
      box.appendChild(notice('warn',`The hold volume limit is below the stated capacity, so raising the capacity alone will not add cargo. Clear the hold volume if it is not a real constraint.`));
    const pv=s.perVessel.find(p=>p.vessel.id===v.id);
    if(pv && pv.locs.length){
      const perLoc=pv.tonnes/pv.locs.length;
      const fit=Engine.cargoFit(cg.cargo,perLoc);
      box.appendChild(readout([
        'At ',strong(fmtI(perLoc)+' t'),' per location, one cargo covers ',
        strong(String(fit.whole)+(fit.whole===1?' location':' locations')),
        ' with ',strong(fmtI(fit.leftover)+' t'),muted(' left on board.')]));
      box.appendChild(readout([strong(String(pv.sim.trips.length)),' trips for ',
        strong(String(pv.locs.length)),' locations, ',strong(fmtI(pv.tonnes)+' t'),' in total.']));
    }
    const lr=Engine.effectiveLoadRate(v,STATE.quarry);
    box.appendChild(readout(['Loading at ',strong(fmtI(lr.rate)+' t/hr'),
      muted(` (${lr.limitedBy} governs) takes `),strong(lr.rate>0?fmt(cg.cargo/lr.rate,2)+' h':'—'),
      muted(' for a full cargo.')]));
  }));

  c.appendChild(section('Speeds and rates'));
  const g2=el('div',{class:'grid three'});
  g2.appendChild(rangeField('Laden speed',v.ladenSpeedKn,'kn'));
  g2.appendChild(rangeField('Ballast speed',v.ballastSpeedKn,'kn'));
  g2.appendChild(rangeField('In-field speed',v.fieldSpeedKn,'kn'));
  c.appendChild(g2);
  const g3=el('div',{class:'grid three'});
  g3.appendChild(rangeField('Loading rate',v.loadingRateTph,'t/hr'));
  g3.appendChild(selField('Fallpipe',v.fallpipeType,
    [{value:'vertical',label:'Vertical fallpipe with ROV'},{value:'inclined',label:'Inclined / tremie pipe'}],
    val=>{v.fallpipeType=val; refresh();}));
  g3.appendChild(el('div',{class:'field'},[el('label',{},['Dumping rates']),
    el('div',{class:'hint'},['Set per rock layer on the Scour design tab: '+
      STATE.scour.layers.map(L=>`${L.name} ${fmtI(L.dumpRateTph.nom)} t/hr`).join(', ')+'.'])]));
  c.appendChild(g3);
  const g4=el('div',{class:'grid two'});
  g4.appendChild(rangeField('Fallpipe deployment',v.fallpipeDeployHr,'hr'));
  g4.appendChild(rangeField('Fallpipe retrieval',v.fallpipeRetrieveHr,'hr'));
  c.appendChild(g4);

  c.appendChild(section('Limits'));
  const g5=el('div',{class:'grid four'});
  g5.appendChild(numField('Max draft',v.maxDraftM,'m',val=>{v.maxDraftM=val; refresh();}));
  g5.appendChild(numField('Required UKC',v.ukcRequiredM,'m',val=>{v.ukcRequiredM=val; refresh();}));
  g5.appendChild(numField('Max fallpipe depth',v.maxWaterDepthM,'m',val=>{v.maxWaterDepthM=val; refresh();}));
  g5.appendChild(numField('Min water depth',v.minWaterDepthM,'m',val=>{v.minWaterDepthM=val; refresh();}));
  c.appendChild(g5);
  c.appendChild(txtField('DP notation',v.dpClass,val=>{v.dpClass=val;}));
  return c;
}

/* =========================================================================
   PAGE: INSTALLATION CYCLE
   ========================================================================= */
R.cycle = function(page){
  head(page,'Installation cycle','How the vessel time is built up. Each activity is charged where it actually occurs, so a cargo shared between locations and a location needing several cargoes are both costed correctly.');
  const cy=STATE.cycle;

  const pol=card('Campaign rules','Which layer goes in before the monopile and which after. Layers in different phases can never share a visit, so each phase is at least one separate pass of the field.');
  const gpl=el('div',{class:'grid '+(STATE.scour.layers.length>2?'three':'two')});
  STATE.scour.layers.forEach(L=>{
    gpl.appendChild(selField(L.name+' lay phase', Engine.layerPhase(L,STATE.scour),
      [{value:'pre',label:'Pre-lay, before the monopile'},{value:'post',label:'Post-lay, after the monopile'}],
      v=>setLayerPhase(L,v),
      'Also settable on the Scour layers tab, alongside the shape. A pancake becomes a donut if moved post-lay.'));
  });
  pol.appendChild(gpl);
  pol.appendChild(liveBlock(box=>{
    box.appendChild(readout(['Campaign structure: ',strong(Engine.campaignLabel(STATE.scour,cy.campaignMode)),
      muted(` — ${Engine.campaignGroups(STATE.scour,cy.campaignMode).length} pass(es) of the field.`)]));
    const pre=STATE.scour.layers.filter(L=>Engine.layerPhase(L,STATE.scour)==='pre');
    if(pre.length) box.appendChild(notice('info',
      `${pre.map(L=>L.name).join(' and ')} ${pre.length>1?'are':'is'} placed before the monopile exists, so ${pre.length>1?'they carry':'it carries'} no pile opening unless one is entered explicitly, and ${pre.length>1?'they are':'it is'} a separate campaign from anything placed afterwards.`));
  }));
  const gp=el('div',{class:'grid two'});
  gp.appendChild(selField('What happens to the rock left on board',cy.splitPolicy,
    [{value:'complete',label:'Carry it back and top up at the quarry'},
     {value:'split',label:'Dump it at the next location and return later to finish'}],
    v=>{cy.splitPolicy=v; refresh();},
    cy.splitPolicy==='complete'
      ? 'A location is only started if its whole requirement fits in the cargo remaining. The surplus sails back, so the next load is smaller and quicker to take on at the quarry. No location is ever left part placed.'
      : 'The surplus is placed at the next location, which is then finished on a later trip. Nothing is carried back and loading is always a full cargo, at the cost of a second visit to that location.'));
  gp.appendChild(selField('Layers within one phase',cy.campaignMode,
    [{value:'combined',label:'Placed together on one visit'},{value:'sequential',label:'A separate pass per layer'}],
    v=>{cy.campaignMode=v; refresh();},
    cy.campaignMode==='combined'
      ? 'Layers sharing a lay phase are placed on the same visit.'
      : 'Every layer gets its own pass of the field, whatever its phase. More visits and more transits.'));
  pol.appendChild(gp);
  pol.appendChild(liveBlock(box=>{
    if(!STATE.turbines.length || !STATE.vessels.filter(v=>v.active).length) return;
    const run=pol2=>{ const c=clone(STATE); c.cycle.splitPolicy=pol2;
      const s=Engine.fleetSchedule(c); const p=s.perVessel[0];
      return {trips:s.totalTrips, visits:s.totalVisits, days:s.projectDays,
              left:p?p.sim.leftoverReturned:0, load:p?p.sim.acc.loading:0}; };
    const a=run('complete'), b=run('split');
    const t=el('table',{class:'data'});
    t.appendChild(el('tr',{},['Option','Trips','Visits','Loading (h)','Carried back (t)','Programme (days)'].map(h=>el('th',{},[h]))));
    [['Carry back and top up',a,'complete'],['Dump and return later',b,'split']].forEach(([lab,r,k])=>{
      t.appendChild(el('tr',{class:cy.splitPolicy===k?'is-best':''},[
        el('td',{},[lab+(cy.splitPolicy===k?'  (selected)':'')]),
        el('td',{},[String(r.trips)]), el('td',{},[String(r.visits)]),
        el('td',{},[fmtI(r.load)]), el('td',{},[fmtI(r.left)]), el('td',{},[fmt(r.days,1)])]));
    });
    box.appendChild(t);
    const diff=a.days-b.days;
    box.appendChild(el('p',{class:'sec-note'},[
      Math.abs(diff)<0.05
        ? 'Both options give the same programme here, so choose on operational grounds.'
        : (diff>0
            ? `Dumping the surplus and returning later is ${fmt(diff,1)} days shorter, because loading is always a full cargo and no rock sails back unplaced. It costs ${b.visits-a.visits} extra location visits.`
            : `Carrying the surplus back is ${fmt(-diff,1)} days shorter here, because the saved visits outweigh the extra loading.`)]));
  }));
  page.appendChild(pol);

  const c=card('Durations');
  const g=el('div',{class:'grid three'});
  g.appendChild(numField('Pre-survey',cy.preSurveyHr,'hr',v=>{cy.preSurveyHr=v; refresh();},'Once per location, before the first placement.'));
  g.appendChild(numField('Approach and DP positioning',cy.positioningHr,'hr',v=>{cy.positioningHr=v; refresh();},'Every visit, including repeat visits.'));
  g.appendChild(numField('Post-survey',cy.postSurveyHr,'hr',v=>{cy.postSurveyHr=v; refresh();},'Once per location, after the last placement.'));
  g.appendChild(numField('Port turnaround',cy.portTurnaroundHr,'hr',v=>{cy.portTurnaroundHr=v; refresh();},'Docking, undocking and port manoeuvring, once per trip.'));
  g.appendChild(numField('Dumping contingency',cy.dumpingContingencyPct,'%',v=>{cy.dumpingContingencyPct=clamp(v,0,100); refresh();},'Added to the calculated dumping time for pauses, repositioning within the footprint and rate loss.'));
  g.appendChild(numField('Rework probability',cy.reworkProbabilityPct,'%',v=>{cy.reworkProbabilityPct=clamp(v,0,100); refresh();},'Share of locations expected to need a corrective pass.'));
  c.appendChild(g);
  const g2=el('div',{class:'grid two'});
  g2.appendChild(numField('Rework duration',cy.reworkExtraHr,'hr',v=>{cy.reworkExtraHr=v; refresh();},'Per reworked location, weighted by the probability.'));
  g2.appendChild(numField('Rework rock',cy.reworkRockPct,'% of design',v=>{cy.reworkRockPct=clamp(v,0,100); refresh();},
    `Expected additional rock across the project = ${fmt(cy.reworkProbabilityPct/100*cy.reworkRockPct,2)}% of the design quantity.`));
  c.appendChild(g2);
  c.appendChild(el('p',{class:'sec-note'},['Fallpipe deployment and retrieval are set per vessel; dumping rates are set per rock layer.']));
  page.appendChild(c);

  if(!STATE.turbines.length){ page.appendChild(notice('info','The time breakdown appears once locations are defined.')); return; }
  page.appendChild(liveBlock(box=>{
  const s=Engine.fleetSchedule(STATE);
  const pv=s.perVessel[0];
  if(!pv){ box.appendChild(notice('warn','Add a vessel on the Vessels tab to see the breakdown.')); return; }

  const bd=card('Campaign time — '+pv.vessel.name,
    `${pv.sim.trips.length} trips, ${pv.sim.visits} visits across ${pv.locs.length} locations${pv.sim.campaigns>1?', in '+pv.sim.campaigns+' layer campaigns':''}.`);
  const a=pv.sim.acc;
  const rows=[['Loading at quarry',a.loading],['Laden transit',a.ladenTransit],['Pre-survey',a.preSurvey],
    ['Approach and positioning',a.positioning],['Fallpipe deployment',a.fallpipeDeploy],['Rock dumping',a.dumping],
    ['Fallpipe retrieval',a.fallpipeRetrieve],['Post-survey',a.postSurvey],['In-field moves',a.fieldTransit],
    ['Ballast transit',a.ballastTransit],['Port turnaround',a.portTurnaround],['Rework allowance',a.rework]];
  const tot=rows.reduce((x,r)=>x+r[1],0)||1, mx=Math.max(...rows.map(r=>r[1]));
  rows.forEach(([l,h])=> bd.appendChild(el('div',{class:'bar-row'},[
    el('div',{class:'b-label'},[l]),

    el('div',{class:'b-val'},[fmt(h,1)+' h']),
    el('div',{class:'b-pct'},[fmt(h/tot*100,1)+'%'])])));
  bd.appendChild(readout(['Working ',strong(fmt(pv.sim.totalHours,0)+' h'),
    ' · with weather ',strong(fmt(pv.weather.elapsedHours,0)+' h'),
    ' · with maintenance ',strong(fmt(pv.elapsedHours,0)+' h'),
    ' · plus mob/demob ',strong(fmt(STATE.cycle.mobDemobDays,0)+' d'),
    ' = ',strong(fmt(pv.days,1)+' days')]));
  if(pv.sim.leftoverReturned>0)
    bd.appendChild(notice('info',`${fmtI(pv.sim.leftoverReturned)} t is carried back to port across the campaign because a whole location did not fit in the cargo remaining. That is the cost of completing every location in one visit.`));
  box.appendChild(bd);

  if(pv.sim.parts && pv.sim.parts.length>1){
    const pc=card('By campaign');
    const pt=el('table',{class:'data'});
    pt.appendChild(el('tr',{},['Campaign','Trips','Visits','Dumping h','Transit h','Working h'].map(h=>el('th',{},[h]))));
    pv.sim.parts.forEach(p=> pt.appendChild(el('tr',{},[
      el('td',{},[p.label]), el('td',{},[String(p.trips.length)]), el('td',{},[String(p.visits)]),
      el('td',{},[fmtI(p.acc.dumping)]), el('td',{},[fmtI(p.acc.ladenTransit+p.acc.ballastTransit+p.acc.fieldTransit)]),
      el('td',{},[fmtI(p.totalHours)])])));
    pc.appendChild(pt);
    box.appendChild(pc);
  }

  const ex=card('Trip detail','The first four trips, showing how each cargo is spread across locations.');
  const tb=el('table',{class:'data'});
  tb.appendChild(el('tr',{},['Trip','Loaded (t)','Topped up (t)','Locations served','Left on board (t)'].map(h=>el('th',{},[h]))));
  pv.sim.trips.slice(0,4).forEach((t,i)=> tb.appendChild(el('tr',{},[
    el('td',{},[String(i+1)]), el('td',{},[fmtI(t.loaded)]), el('td',{},[fmtI(t.toppedUp)]),
    el('td',{},[t.visits.map(x=>x.id+' ('+fmtI(x.tonnes)+' t)').join(', ')||'—']),
    el('td',{},[fmtI(t.leftover)])])));
  ex.appendChild(tb);
  if(pv.sim.trips.length>4) ex.appendChild(el('p',{class:'sec-note'},[`${pv.sim.trips.length-4} further trips follow the same pattern.`]));
  box.appendChild(ex);
  }));
};

R.schedule = function(page){
  head(page,'Fleet and programme','Allocation, trips and campaign duration. Vessels work their own allocation in parallel, so the campaign ends when the slowest finishes.');
  if(!STATE.turbines.length){ page.appendChild(emptyState('Programme','No locations to schedule yet.')); return; }
  const s=Engine.fleetSchedule(STATE);
  page.appendChild(kpiRow([
    ['Trips',fmtI(s.totalTrips),''],['Visits',fmtI(s.totalVisits),''],
    ['Sailing',fmtI(s.sailingNM),'NM'],['Programme',fmt(s.projectDays,1),'days']]));
  if(!s.perVessel.length){ page.appendChild(notice('error','No active vessels. Activate one on the Vessels tab.')); return; }

  const c=card('By vessel');
  const t=el('table',{class:'data'});
  t.appendChild(el('tr',{},['Vessel','Locations','Rock (t)','Cargo/trip (t)','Trips','Visits','Working h','Weather h','Maint h','Days','Load'].map(h=>el('th',{},[h]))));
  const mx=Math.max(...s.perVessel.map(p=>p.days));
  s.perVessel.forEach(p=> t.appendChild(el('tr',{},[
    el('td',{},[p.vessel.name]), el('td',{},[String(p.locs.length)]), el('td',{},[fmtI(p.tonnes)]),
    el('td',{},[fmtI(p.sim.cargoPerTrip)]), el('td',{},[String(p.sim.trips.length)]),
    el('td',{},[String(p.sim.visits)]), el('td',{},[fmtI(p.sim.totalHours)]),
    el('td',{},[fmtI(p.weather.elapsedHours-p.sim.totalHours)]),
    el('td',{},[fmtI(p.maintenanceHours)]), el('td',{},[fmt(p.days,1)]),
    el('td',{},[fmt(mx>0?p.days/mx*100:0,0)+'%'])])));
  c.appendChild(t);
  if(s.perVessel.length>1){
    const spread=mx-Math.min(...s.perVessel.map(p=>p.days));
    if(spread>mx*0.15) c.appendChild(notice('warn',
      `Vessel workloads differ by ${fmt(spread,1)} days. Reallocating locations on the Site tab could shorten the campaign by up to ${fmt(spread/2,1)} days.`));
  }
  page.appendChild(c);

  const gc=card('Relative loading');
  s.perVessel.forEach(p=> gc.appendChild(el('div',{class:'bar-row'},[
    el('div',{class:'b-label'},[p.vessel.name]),
    el('div',{class:'b-track'},[el('div',{class:'b-fill alt',style:`width:${mx>0?p.days/mx*100:0}%`})]),
    el('div',{class:'b-val'},[fmt(p.days,1)+' d']),
    el('div',{class:'b-pct'},[String(p.locs.length)+' loc'])])));
  page.appendChild(gc);

  const st=asDate(STATE.project.startDate);
  if(st&&s.projectDays>0){
    const en=addDays(st,s.projectDays);
    const d=card('Dates');
    d.appendChild(el('table',{class:'data'},[
      el('tr',{},[el('td',{},['Start']),el('td',{},[fmtDate(st)])]),
      el('tr',{},[el('td',{},['Estimated completion']),el('td',{},[fmtDate(en)])]),
      el('tr',{},[el('td',{},['Duration']),el('td',{},[fmt(s.projectDays,1)+' days / '+fmt(s.projectDays/7,1)+' weeks'])]),
      el('tr',{},[el('td',{},['Weather downtime']),el('td',{},[STATE.weather.downtimePct+'%'+(STATE.weather.offshoreOnly?' (offshore only)':' (all activity)')])]),
      el('tr',{},[el('td',{},['Maintenance and standby']),el('td',{},[STATE.cycle.maintenancePct+'%'])]),
      el('tr',{},[el('td',{},['Mobilisation and demobilisation']),el('td',{},[STATE.cycle.mobDemobDays+' days'])]),
    ]));
    page.appendChild(d);
  }
};

R.dashboard = function(page){
  head(page,'Dashboard','Everything a tender review asks for on one screen.');
  if(!STATE.turbines.length){ page.appendChild(emptyState('Dashboard','Nothing to summarise yet.')); return; }
  const s=Engine.fleetSchedule(STATE), T=s.roll.totals.operational;
  page.appendChild(kpiRow([
    ['Locations',String(STATE.turbines.length),''],
    ['Rock to procure',fmtI(T.tonnageWithRework),'t'],
    ['Volume',fmtI(T.designVolume),'m³'],
    ['Average per location',fmtI(STATE.turbines.length?T.tonnage/STATE.turbines.length:0),'t']]));
  page.appendChild(kpiRow([
    ['Vessels',String(s.perVessel.length),''],['Trips',fmtI(s.totalTrips),''],
    ['Sailing',fmtI(s.sailingNM),'NM'],['Programme',fmt(s.projectDays,1),'days']]));

  const g=el('div',{class:'grid two'});
  const comp=card('Where the time goes','Across the whole fleet.');
  const A=s.perVessel.reduce((a,p)=>{Object.keys(p.sim.acc).forEach(k=>a[k]=(a[k]||0)+p.sim.acc[k]); return a;},{});
  const grp=[['Sailing',(A.ladenTransit||0)+(A.ballastTransit||0)+(A.fieldTransit||0),'#2b6a8f'],
    ['Dumping',A.dumping||0,'#c2761b'],
    ['Fallpipe handling',(A.fallpipeDeploy||0)+(A.fallpipeRetrieve||0),'#8a5ba0'],
    ['Loading',A.loading||0,'#3f7d5c'],
    ['Survey',(A.preSurvey||0)+(A.postSurvey||0),'#a5382c'],
    ['Positioning',A.positioning||0,'#5b6b78'],
    ['Port turnaround',A.portTurnaround||0,'#8a7a5c'],
    ['Rework',A.rework||0,'#b0455f']];
  const tot=grp.reduce((a,x)=>a+x[1],0)||1;
  const stack=el('div',{class:'stack'});
  grp.forEach(([l,v,cl])=> stack.appendChild(el('div',{class:'stack-seg',style:`width:${v/tot*100}%;background:${cl}`,title:`${l} ${fmt(v,0)} h`})));
  comp.appendChild(stack);
  grp.slice().sort((a,b)=>b[1]-a[1]).forEach(([l,v,cl])=> comp.appendChild(el('div',{class:'legend'},[
    el('span',{class:'dot',style:`background:${cl}`}), el('span',{class:'l-name'},[l]),
    el('span',{class:'l-val'},[fmt(v,0)+' h']), el('span',{class:'l-pct'},[fmt(v/tot*100,1)+'%'])])));
  const wx=s.perVessel.reduce((a,p)=>a+p.weather.elapsedHours-p.sim.totalHours,0);
  const mt=s.perVessel.reduce((a,p)=>a+p.maintenanceHours,0);
  comp.appendChild(el('p',{class:'sec-note'},[`Working time ${fmtI(tot)} h. Weather adds ${fmtI(wx)} h, maintenance ${fmtI(mt)} h, mobilisation ${fmtI(STATE.cycle.mobDemobDays*24)} h.`]));
  g.appendChild(comp);

  const prod=card('Productivity');
  const pt=el('table',{class:'data'});
  pt.appendChild(el('tr',{},['Vessel','t/day','m³/day','loc/day','trips/day','t/trip'].map(h=>el('th',{},[h]))));
  s.perVessel.forEach(p=>{ const d=p.days||1;
    pt.appendChild(el('tr',{},[el('td',{},[p.vessel.name]),el('td',{},[fmtI(p.tonnes/d)]),
      el('td',{},[fmtI(p.tonnes/d/s.effBulkDensity)]),el('td',{},[fmt(p.locs.length/d,2)]),
      el('td',{},[fmt(p.sim.trips.length/d,2)]),el('td',{},[fmtI(p.sim.cargoPerTrip)])])); });
  prod.appendChild(pt);
  prod.appendChild(el('p',{class:'sec-note'},[`Volumes converted at the fleet-average placed bulk density of ${fmt(s.effBulkDensity,3)} t/m³.`]));
  g.appendChild(prod);
  page.appendChild(g);

  const iss=Engine.validate(STATE);
  const vc=card('Checks');
  if(!iss.length) vc.appendChild(notice('ok','No issues found.'));
  iss.filter(i=>i.level==='error').forEach(i=>vc.appendChild(notice('error',i.msg)));
  iss.filter(i=>i.level==='warn').forEach(i=>vc.appendChild(notice('warn',i.msg)));
  page.appendChild(vc);
};

   PAGE: SENSITIVITY
   ========================================================================= */
function schedWith(fn){ const c=clone(STATE); fn(c); return Engine.fleetSchedule(c); }
R.sensitivity = function(page){
  head(page,'Sensitivity','Each variable moved alone, everything else held. The tornado ranks what actually controls the campaign.');
  if(!STATE.turbines.length || !STATE.vessels.length){ page.appendChild(emptyState('Sensitivity','A sensitivity study needs locations and at least one vessel.')); return; }
  const base=Engine.fleetSchedule(STATE).projectDays;
  const levers=[
    {label:'Vessel cargo capacity',f:(s,k)=>s.vessels.forEach(v=>{v.capacityT.nom*=k; if(v.hopperVolumeM3>0) v.hopperVolumeM3*=k;})},
    {label:'Quarry distance',f:(s,k)=>s.quarry.distanceNM*=k},
    {label:'Dumping rate',f:(s,k)=>s.scour.layers.forEach(L=>L.dumpRateTph.nom*=k)},
    {label:'Loading rate',f:(s,k)=>s.vessels.forEach(v=>v.loadingRateTph.nom*=k)},
    {label:'Laden speed',f:(s,k)=>s.vessels.forEach(v=>v.ladenSpeedKn.nom*=k)},
    {label:'Weather downtime',f:(s,k)=>s.weather.downtimePct=clamp(s.weather.downtimePct*k,0,85)},
    {label:'Layer thickness',f:(s,k)=>s.scour.layers.forEach(L=>L.thicknessNom*=k)},
    {label:'Crest extent',f:(s,k)=>s.scour.layers.forEach(L=>{
      L.topExtentFactor*=k; L.crestDiameter*=k; L.crestOffset*=k;
      L.crestRadius*=k; L.wallFactor*=k;})},
    {label:'Fill factor',f:(s,k)=>s.scour.layers.forEach(L=>{const p=clamp(Engine.packingOf(L.material)*k,0.2,0.95);
      L.material.packingFactor=p; L.material.porosity=1-p;})},
    {label:'Fallpipe handling',f:(s,k)=>s.vessels.forEach(v=>{v.fallpipeDeployHr.nom*=k; v.fallpipeRetrieveHr.nom*=k;})},
    {label:'Survey durations',f:(s,k)=>{s.cycle.preSurveyHr*=k; s.cycle.postSurveyHr*=k;}},
    {label:'Port turnaround',f:(s,k)=>s.cycle.portTurnaroundHr*=k},
  ];
  const res=levers.map(l=>{
    const lo=schedWith(s=>l.f(s,0.75)).projectDays, hi=schedWith(s=>l.f(s,1.25)).projectDays;
    return {label:l.label, lo, hi, swing:Math.abs(hi-lo)};
  }).sort((a,b)=>b.swing-a.swing);
  const mx=Math.max(...res.map(r=>Math.max(Math.abs(r.lo-base),Math.abs(r.hi-base))))||1;
  const c=card('Tornado, ±25% on each variable','Bars show the change in campaign duration against the base case.');
  res.forEach(r=>{
    const row=el('div',{class:'tor-row'});
    row.appendChild(el('div',{class:'t-name'},[r.label]));
    const tr=el('div',{class:'t-track'});
    tr.appendChild(el('div',{class:'t-axis'}));
    const seg=(v,cls)=>{const w=Math.abs(v)/mx*50, left=v<0?50-w:50;
      return el('div',{class:'t-seg '+cls,style:`left:${left}%;width:${w}%`});};
    tr.appendChild(seg(r.lo-base,'lo')); tr.appendChild(seg(r.hi-base,'hi'));
    row.appendChild(tr);
    row.appendChild(el('div',{class:'t-val'},[`${fmt(r.lo,1)} – ${fmt(r.hi,1)} d`]));
    c.appendChild(row);
  });
  c.appendChild(el('p',{class:'sec-note'},[`Base case ${fmt(base,1)} days. Strongest lever: ${res[0].label} (${fmt(res[0].swing,1)} days across the range). Weakest: ${res[res.length-1].label} (${fmt(res[res.length-1].swing,1)} days).`]));
  page.appendChild(c);

  const nv=card('Fleet size','Copies of the first vessel, locations rebalanced.');
  const tpl=STATE.vessels[0];
  if(tpl){
    const t=el('table',{class:'data'});
    t.appendChild(el('tr',{},['Vessels','Days','Change','Marginal gain'].map(h=>el('th',{},[h]))));
    let prev=null;
    for(let n=1;n<=5;n++){
      const d=schedWith(s=>{
        s.vessels=Array.from({length:n},(_,i)=>Object.assign(clone(tpl),{id:'sv'+i,name:tpl.name+' #'+(i+1),active:true}));
        s.turbines.forEach(x=>x.vesselId=null);}).projectDays;
      t.appendChild(el('tr',{},[el('td',{},[String(n)]),el('td',{},[fmt(d,1)]),
        el('td',{},[prev===null?'—':fmt(d-prev,1)+' d']),
        el('td',{},[prev===null?'—':fmt((prev-d)/prev*100,1)+'%'])]));
      prev=d;
    }
    nv.appendChild(t);
  }
  page.appendChild(nv);

  const cap=card('Cargo capacity','A larger vessel only helps while trips are still being removed.');
  const ct=el('table',{class:'data'});
  ct.appendChild(el('tr',{},['Capacity (t)','Trips','Days','Change'].map(h=>el('th',{},[h]))));
  let prevD=null;
  [10000,14600,20000,25000,30000,35000,40000].forEach(capT=>{
    const r=schedWith(s=>s.vessels.forEach(v=>{
      const k=capT/v.capacityT.nom; v.capacityT.nom=capT; if(v.hopperVolumeM3>0) v.hopperVolumeM3*=k;}));
    ct.appendChild(el('tr',{},[el('td',{},[fmtI(capT)]),el('td',{},[String(r.totalTrips)]),
      el('td',{},[fmt(r.projectDays,1)]),el('td',{},[prevD===null?'—':fmt(r.projectDays-prevD,1)+' d'])]));
    prevD=r.projectDays;
  });
  cap.appendChild(ct);
  page.appendChild(cap);

  const dist=card('Quarry distance');
  const dt=el('table',{class:'data'});
  dt.appendChild(el('tr',{},['NM','km','Days'].map(h=>el('th',{},[h]))));
  [50,100,150,200,250,300,400,500].forEach(d=> dt.appendChild(el('tr',{},[
    el('td',{},[String(d)]),el('td',{},[fmt(d*NM_KM,0)]),
    el('td',{},[fmt(schedWith(s=>s.quarry.distanceNM=d).projectDays,1)])])));
  dist.appendChild(dt);
  page.appendChild(dist);
};

   ========================================================================= */
R.scenarios = function(page){
  head(page,'Scenarios','Saved snapshots of the whole project for side-by-side comparison. Everything is captured, so a scenario reloads exactly as it was.');
  page.appendChild(el('div',{class:'btn-row'},[
    el('button',{class:'btn',onclick:()=>{
      uiPrompt([{label:'Scenario name',value:STATE.meta.scenarioName||('Scenario '+(STATE.scenarios.length+1))}],
        vals=>{ const name=(vals[0]||'').trim();
          if(!name){ uiAlert('Give the scenario a name.'); return; }
          saveScenario(name); },
        {title:'Save scenario', ok:'Save'});
    }},['Save current state as a scenario'])]));
  function saveScenario(name){
      const s=Engine.fleetSchedule(STATE);
      const snap=clone(STATE); delete snap.scenarios;
      STATE.scenarios.push({name,saved:new Date().toISOString(),snapshot:snap,metrics:{
        locations:STATE.turbines.length, vessels:s.perVessel.length,
        capacity:STATE.vessels[0]?STATE.vessels[0].capacityT.nom:0,
        tonnage:s.roll.totals.operational.tonnageWithRework,
        volume:s.roll.totals.operational.designVolume,
        trips:s.totalTrips, days:s.projectDays,
        shape:STATE.scour.geometryType, phase:STATE.scour.layPhase,
        distance:STATE.quarry.distanceNM, quarry:STATE.quarry.name}});
      refresh();
  }
  if(!STATE.scenarios.length){
    page.appendChild(notice('info','No scenarios saved yet. Configure a case, save it, change something and save again to compare.'));
    return;
  }
  const c=card('Comparison');
  const t=el('table',{class:'data'});
  t.appendChild(el('tr',{},['Scenario','Phase','Shape','Quarry','NM','Vessels','Capacity (t)','Rock (t)','Trips','Days',''].map(h=>el('th',{},[h]))));
  const best=Math.min(...STATE.scenarios.map(s=>s.metrics.days));
  STATE.scenarios.forEach((sn,i)=>{
    const m=sn.metrics;
    t.appendChild(el('tr',{class:m.days===best?'is-best':''},[
      el('td',{},[sn.name]),el('td',{},[m.phase||'—']),el('td',{},[m.shape]),
      el('td',{},[m.quarry||'—']),el('td',{},[fmt(m.distance,0)]),el('td',{},[String(m.vessels)]),
      el('td',{},[fmtI(m.capacity)]),el('td',{},[fmtI(m.tonnage)]),el('td',{},[String(m.trips)]),
      el('td',{},[fmt(m.days,1)]),
      el('td',{},[
        el('button',{class:'btn tiny ghost',onclick:()=>{
          uiConfirm('The project on screen will be replaced by "'+sn.name+'".',
            ()=>{ const keep=STATE.scenarios;
                  STATE=Object.assign(clone(sn.snapshot),{scenarios:keep}); refresh(); },
            {title:'Load scenario',ok:'Load'});}},['Load']),
        el('button',{class:'btn tiny danger',onclick:()=>{STATE.scenarios.splice(i,1); refresh();}},['×'])])]));
  });
  c.appendChild(t);
  c.appendChild(el('p',{class:'sec-note'},['The shortest campaign is highlighted. Duration alone is not the decision; weigh it against the rock quantity and the vessel count each case needs.']));
  page.appendChild(c);
};

  rv.appendChild(tbl([

  rv.appendChild(tbl([

/* -------------------------------------------------------------------------
   PRINTING
   -------------------------------------------------------------------------
   window.print() and window.open() are both at the mercy of where the file is
   being viewed. Inside a preview pane or any sandboxed frame, printing hits the
   surrounding page rather than the report and pop-ups are refused outright, so
   neither route can be relied on. The dependable path is to write the report
   out as its own file, which the browser can open and print like any document.
   ------------------------------------------------------------------------- */
function inFrame(){
  try{ return window.self !== window.top; }catch(e){ return true; }
}
function reportHTML(){
  const rv=document.getElementById('reportView');
  if(!rv) return null;
  const clone=rv.cloneNode(true);
  clone.querySelectorAll('.no-print,.btn-row,button,input,select,textarea').forEach(n=>n.remove());
  // canvases carry no pixels through a clone, so they are baked into images
  const src=rv.querySelectorAll('canvas');
  clone.querySelectorAll('canvas').forEach((c,i)=>{
    try{
      const img=document.createElement('img');
      img.setAttribute('src', src[i].toDataURL('image/png'));
      img.setAttribute('style','max-width:100%;height:auto');
      c.parentNode.replaceChild(img,c);
    }catch(e){ c.remove(); }
  });
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const title=(STATE.project.name||'Scour protection report').replace(/[<>&]/g,' ');
  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>'+title+'</title><style>'+css+'</style><style>'+
    'body{background:#fff;margin:0;padding:20px 24px;color:#1a242c;'+
      'font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}'+
    '#reportView{border:0;padding:0;margin:0;max-width:900px}'+
    '.printbar{margin:0 0 16px;padding:10px 14px;background:#f2f5f7;border:1px solid #dde4e9;'+
      'border-radius:5px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between}'+
    '.printbar button{background:#12303f;color:#fff;border:0;padding:7px 14px;border-radius:5px;'+
      'font-size:13px;cursor:pointer}'+
    '@page{size:A4 portrait;margin:14mm 12mm}'+
    '@media print{body{padding:0}.printbar{display:none}}'+
    '</style></head><body>'+
    '<div class="printbar"><span>Use your browser\u2019s print command and choose "Save as PDF".</span>'+
    '<button onclick="window.print()">Print</button></div>'+
    clone.outerHTML+'</body></html>';
}
/* the dependable route: write the report to a file */
function downloadReport(){
  const html=reportHTML();
  if(!html){ uiAlert('Open the Report tab first.'); return; }
  const name=(STATE.project.name||'scour-report').replace(/[^a-z0-9\-_]+/gi,'_')+'_report.html';
  download(name, html, 'text/html');
  uiAlert('The report has been written to '+name+'.\nOpen that file and print it, choosing "Save as PDF" as the destination.','','Report saved');
}
/* direct print, which works when the file is open in a browser tab of its own */
function printDirect(){
  if(inFrame()){
    uiConfirm('This looks like a preview pane rather than a browser tab of its own. Printing from here reaches the surrounding page, not the report.\nSaving the report to a file and opening that is the reliable route.',
      downloadReport, {title:'Printing is restricted here', ok:'Save the report to a file'});
    return;
  }
  setTimeout(()=>{ try{ window.print(); }
    catch(e){ uiConfirm('The browser refused the print command: '+e.message+'\nSaving the report to a file works instead.',
      downloadReport, {title:'Could not print', ok:'Save the report to a file'}); } },60);
}
/* a separate window, when the browser allows one */
function printStandalone(){
  const html=reportHTML();
  if(!html){ uiAlert('Open the Report tab first.'); return; }
  let win=null;
  try{ win=window.open('','_blank'); }catch(e){ win=null; }
  if(!win || !win.document){
    uiConfirm('The browser blocked the new window, which a preview pane or a pop-up blocker will do.\nSaving the report to a file works instead.',
      downloadReport, {title:'Could not open a window', ok:'Save the report to a file'});
    return;
  }
  try{
    win.document.open(); win.document.write(html); win.document.close();
    setTimeout(()=>{ try{ win.focus(); }catch(e){} },200);
  }catch(e){
    try{ win.close(); }catch(e2){}
    uiConfirm('The browser would not let the report be written to a new window.\nSaving it to a file works instead.',
      downloadReport, {title:'Could not open a window', ok:'Save the report to a file'});
  }
}

function assumptions(){
  const sc=STATE.scour,q=STATE.quarry,w=STATE.weather,cy=STATE.cycle,a=[];
  sc.layers.filter(L=>L.volumeBasis==='cylinder').forEach(L=>
    a.push(`${L.name} is quantified on the simplified flat-cylinder basis: a disc of full thickness out to the toe radius, with no taper deducted and the pile footprint included. This overstates the real placed solid by roughly 10 to 13 per cent.`));
  sc.layers.forEach(L=>{ const m=L.extentMode||'wall';
    if(m==='wall') a.push(`${L.name} extends ${L.crestOffset} m beyond the pile wall at the crest, so the protection is the same width at every location whatever the pile diameter.`);
    else if(m==='wallFactor') a.push(`${L.name} extends ${L.wallFactor} times the pile diameter beyond the pile wall, so the width scales with the pile.`);
    else if(m==='radius') a.push(`${L.name} is set to a crest radius of ${L.crestRadius} m from the pile centre.`);
    else if(m==='factor') a.push(`${L.name} has a crest diameter of ${L.topExtentFactor} times the pile diameter, so the width scales with the pile.`);
    else a.push(`${L.name} has a fixed crest diameter of ${L.crestDiameter} m.`); });
  a.push('Layer volumes are integrated analytically over the crest and slope of an axisymmetric profile. This is algebraically the truncated-cone form V = ⅓πt(R² + r² + Rr) − ¼πØi²t, so the result is exact and directly comparable with a quantity prepared that way.');
  a.push('Cable corridors are removed by integrating the layer profile over each corridor\u2019s radial band and angular share, not by applying a flat percentage to the total volume.');
  sc.layers.forEach(L=> a.push(`${L.name}: bulk density = ${L.material.solidDensity} × ${fmt(Engine.packingOf(L.material),3)} = ${fmt(Engine.bulkDensity(L.material),3)} t/m³, volume allowance ${fmt(L.material.volumeAllowance||1,2)}, dumping rate ${fmtI(L.dumpRateTph.nom)} t/hr, toe ${L.toeMode==='fixed'?'fixed at '+L.toeLength+' m':'driven by a 1:'+L.slopeRatio+' slope'}.`));
  a.push('The fill factor is a solidity fraction below 1, so bulk density = solid density × fill factor. It is not a multiplier on density above 1 and not the same as the volume allowance, which is applied to volume for overdumping and spread.');
  a.push('Tolerances are applied as additions to the nominal design, and the upper bounds are carried into the quantity that is ordered and scheduled, so the calculated rock cannot fall below what the specification permits the installed works to be.');
  a.push(sc.applySeabedTolerance
    ? `Seabed tolerance of ${sc.seabedTolMin} / +${sc.seabedTolMax} m is applied to the bearing layer only, over ${sc.seabedAdverseSharePct}% of the footprint, on the basis that it fills any depression before the layers above are placed and the bed is not at its adverse bound everywhere.`
    : 'Seabed tolerance is excluded from the quantities.');
  a.push(`Quantities are procured and scheduled on the ${Engine.operationalFactor(sc).describe} basis.`);
  const refT=refTurbine();
  sc.layers.forEach(L=>{
    const g=Engine.resolveLayer(L,refT,sc,'nom');
    a.push(g.pileDeducted
      ? `${L.name} is an annulus: the pile and a ${fmt(g.gap,2)} m gap beyond its wall are deducted over the full ${fmt(g.thickness,2)} m thickness, giving an opening of Ø ${fmt(g.innerDiameter,2)} m. The gap is deliberate, since rock released from a fallpipe rolls inward.`
      : `${L.name} is a full pancake placed before the pile is driven, so the whole disc is placed and nothing is deducted.`);
    if(g.shapeForced) a.push(`${L.name} was requested as a pancake but is placed post-lay, which is not possible with the pile in the water, so it is calculated as a donut.`);
  });
  a.push('Vessel cargo per trip is the stated payload capacity, reduced by the cargo utilisation. A hold volume limit is applied only where one has been entered, for light rock that fills the hold before the payload is reached.');
  a.push(cy.splitPolicy==='complete'
    ? 'A location is only started when its whole requirement fits in the cargo remaining, so no location is left part placed. Rock still on board at the end of a trip sails back to the quarry and the next load is topped up to capacity, which shortens that loading operation.'
    : 'Rock still on board at the end of a run is placed at the next location, which is then completed on a later trip. Every load is a full cargo and nothing is carried back, at the cost of an extra visit to the split location.');
  a.push(`Campaign structure: ${Engine.campaignLabel(sc,cy.campaignMode)}. Layers in different lay phases cannot share a visit, so each phase is a separate pass of the field.`);
  if((sc.groups||[]).length)
    a.push(`Locations are banded into ${sc.groups.length} design group(s): ${sc.groups.map(G=>`${G.name} (${STATE.turbines.filter(t=>t.groupId===G.id).length} locations${G.mpOD>0?', D '+G.mpOD+' m':''})`).join(', ')}. Each band carries its own grade, thickness, extent, slope, density and spillage; tolerances, lay phase, corridors and dumping rates are common to the layer.`);
  a.push('Loading time uses the slower of the quay rate and the vessel rate, and both the laden and the ballast leg of every trip are counted in the campaign duration.');
  a.push('Quarry available quantity and production capacity are reference figures only. They flag whether the quarry could keep pace but do not change the calculated duration, on the basis that the supply is contracted.');
  if(sc.geometryType==='crescent')
    a.push(`Cable corridors are exclusion zones cut through ${sc.layers.filter(L=>L.applyWedges!==false).map(L=>L.name).join(' and ')||'no layer'}; ${sc.layers.filter(L=>L.applyWedges===false).map(L=>L.name).join(' and ')||'no layer'} runs continuously beneath. Each corridor opens at its stated angle but never narrows below its minimum width at the pile${sc.wedgeSideSlopes!==false?', and the rock falls away at the layer slope on both faces of the corridor':''}.`);
  a.push(`Dumping time carries a ${cy.dumpingContingencyPct}% contingency for pauses, repositioning within the footprint and rate loss.`);
  a.push(`Weather downtime of ${w.downtimePct}% is applied as elapsed = working / (1 − downtime)${w.offshoreOnly?', to offshore activity only':', to all activity'}. It is a single factor, not a metocean time series, so seasonal variation is not captured.`);
  a.push(`A ${cy.maintenancePct}% maintenance and standby allowance and ${cy.mobDemobDays} days of mobilisation and demobilisation are added to the vessel programme.`);
  a.push(`Rework: ${cy.reworkProbabilityPct}% of locations are assumed to need a corrective pass costing ${cy.reworkExtraHr} h and ${cy.reworkRockPct}% additional rock.`);
  a.push(q.autoDistance
    ? `The quarry to site distance of ${fmt(q.distanceNM,1)} NM is routed over navigable water from ${fmt(q.lat,3)}N ${fmt(q.lon,3)}E to the site position, using an embedded sea and land mask of northwest Europe at 0.05 degrees derived from a public coastline dataset. It follows water round headlands and through straits, but takes no account of traffic separation schemes, depth, ice or weather routing, so it reads a few per cent short of a navigated distance and is not a passage plan.`
    : `The quarry to site distance of ${fmt(q.distanceNM,1)} NM is entered by hand.`);
  a.push('Vessels work their allocations in parallel and independently. No shared berth, quarry queue or single loading point is modelled.');
  a.push('Positions are local project coordinates. Live chart or map service integration is not implemented in this version.');
  a.push('Cost, fuel, emissions and probabilistic (P50/P80) schedule risk are outside the scope of this version.');
  return a;
}
