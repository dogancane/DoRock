/* =========================================================================
   SAVING
   -------------------------------------------------------------------------
   Work is kept in the browser's local storage for this file, so closing the
   window and reopening it brings the project back. Local storage is not
   guaranteed: some browsers disable it for pages opened straight off the file
   system, and it is cleared if the browser's site data is cleared. So it is
   treated as a convenience, never as the record. The JSON export stays the
   real backup and the tool says so plainly rather than implying the work is
   safe when it may not be.
   ========================================================================= */
const STORE_KEY='scour-rock-planner-v3';
let STORE_OK=null, LAST_SAVED_JSON=null, LAST_SAVED_AT=null, AUTOSAVE=true, SAVE_TIMER=null;

function storageAvailable(){
  if(STORE_OK!==null) return STORE_OK;
  try{
    const k='__probe__'+Math.random();
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    STORE_OK=true;
  }catch(e){ STORE_OK=false; }
  return STORE_OK;
}
function snapshot(){
  try{ return JSON.stringify({state:STATE, savedAt:new Date().toISOString(), version:TOOL_VERSION}); }
  catch(e){ return null; }
}
function isDirty(){
  if(LAST_SAVED_JSON===null) return STATE.turbines.length>0 || (STATE.project.name||'')!=='';
  const s=snapshot();
  if(s===null) return true;
  return JSON.parse(s).state && JSON.stringify(JSON.parse(s).state)!==LAST_SAVED_JSON;
}
function saveNow(silent){
  if(!storageAvailable()){
    if(!silent) uiAlert('This browser will not let the page store data locally, usually because the file was opened straight from disk with storage disabled.\nUse "Export project" to save a .json file instead. That file is the reliable record in any case.','','Cannot save here');
    return false;
  }
  try{
    const payload=snapshot();
    if(payload===null) throw new Error('the project could not be serialised');
    window.localStorage.setItem(STORE_KEY,payload);
    LAST_SAVED_JSON=JSON.stringify(STATE);
    LAST_SAVED_AT=new Date();
    updateSaveStatus();
    return true;
  }catch(e){
    if(!silent) uiAlert('Could not save to this browser: '+e.message+'\nUse "Export project" to write a .json file instead.','','Save failed');
    return false;
  }
}
function loadSaved(){
  if(!storageAvailable()) return null;
  try{
    const raw=window.localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const p=JSON.parse(raw);
    if(!p || !p.state || !p.state.project) return null;
    return p;
  }catch(e){ return null; }
}
function clearSaved(){
  if(!storageAvailable()) return;
  try{ window.localStorage.removeItem(STORE_KEY); }catch(e){}
  LAST_SAVED_JSON=null; LAST_SAVED_AT=null; updateSaveStatus();
}
function scheduleAutosave(){
  if(!AUTOSAVE || !storageAvailable()) { updateSaveStatus(); return; }
  if(SAVE_TIMER) clearTimeout(SAVE_TIMER);
  SAVE_TIMER=setTimeout(()=>{ saveNow(true); }, 1500);
  updateSaveStatus();
}
function agoText(d){
  if(!d) return '';
  const s=Math.round((Date.now()-d.getTime())/1000);
  if(s<10) return 'just now';
  if(s<60) return s+' s ago';
  if(s<3600) return Math.round(s/60)+' min ago';
  return Math.round(s/3600)+' h ago';
}
function updateSaveStatus(){
  const n=$('#saveStatus'); if(!n) return;
  n.innerHTML='';
  if(!storageAvailable()){
    n.className='save-status warn';
    n.appendChild(el('div',{},['Not saved in this browser']));
    n.appendChild(el('div',{class:'ss-note'},['Storage is blocked here. Export a .json file to keep your work.']));
    return;
  }
  const dirty=isDirty();
  n.className='save-status '+(dirty?'dirty':'clean');
  n.appendChild(el('div',{},[dirty?'Unsaved changes':'Saved '+agoText(LAST_SAVED_AT)]));
  n.appendChild(el('div',{class:'ss-note'},[
    dirty ? (AUTOSAVE?'Saving shortly':'Press Save, or your work is lost when you close this window')
          : 'Kept in this browser. Export a .json file for a real backup.']));
}

/* ---- live recalculation -------------------------------------------------
   TYPING must never rebuild the input being typed into. Handlers set state
   and call recalc(), which re-renders only the registered output blocks.
   Structural changes (adding a layer, switching a mode that shows different
   fields) still call refresh() for a full rebuild.
   -------------------------------------------------------------------------- */
let LIVE = [];
let TYPING = false;
function resetLive(){ LIVE = []; }
function liveBlock(render){
  const d = el('div',{class:'liveblock'});
  const upd = ()=>{
    d.innerHTML='';
    try{ render(d); }
    catch(e){ d.appendChild(notice('error','Could not update this section: '+e.message)); console.error(e); }
  };
  upd(); LIVE.push(upd);
  return d;
}
function recalc(){
  applyAutoDistance();
  LIVE.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } });
  try{ buildResultsBar(); }catch(e){ console.error(e); }
  scheduleAutosave();
}
/* Wrap a state mutation coming from a keystroke: any refresh() it triggers is
   suppressed, and a recalc runs instead. */
function typed(fn){
  TYPING = true;
  try{ fn(); } finally { TYPING = false; }
  recalc();
}



/* Locations removed by lowering the count are held for the session, so raising
   it again restores the originals rather than replacing them with fresh ones. */
let LOC_POOL=[];
function setLocationCount(n){
  n=Math.max(0,Math.round(n));
  const cur=STATE.turbines.length;
  if(n===cur) return;
  if(n<cur){
    LOC_POOL = STATE.turbines.slice(n).concat(LOC_POOL);
    STATE.turbines = STATE.turbines.slice(0,n);
  } else {
    let need=n-cur;
    while(need>0 && LOC_POOL.length){ STATE.turbines.push(LOC_POOL.shift()); need--; }
    const cols=Math.ceil(Math.sqrt(n))||1;
    while(need>0){
      const i=STATE.turbines.length;
      STATE.turbines.push({id:'WTG-'+String(i+1).padStart(3,'0'),
        x:(i%cols)*1200, y:Math.floor(i/cols)*1200,
        monopileDiameter:STATE.project.monopileDiameter,
        waterDepth:STATE.project.waterDepth,
        geometryOverride:'', wedges:[], vesselId:null, groupId:null});
      need--;
    }
  }
  STATE.project.numTurbines=STATE.turbines.length;
  ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();
}


/* ---- pile diameters drive the design bands -------------------------------
   The Project tab owns the pile diameters and nothing downstream may disagree
   with it. One diameter applies to the whole field. Add a second and each
   diameter gets its own design band, with the locations split between them by
   count, so a crest set as a distance beyond the pile wall resolves to a
   different radius in each band and the volumes follow.
   -------------------------------------------------------------------------- */
function pileSets(){
  const p=STATE.project;
  if(!Array.isArray(p.pileSets)) p.pileSets=[];
  if(!p.pileSets.length)
    p.pileSets=[{id:'ps0', od:p.monopileDiameter||0, count:STATE.turbines.length}];
  return p.pileSets;
}
function addPileSet(od,count){
  const sets=pileSets();
  sets.push({id:'ps'+Math.random().toString(36).slice(2,8),
             od: od!==undefined?od:(STATE.project.monopileDiameter||0),
             count: count!==undefined?count:0});
  syncPileSets();
}
function removePileSet(i){
  const sets=pileSets();
  if(sets.length<=1) return;
  const ps=sets[i]; if(!ps) return;
  const sc=STATE.scour;
  sc.groups=(sc.groups||[]).filter(g=>{
    if(g.fromPileSet===ps.id){ STATE.turbines.forEach(t=>{ if(t.groupId===g.id) t.groupId=null; }); return false; }
    return true;
  });
  sets.splice(i,1);
  syncPileSets();
}
/* a location follows the Project tab unless it sits in a band that fixes its
   own diameter, so an imported schedule with real per-location piles is safe */
function followsProject(t, sc){
  if(!t.groupId) return true;
  const g=(sc.groups||[]).find(x=>x.id===t.groupId);
  return !g || !(g.mpOD>0) || !!g.fromPileSet;
}
function syncPileSets(){
  const p=STATE.project, sc=STATE.scour, sets=pileSets();
  if(!sc.groups) sc.groups=[];

  // bands whose diameter row has gone are removed
  const live=new Set(sets.map(s=>s.id));
  sc.groups=sc.groups.filter(g=>{
    if(g.fromPileSet && !live.has(g.fromPileSet)){
      STATE.turbines.forEach(t=>{ if(t.groupId===g.id) t.groupId=null; });
      return false;
    }
    return true;
  });

  if(sets.length<=1){
    /* one diameter: no band needed, it simply is the field diameter and every
       location that follows the project takes it */
    const od=sets[0].od;
    p.monopileDiameter=od;
    sc.groups=sc.groups.filter(g=>{
      if(g.fromPileSet){ STATE.turbines.forEach(t=>{ if(t.groupId===g.id) t.groupId=null; }); return false; }
      return true;
    });
    if(od>0) STATE.turbines.forEach(t=>{ if(followsProject(t,sc)) t.monopileDiameter=od; });
    sets[0].count=STATE.turbines.length;
  } else {
    p.monopileDiameter=sets[0].od;
    sets.forEach(s=>{
      let g=sc.groups.find(x=>x.fromPileSet===s.id);
      if(!g){ g=newGroup('D '+fmt(s.od,1)+' m'); g.fromPileSet=s.id; sc.groups.push(g); }
      g.mpOD=s.od;
      if(/^D [\d.,]+ m$/.test(g.name)) g.name='D '+fmt(s.od,1)+' m';
      g.note='From the pile diameter list on the Project tab';
    });
    const total=sets.reduce((a,s)=>a+Math.max(0,Math.round(s.count)),0);
    if(total>0 && total!==STATE.turbines.length) setLocationCount(total);
    const owned=new Set(sc.groups.filter(g=>g.fromPileSet).map(g=>g.id));
    const free=[];
    STATE.turbines.forEach(t=>{ if(!t.groupId || owned.has(t.groupId)){ t.groupId=null; free.push(t); } });
    let k=0;
    sets.forEach(s=>{
      const g=sc.groups.find(x=>x.fromPileSet===s.id); if(!g) return;
      let n=Math.max(0,Math.round(s.count));
      while(n>0 && k<free.length){ free[k].groupId=g.id; free[k].monopileDiameter=s.od; k++; n--; }
    });
  }
  p.numTurbines=STATE.turbines.length;
  ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();
}


/* Shape and lay phase are not independent, so choosing one has to move the
   other. A pancake is only possible before the pile is driven, so picking it
   puts the layer pre-lay. Putting a layer post-lay means the pile is in the
   water, so a pancake becomes a donut. Without this the selection silently
   loses to the phase and the drawing does not change. */
function setProjectShape(shape){
  const sc=STATE.scour;
  sc.geometryType=shape;
  sc.layers.forEach(L=>{
    const own=L.shape||'';
    if(shape==='pancake' && (own===''||own==='pancake')) L.layPhase='pre';
    if(shape!=='pancake' && own==='') { /* phase is the user's to choose */ }
  });
  refresh();
}
function setLayerShape(L,shape){
  L.shape=shape;
  const eff=shape||STATE.scour.geometryType;
  if(eff==='pancake') L.layPhase='pre';
  refresh();
}
function setLayerPhase(L,phase){
  L.layPhase=phase;
  const eff=L.shape||STATE.scour.geometryType;
  if(phase==='post' && eff==='pancake'){
    // the pile is in the water, so this layer is an annulus
    if(L.shape==='pancake') L.shape='donut';
    else if(STATE.scour.layers.every(x=>(x.shape||'')==='')) L.shape='donut';
  }
  refresh();
}

/* ---- site position and sea distance -------------------------------------- */
function siteCentroid(){
  const withLL=STATE.turbines.filter(t=>isFinite(t.lat)&&isFinite(t.lon)&&(t.lat||t.lon));
  if(withLL.length){
    return {lat: withLL.reduce((a,t)=>a+t.lat,0)/withLL.length,
            lon: withLL.reduce((a,t)=>a+t.lon,0)/withLL.length,
            from:'the '+withLL.length+' location'+(withLL.length===1?'':'s')+' that carry coordinates'};
  }
  const p=STATE.project;
  if(p.siteLat||p.siteLon) return {lat:p.siteLat, lon:p.siteLon, from:'the site position entered below'};
  return null;
}
let ROUTE_CACHE={key:null,val:null};
function seaDistance(){
  const q=STATE.quarry, c=siteCentroid();
  if(!c || !(q.lat||q.lon)) return null;
  const key=[q.lat,q.lon,c.lat.toFixed(4),c.lon.toFixed(4)].join('|');
  if(ROUTE_CACHE.key===key) return ROUTE_CACHE.val;
  let val;
  try{ val=SeaGrid.route(q.lon,q.lat,c.lon,c.lat); }
  catch(e){ val={ok:false,reason:e.message}; }
  if(val && val.ok){
    val.greatCircleNM=SeaGrid.greatCircleNM(q.lon,q.lat,c.lon,c.lat);
    val.centroid=c;
  }
  ROUTE_CACHE={key,val};
  return val;
}
function applyAutoDistance(){
  if(!STATE.quarry.autoDistance) return;
  const r=seaDistance();
  if(r && r.ok) STATE.quarry.distanceNM=Math.round(r.distanceNM*10)/10;
}


/* Distance from every quarry in the library to the current site, routed over
   water and cached. The library cannot carry a distance of its own: quarries
   are fixed but sites are not, so the figure only means anything once a site
   position exists. */
const QDIST_CACHE=new Map();
function quarryDistance(Q){
  const c=siteCentroid();
  if(!c || !(Q.lat||Q.lon)) return null;
  const key=Q.name+'|'+c.lat.toFixed(3)+'|'+c.lon.toFixed(3);
  if(QDIST_CACHE.has(key)) return QDIST_CACHE.get(key);
  let r=null;
  try{ const s=SeaGrid.route(Q.lon,Q.lat,c.lon,c.lat); r = s && s.ok ? s.distanceNM : null; }
  catch(e){ r=null; }
  QDIST_CACHE.set(key,r);
  return r;
}
function quarriesByDistance(){
  const list=QUARRIES.map(Q=>({Q, nm:quarryDistance(Q)}));
  const known=list.filter(x=>x.nm!==null).sort((a,b)=>a.nm-b.nm);
  return known.concat(list.filter(x=>x.nm===null));
}

/* ---- controls ----------------------------------------------------------- */
function field(label, ctrl, hint, unit){
  const w=el('div',{class:'field'});
  w.appendChild(el('label',{},[label]));
  if(unit){ const r=el('div',{class:'inp-unit'}); r.appendChild(ctrl); r.appendChild(el('span',{class:'unit'},[unit])); w.appendChild(r); }
  else w.appendChild(ctrl);
  if(hint) w.appendChild(el('div',{class:'hint'},[hint]));
  return w;
}
/* Clicking a numeric field empties it so the new value can simply be typed,
   rather than the old one having to be selected and deleted first. Nothing is
   committed by the clearing itself: leave without typing and the original
   comes straight back, and the same if the field is left empty. Enter commits
   and releases the field. While typing, every keystroke still feeds the live
   figures, so the rest of the tool keeps up. */
function clearOnFocus(inp, onCommit){
  let original=inp.value, touched=false, cleared=false;
  inp.addEventListener('focus',()=>{
    if(cleared) return;          // a second focus event must not forget the value
    original=inp.value; touched=false; cleared=true; inp.value='';
  });
  inp.addEventListener('input',()=>{ touched=true; });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); inp.blur(); }
    else if(e.key==='Escape'){
      inp.value=original; touched=false;
      if(onCommit) onCommit(original);
      cleared=false; inp.blur();
    }
  });
  inp.addEventListener('blur',()=>{
    if(!cleared) return;
    if(!touched || inp.value===''){
      inp.value=original;
      if(touched && onCommit) onCommit(original);   // typed then cleared: put it back
    }
    touched=false; cleared=false;
  });
  return inp;
}
function num(value,onChange,opts){
  opts=opts||{};
  const inp=el('input',{type:'number',step:opts.step||'any',
    value:(value===undefined||value===null||isNaN(value))?'':value,
    oninput:e=>{
      const raw=e.target.value;
      // "0.", "-" and "" are legal while typing. Treat them as zero for the
      // calculation but leave the field exactly as typed.
      const v=parseFloat(raw);
      typed(()=>onChange(isNaN(v)?0:v));
    }});
  clearOnFocus(inp, raw=>{ const v=parseFloat(raw); typed(()=>onChange(isNaN(v)?0:v)); });
  return inp;
}
function numField(l,v,u,on,hint,opts){ return field(l,num(v,on,opts),hint,u); }
function txtField(l,v,on,hint,type){
  const inp=el('input',{type:type||'text',value:v||'',
    oninput:e=>{ const val=e.target.value; typed(()=>on(val)); }});
  // selected rather than emptied, so one keystroke replaces it but the
  // existing text stays readable until it does
  if((type||'text')==='text') inp.addEventListener('focus',()=>{ try{ inp.select(); }catch(e){} });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') inp.blur(); });
  return field(l,inp,hint);
}
function selField(l,v,opts,on,hint){
  const s=el('select',{onchange:e=>on(e.target.value)});
  opts.forEach(o=>{const op=el('option',{value:o.value},[o.label]); if(String(o.value)===String(v)) op.setAttribute('selected','selected'); s.appendChild(op);});
  return field(l,s,hint);
}
function checkField(l,checked,on,hint){
  const cb=el('input',{type:'checkbox'}); cb.checked=!!checked;
  cb.addEventListener('change',e=>on(e.target.checked));
  const w=el('div',{class:'field check'});
  w.appendChild(el('label',{class:'inline'},[cb,el('span',{},[l])]));
  if(hint) w.appendChild(el('div',{class:'hint'},[hint]));
  return w;
}
/* Only the nominal value drives any calculation; the bounds feed the
   sensitivity sweep alone. Showing three boxes for one number tripled the
   field count for no gain, so the bounds fold away until asked for. */
function rangeField(l,obj,unit,hint){
  const w=el('div',{class:'field'});
  const lab=el('label',{},[l]);
  const toggle=el('button',{class:'range-toggle',type:'button',
    title:'Show the minimum and maximum used by the sensitivity study'},['± range']);
  lab.appendChild(toggle);
  w.appendChild(lab);
  const r=el('div',{class:'triple'});
  const mk=k=>{
    const i=el('input',{type:'number',step:'any',value:obj[k],
      class:k==='nom'?'nom':'bound',
      title:k==='nom'?'Used in all calculations':'Bound used by the sensitivity study only',
      oninput:e=>{ const val=parseFloat(e.target.value)||0; typed(()=>{obj[k]=val;}); }});
    return clearOnFocus(i, raw=>{ const val=parseFloat(raw)||0; typed(()=>{obj[k]=val;}); });
  };
  const iMin=mk('min'), iNom=mk('nom'), iMax=mk('max');
  r.appendChild(iMin); r.appendChild(iNom); r.appendChild(iMax);
  r.appendChild(el('span',{class:'unit'},[unit]));
  w.appendChild(r);
  let open=false;
  const apply=()=>{
    iMin.style.display=open?'':'none';
    iMax.style.display=open?'':'none';
    toggle.classList.toggle('on',open);
    toggle.textContent=open?'hide range':'± range';
  };
  apply();

/* ---- baseline comparison -------------------------------------------------
   Changing one input is only instructive if the effect is visible. A baseline
   can be pinned, after which every headline figure carries its change against
   that baseline. It is pinned automatically when the example is loaded, so the
   example works as a sandbox: move a value and the consequence is on screen.
   -------------------------------------------------------------------------- */
let BASELINE=null;
function measure(){
  try{
    const s=Engine.fleetSchedule(STATE);
    const T=s.roll.totals.operational;
    return {locations:STATE.turbines.length, tonnage:T.tonnageWithRework,
            volume:T.designVolume, trips:s.totalTrips,
            vessels:STATE.vessels.filter(v=>v.active).length, days:s.projectDays};
  }catch(e){ return null; }
}
function pinBaseline(label){
  const m=measure(); if(!m) return;
  BASELINE=Object.assign(m,{label:label||'pinned', at:new Date()});
  buildResultsBar();
}
function clearBaseline(){ BASELINE=null; buildResultsBar(); }
function deltaNode(key, now){
  if(!BASELINE || BASELINE[key]===undefined) return null;
  const was=BASELINE[key];
  if(!isFinite(was)||!isFinite(now)) return null;
  const d=now-was;
  if(Math.abs(d) < Math.max(1e-9, Math.abs(was)*0.0005))
    return el('div',{class:'rb-delta same'},['no change']);
  const pct = was!==0 ? (d/was*100) : null;
  const sign = d>0?'+':'\u2212';
  const txt = pct===null ? sign+fmt(Math.abs(d),1)
            : sign+fmt(Math.abs(pct),1)+'%';
  return el('div',{class:'rb-delta '+(d>0?'up':'down'), title:'against the pinned baseline'},[txt]);
}

/* ---- in-page dialogs -----------------------------------------------------
   Native confirm() and alert() are not dependable: a browser lets the user
   tick "prevent this page from creating additional dialogs", after which
   confirm() silently returns false and every destructive action appears to do
   nothing. These render inside the page instead, so the tool always responds.
   -------------------------------------------------------------------------- */
function uiModal(title, bodyNodes, buttons){
  // only one dialog at a time, so an earlier one can never sit behind a newer
  document.querySelectorAll('.modal-back.dialog').forEach(n=>n.remove());
  const back=el('div',{class:'modal-back dialog'});
  const m=el('div',{class:'modal small'});
  if(title) m.appendChild(el('h2',{},[title]));
  (bodyNodes||[]).forEach(n=>m.appendChild(n));
  const row=el('div',{class:'btn-row',style:'justify-content:flex-end;margin-top:14px'});
  let keyHandler=null;
  const close=()=>{ if(keyHandler) document.removeEventListener('keydown',keyHandler); back.remove(); };
  (buttons||[]).forEach(b=>{
    row.appendChild(el('button',{class:'btn '+(b.cls===undefined?'ghost':b.cls),
      onclick:()=>{ close(); if(b.fn) b.fn(); }},[b.label]));
  });
  m.appendChild(row);
  keyHandler=e=>{
    if(e.key==='Escape'){ close(); }
    else if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){
      const p=(buttons||[]).find(b=>b.primary);
      if(p){ close(); if(p.fn) p.fn(); }
    }
  };
  document.addEventListener('keydown',keyHandler);
  back.addEventListener('click',e=>{ if(e.target===back) close(); });
  back.appendChild(m); document.body.appendChild(back);
  const first=m.querySelector('input,select,textarea');
  setTimeout(()=>{ try{ (first||m.querySelector('.btn-row .btn:last-child')).focus(); }catch(e){} },0);
  return close;
}
function msgNodes(msg){
  return String(msg).split('\n').filter(l=>l.trim()!=='').map(l=>el('p',{class:'dlg-msg'},[l]));
}
function uiAlert(msg, cb, title){
  uiModal(title||null, msgNodes(msg), [{label:'OK', cls:'', primary:true, fn:cb}]);
}
function uiConfirm(msg, onYes, opts){
  opts=opts||{};
  uiModal(opts.title||null, msgNodes(msg), [
    {label:opts.cancel||'Cancel', cls:'ghost'},
    {label:opts.ok||'Continue', cls:opts.danger?'danger':'', primary:true, fn:onYes}]);
}
function uiPrompt(fields, onOk, opts){
  opts=opts||{};
  const inputs=[], nodes=[];
  if(opts.message) msgNodes(opts.message).forEach(n=>nodes.push(n));
  fields.forEach(fd=>{
    const inp=el('input',{type:fd.type||'text', step:'any',
      value:(fd.value===undefined||fd.value===null)?'':fd.value});
    inputs.push(inp);
    nodes.push(field(fd.label, fd.unit?el('div',{class:'inp-unit'},[inp,el('span',{class:'unit'},[fd.unit])]):inp, fd.hint));
  });
  uiModal(opts.title||null, nodes, [
    {label:'Cancel', cls:'ghost', fn:opts.onCancel},
    {label:opts.ok||'OK', cls:'', primary:true, fn:()=>onOk(inputs.map(i=>i.value))}]);
}

/* One document-level paste handler, live only while the Site tab is open, so
   a copied schedule can be pasted without first clicking into a particular
   box. An image on the clipboard goes to the site map. */
let SITE_PASTE=null;
function installSitePaste(){
  if(SITE_PASTE) document.removeEventListener('paste',SITE_PASTE);
  SITE_PASTE=function(e){
    if(STATE.ui.activeTab!=='site') return;
    if(document.querySelector('.modal-back')) return;
    const tag=(document.activeElement&&document.activeElement.tagName)||'';
    const cd=e.clipboardData; if(!cd) return;
    const img=[...(cd.items||[])].find(it=>it.type&&it.type.indexOf('image')===0);
    if(img){
      const file=img.getAsFile();
      if(file){ e.preventDefault(); loadSiteImage(file); }
      return;
    }
    if(tag==='INPUT'||tag==='SELECT') return;          // let a normal field paste work
    const text=cd.getData('text/plain');
    if(!text || text.indexOf('\n')<0) return;          // a single value is not a schedule
    e.preventDefault();
    openImportModal(text);
  };
  document.addEventListener('paste',SITE_PASTE);
}

function copyToClipboard(text, okMsg){
  const done=()=>uiAlert(okMsg||'Copied.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,()=>fallback());
  } else fallback();
  function fallback(){
    try{
      const ta=el('textarea',{style:'position:fixed;left:-9999px'});
      ta.value=text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); done();
    }catch(err){ uiAlert('Could not reach the clipboard. Use Export CSV instead.'); }
  }
}

function wireDropZone(zone, ta){
  const stop=e=>{e.preventDefault(); e.stopPropagation();};
  ['dragenter','dragover'].forEach(ev=> zone.addEventListener(ev,e=>{stop(e); zone.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=> zone.addEventListener(ev,e=>{stop(e); zone.classList.remove('over');}));
  zone.addEventListener('drop',e=>{
    const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f){
      if(f.type && f.type.indexOf('image')===0){ loadSiteImage(f); return; }
      const r=new FileReader();
      r.onload=()=>openImportModal(String(r.result));
      r.readAsText(f);
      return;
    }
    const txt=e.dataTransfer&&e.dataTransfer.getData('text/plain');
    if(txt) openImportModal(txt);
  });
  zone.addEventListener('click',()=>{ if(ta) ta.focus(); });
  zone.addEventListener('paste',e=>{
    const cd=e.clipboardData; if(!cd) return;
    const t=cd.getData('text/plain');
    if(t){ e.preventDefault(); openImportModal(t); }
  });
}

  const list=el('div');
  function draw(){
    list.innerHTML='';

    t.wedges.forEach((w,i)=>{
      const row=el('div',{class:'wedge-row'});

  const prev=el('div',{class:'plot',style:'margin-top:10px'});
  const drawPrev=()=>{ const keep=STATE.ui.refTurbineIdx; STATE.ui.refTurbineIdx=idx;
    prev.innerHTML=planSVG(); STATE.ui.refTurbineIdx=keep; };

  m.appendChild(prev);

    el('button',{class:'btn ghost',onclick:()=>{
      uiPrompt([
        {label:'Number of corridors',value:2,type:'number'},
        {label:'Corridor angle',value:30,type:'number',unit:'\u00b0'},

         hint:'Stops the corridor pinching to nothing against the pile wall.'}],

          if(!(n>0&&a>0)){ uiAlert('Enter a corridor count and angle greater than zero.'); return; }
          t.wedges=[];

    }},['Space evenly']),

      STATE.turbines.forEach(x=>{ if((x.geometryOverride||STATE.scour.geometryType)==='crescent') x.wedges=clone(t.wedges); });
      back.remove(); refresh();
    }},['Copy to all crescent locations']),
    el('button',{class:'btn',onclick:()=>{back.remove(); refresh();}},['Done'])]));

function drawLayout(cv){
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return;
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#f7f9fa'; ctx.fillRect(0,0,W,H);
  const ts=STATE.turbines; if(!ts.length) return;
  const xs=ts.map(t=>t.x), ys=ts.map(t=>t.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const pad=42, spX=Math.max(1,maxX-minX), spY=Math.max(1,maxY-minY);
  const s=Math.min((W-2*pad)/spX,(H-2*pad)/spY);
  const bar=niceRound(spX/4);
  ctx.strokeStyle='#9aa7b1'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad,H-16); ctx.lineTo(pad+bar*s,H-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad,H-20); ctx.lineTo(pad,H-12); ctx.moveTo(pad+bar*s,H-20); ctx.lineTo(pad+bar*s,H-12); ctx.stroke();
  ctx.fillStyle='#6b7883'; ctx.font='10px ui-monospace,monospace';
  ctx.fillText(fmtI(bar)+' m',pad+bar*s+6,H-12);
  const cols={};
  STATE.vessels.forEach((v,i)=> cols[v.id]=['#2b6a8f','#c2761b','#3f7d5c','#8a5ba0','#a5382c'][i%5]);
  const showLabels = ts.length<=40;
  ts.forEach((t,i)=>{
    const x=pad+(t.x-minX)*s, y=H-pad-(t.y-minY)*s;
    const r = ts.length>60?2.5:(i===STATE.ui.refTurbineIdx?7:4.5);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = t.vesselId&&cols[t.vesselId] ? cols[t.vesselId] : '#5b6b78';
    ctx.fill();
    if(i===STATE.ui.refTurbineIdx){ ctx.strokeStyle='#c2761b'; ctx.lineWidth=2; ctx.stroke(); }
    if(showLabels){ ctx.fillStyle='#3a4750'; ctx.font='9px ui-monospace,monospace'; ctx.fillText(t.id,x+8,y+3); }
  });
}
function niceRound(v){ const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  return (n<1.5?1:n<3.5?2:n<7.5?5:10)*p; }

let loadSiteImage=function(){ uiAlert('Open the Site and locations tab first, then drop the image there.'); };
function setupCalibration(fi,cv,stx,commitBtn,dropZone){
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return;
  let img=null,pts=[],scaleM=null,origin=null,pending=[];
  commitBtn.addEventListener('click',()=>{
    pending.forEach(p=>{
      const n=STATE.turbines.length;
      STATE.turbines.push({id:'WTG-'+String(n+1).padStart(3,'0'),x:Math.round(p.x),y:Math.round(p.y),
        monopileDiameter:STATE.project.monopileDiameter,waterDepth:STATE.project.waterDepth,
        geometryOverride:'',wedges:[],vesselId:null,groupId:null});});
    pending=[]; refresh();
  });
  function load(file){
    if(!file){ return; }
    if(file.type && file.type.indexOf('image')!==0){ uiAlert('That file is not an image.'); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      img=new Image();
      img.onload=()=>{
        // fit the image to the canvas without distorting it
        const ar=img.width/img.height, cw=cv.width, ch=cv.height;
        let w=cw, h=cw/ar;
        if(h>ch){ h=ch; w=ch*ar; }
        drawX=(cw-w)/2; drawY=(ch-h)/2; drawW=w; drawH=h;
        ctx.clearRect(0,0,cw,ch);
        ctx.fillStyle='#fbfcfd'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,drawX,drawY,drawW,drawH);
        pts=[];scaleM=null;origin=null;pending=[];commitBtn.style.display='none';
        stx.textContent='Image loaded. Click two points a known distance apart to set the scale.';
      };
      img.onerror=()=>{ uiAlert('That image could not be read.'); };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }
  let drawX=0,drawY=0,drawW=cv.width,drawH=cv.height;
  loadSiteImage=load;
  fi.addEventListener('change',e=>{ load(e.target.files[0]); e.target.value=''; });
  if(dropZone){
    const stop=e=>{e.preventDefault(); e.stopPropagation();};
    ['dragenter','dragover'].forEach(ev=> dropZone.addEventListener(ev,e=>{stop(e); dropZone.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=> dropZone.addEventListener(ev,e=>{stop(e); dropZone.classList.remove('over');}));
    dropZone.addEventListener('drop',e=>{
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) load(f);
    });
    dropZone.addEventListener('click',()=>fi.click());
    ['dragenter','dragover'].forEach(ev=> cv.addEventListener(ev,e=>{stop(e);}));
    cv.addEventListener('drop',e=>{ stop(e);
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) load(f); });
  }
  cv.addEventListener('click',e=>{
    if(!img) return;
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)*(cv.width/r.width), y=(e.clientY-r.top)*(cv.height/r.height);
    if(!scaleM){
      pts.push({x,y}); ctx.fillStyle='#c2761b'; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
      if(pts.length===2){
        const d=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
        uiPrompt([{label:'Distance between those two points',value:1000,type:'number',unit:'m'}],
          vals=>{
            const real=parseFloat(vals[0]);
            if(real>0){ scaleM=real/d; origin=pts[0];
              stx.textContent=`Scale ${scaleM.toFixed(2)} m/px. Click positions, then commit.`; }
            else { pts=[]; stx.textContent='Not a usable distance. Click two points again.'; }
          },
          {title:'Set the scale', ok:'Set scale',
           message:'The two points you clicked are '+d.toFixed(0)+' px apart.',
           onCancel:()=>{ pts=[]; stx.textContent='Cancelled. Click two points again.'; }});
      }
      return;
    }
    ctx.fillStyle='#3f7d5c'; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    pending.push({x:(x-origin.x)*scaleM, y:-(y-origin.y)*scaleM});
    commitBtn.style.display='inline-block';
    stx.textContent=`${pending.length} point(s) staged.`;
  });
}

const LAYER_COLOURS=[['#b9c0c6','#7d858c'],['#dd9a5c','#b1743a'],['#8fae9b','#5d7d69'],
                     ['#a8a0c4','#736b91'],['#c9bfa2','#948a6d']];
function layerColour(i){ return LAYER_COLOURS[i%LAYER_COLOURS.length]; }
function placeholderSVG(msg){
  return `<svg viewBox="0 0 440 150" xmlns="http://www.w3.org/2000/svg" class="dwg">`+
    `<rect x="0.5" y="0.5" width="439" height="149" fill="#fbfcfd" stroke="#dde4e9" stroke-dasharray="5 4"/>`+
    `<text x="220" y="72" font-size="12" text-anchor="middle" fill="#71828e" font-family="Inter,sans-serif">${msg}</text>`+
    `<text x="220" y="92" font-size="10.5" text-anchor="middle" fill="#96a3ad" font-family="Inter,sans-serif">The drawing appears as soon as the geometry is defined.</text></svg>`;
}
function sectionSVG(){
  const sc=STATE.scour, t=refTurbine();
  if(!sc.layers.length) return placeholderSVG('No rock layers defined.');
  if(!(t.monopileDiameter>0)) return placeholderSVG('Enter a monopile diameter to draw the section.');
  const gs=sc.layers.map(L=>Engine.resolveLayer(L,t,sc,'nom'));
  const maxR0=Math.max(...gs.map(g=>g.bottomR));
  if(!(maxR0>0) || !isFinite(maxR0)) return placeholderSVG('Enter a layer thickness and crest extent to draw the section.');
  const W=680,H=340,cx=W/2,bed=245;
  const maxR=maxR0*1.14;
  const sx=(W/2-30)/maxR;
  const totalT=gs.reduce((a,g)=>a+g.thickness,0)||1;
  const sy=totalT>0?Math.min(26, 85/totalT):0;   // px per metre of thickness, exaggerated
  const mono=gs[0].monopileR*sx;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="dwg">`;
  svg+=`<rect x="0" y="${bed}" width="${W}" height="${H-bed}" fill="#f2ead6"/>`;
  svg+=`<line x1="0" y1="${bed}" x2="${W}" y2="${bed}" stroke="#c3b899" stroke-width="1.5"/>`;
  svg+=`<text x="8" y="${bed+13}" font-size="9" fill="#8a8168">seabed</text>`;
  /* Layers are built into a buffer first, because whether the pile is drawn
     over the rock or behind it depends on the lay phase. A layer placed with
     no opening is drawn as one unbroken section across the centre, since that
     is what a full pancake is. */
  let rock='', callouts='';
  let base=bed;
  gs.forEach((g,i)=>{
    const [fill,stroke]=layerColour(i);
    const th=g.thickness*sy;
    if(g.innerR<=0){
      // continuous: one polygon from toe to toe
      const pts=[[-g.bottomR*sx,base],[-g.topR*sx,base-th],[g.topR*sx,base-th],[g.bottomR*sx,base]];
      rock+=`<polygon points="${pts.map(p=>`${cx+p[0]},${p[1]}`).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="0.8"/>`;
    } else {
      [1,-1].forEach(s=>{
        const pts=[[s*g.innerR*sx,base],[s*g.innerR*sx,base-th],[s*g.topR*sx,base-th],[s*g.bottomR*sx,base]];
        rock+=`<polygon points="${pts.map(p=>`${cx+p[0]},${p[1]}`).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="0.8"/>`;
      });
    }
    callouts+=`<line x1="${cx-g.topR*sx-14}" y1="${base}" x2="${cx-g.topR*sx-14}" y2="${base-th}" stroke="${stroke}" stroke-width="0.8"/>`;
    callouts+=`<text x="${cx-g.topR*sx-18}" y="${base-th/2+3}" font-size="9" text-anchor="end" fill="#3f4b55">${sc.layers[i].name} ${g.thickness.toFixed(2)} m</text>`;
    base-=th;
  });
  /* The pile is in the water only if a layer is placed post-lay. Where every
     layer goes in first, it is a marked-out position drawn behind the rock, so
     the section reads as an unbroken pancake over the future pile. */
  const pileExists = gs.some(g=>g.phase==='post');
  if(pileExists){
    // the pile is in the water: draw it solid, over the rock placed around it
    svg+=rock;
    svg+=`<rect x="${cx-mono}" y="34" width="${2*mono}" height="${bed-34}" fill="#aab3ba" stroke="#6d7880"/>`;
    svg+=`<text x="${cx}" y="26" font-size="10" text-anchor="middle" fill="#4b565e">monopile D = ${gs[0].D.toFixed(2)} m</text>`;
  } else {
    /* Nothing is in the water yet, so there is no pile to draw. Its position is
       marked with two dotted lines and nothing else. Where the rock runs across
       the centre they stop at its surface, because the rock is over the spot;
       where the layers leave an opening they run down to the seabed through it. */
    const covered = gs.every(g=>g.innerR<=0);
    const crestY = bed - totalT*sy;
    const yEnd = covered ? crestY : bed;
    svg+=rock;
    [-1,1].forEach(s=>{
      svg+=`<line x1="${cx+s*mono}" y1="34" x2="${cx+s*mono}" y2="${yEnd}" `+
           `stroke="#9aa5ad" stroke-width="1.1" stroke-dasharray="4 4"/>`;
    });
    svg+=`<line x1="${cx-mono}" y1="34" x2="${cx+mono}" y2="34" stroke="#9aa5ad" stroke-width="1.1" stroke-dasharray="4 4"/>`;
    svg+=`<text x="${cx}" y="26" font-size="10" text-anchor="middle" fill="#8a929a">pile position, D = ${gs[0].D.toFixed(2)} m, driven later</text>`;
  }
  svg+=callouts;
  // dimensions from the pile wall, one per layer crest plus the widest toe
  const dim=(y,r0,r1,label,col)=>{
    const x0=cx+r0*sx, x1=cx+r1*sx;
    return `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${col}" stroke-width="0.7"/>`+
           `<line x1="${x0}" y1="${y-4}" x2="${x0}" y2="${y+4}" stroke="${col}" stroke-width="0.7"/>`+
           `<line x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}" stroke="${col}" stroke-width="0.7"/>`+
           `<text x="${(x0+x1)/2}" y="${y-4}" font-size="9" text-anchor="middle" fill="#3f4b55">${label}</text>`;
  };
  let dy=bed+26;
  gs.forEach((g,i)=>{
    const lbl = g.pileDeducted
      ? `${sc.layers[i].name} crest ${(g.topR-g.monopileR).toFixed(2)} m from wall  (Ø ${g.topDiameter.toFixed(2)})`
      : `${sc.layers[i].name} crest R ${g.topR.toFixed(2)} m  (Ø ${g.topDiameter.toFixed(2)})`;
    svg+=dim(dy, g.pileDeducted?g.monopileR:0, g.topR, lbl, layerColour(i)[1]);
    dy+=19;
  });
  const widest=gs.reduce((a,g)=>g.bottomR>a.bottomR?g:a,gs[0]);
  svg+=dim(dy, widest.pileDeducted?widest.monopileR:0, widest.bottomR,
    `outer toe Ø ${widest.bottomDiameter.toFixed(2)} m`,'#5b6b78');
  const desc=sc.layers.map((L,i)=>`${L.name} ${gs[i].phase==='pre'?'pre-lay':'post-lay'} ${gs[i].shape}`).join(', ');
  svg+=`<text x="8" y="${H-20}" font-size="9" fill="#8a929a">${t.id} · ${desc}</text>`;
  svg+=`<text x="8" y="${H-8}" font-size="9" fill="#8a929a">total nominal thickness ${totalT.toFixed(2)} m · thickness exaggerated for legibility · ${sc.layers.map((L,i)=>'1:'+gs[i].impliedSlope.toFixed(2)).join(' / ')} slope</text>`;
  svg+='</svg>';
  return svg;
}
function corridorPath(w, cx, cy, s, rMin, rMax){
  /* Boundary of one exclusion zone. The half-angle opens with the corridor
     angle but never lets the corridor pinch below its minimum width, so the
     shape is the hourglass seen on a cable-crossing layout rather than a bare
     sector. */
  const a=Math.max(rMin,w.rStart), b=Math.min(rMax,w.rEnd);
  if(b<=a) return '';
  const o=(w.orientationDeg||0)*Math.PI/180;
  const N=36, pts=[];
  for(let i=0;i<=N;i++){
    const r=a+(b-a)*i/N, th=Engine.wedgeHalfAngle(w,r);
    pts.push([cx+r*s*Math.cos(o+th), cy+r*s*Math.sin(o+th)]);
  }
  for(let i=N;i>=0;i--){
    const r=a+(b-a)*i/N, th=Engine.wedgeHalfAngle(w,r);
    pts.push([cx+r*s*Math.cos(o-th), cy+r*s*Math.sin(o-th)]);
  }
  return 'M '+pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' L ')+' Z';
}

function planSVG(){
  const sc=STATE.scour, t=refTurbine();
  if(!sc.layers.length) return placeholderSVG('No rock layers defined.');
  if(!(t.monopileDiameter>0)) return placeholderSVG('Enter a monopile diameter to draw the plan.');
  const gs=sc.layers.map(L=>Engine.resolveLayer(L,t,sc,'nom'));
  const maxR0=Math.max(...gs.map(g=>g.bottomR));
  if(!(maxR0>0) || !isFinite(maxR0)) return placeholderSVG('Enter a layer thickness and crest extent to draw the plan.');
  const W=440,H=440,cx=W/2,cy=H/2;
  const maxR=maxR0*1.08;
  const s=(Math.min(W,H)/2-24)/maxR;
  const ann=(rO,rI,fill,stroke,mask)=>{
    const o=`M ${cx-rO*s},${cy} a ${rO*s},${rO*s} 0 1,0 ${2*rO*s},0 a ${rO*s},${rO*s} 0 1,0 ${-2*rO*s},0 Z`;
    const i=rI>0?` M ${cx-rI*s},${cy} a ${rI*s},${rI*s} 0 1,0 ${2*rI*s},0 a ${rI*s},${rI*s} 0 1,0 ${-2*rI*s},0 Z`:'';
    return `<path d="${o}${i}" fill="${fill}" fill-rule="evenodd" stroke="${stroke}" stroke-width="0.6"${mask?` mask="url(#${mask})"`:''}/>`;
  };

  let defs='', body='';
  // widest first so the layers above sit on top
  const order = gs.map((g,i)=>({g,i})).sort((a,b)=>b.g.bottomR-a.g.bottomR);
  order.forEach(({g,i})=>{
    const [fill,stroke]=layerColour(i);
    let mask=null;
    if(g.takesWedges && g.wedges.length){
      mask='cut'+i+'_'+Math.random().toString(36).slice(2,7);
      const cuts=g.wedges.map(w=>{
        const d=corridorPath(w,cx,cy,s,g.innerR,g.bottomR);
        return d?`<path d="${d}" fill="#000"/>`:'';
      }).join('');
      defs+=`<mask id="${mask}"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>${cuts}</mask>`;
    }
    body+=ann(g.bottomR,g.innerR,fill,stroke,mask);
    body+=ann(g.topR,g.innerR,fill,stroke,mask);
  });

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="dwg">`;
  svg+=`<defs>${defs}<pattern id="excl" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">`+
       `<rect width="6" height="6" fill="#fbe6d5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e2a575" stroke-width="1.6"/></pattern></defs>`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${maxR*s}" fill="#f7f2e4"/>`;
  svg+=body;

  // exclusion zones drawn over the cut layers, hatched, as on a cable layout
  const cutLayer = gs.find(g=>g.takesWedges && g.wedges.length);
  if(cutLayer){
    cutLayer.wedges.forEach(w=>{
      const d=corridorPath(w,cx,cy,s,cutLayer.innerR,cutLayer.bottomR);
      if(d) svg+=`<path d="${d}" fill="url(#excl)" stroke="#d08b4f" stroke-width="0.8" stroke-dasharray="4 3"/>`;
    });
  }
  // solid only where a layer is placed after the pile is driven
  const pileHere = gs.some(g=>g.phase==='post');
  svg+= pileHere
    ? `<circle cx="${cx}" cy="${cy}" r="${gs[0].monopileR*s}" fill="#6f7981" stroke="#4b555c"/>`
    : `<circle cx="${cx}" cy="${cy}" r="${gs[0].monopileR*s}" fill="none" stroke="#8a929a" stroke-width="1.2" stroke-dasharray="5 4"/>`;

  const wid=gs.reduce((a,g)=>g.bottomR>a.bottomR?g:a,gs[0]);
  const y=cy-wid.bottomR*s-8;
  svg+=`<line x1="${cx-wid.bottomR*s}" y1="${y}" x2="${cx+wid.bottomR*s}" y2="${y}" stroke="#5b6b78" stroke-width="0.7"/>`;
  svg+=`<text x="${cx}" y="${y-4}" font-size="9" text-anchor="middle" fill="#3f4b55">outer Ø ${wid.bottomDiameter.toFixed(2)} m</text>`;
  if(gs[0].innerR>0) svg+=`<text x="${cx}" y="${cy+gs[0].innerR*s+12}" font-size="9" text-anchor="middle" fill="#3f4b55">opening Ø ${gs[0].innerDiameter.toFixed(2)} m</text>`;
  else svg+=`<text x="${cx}" y="${cy+gs[0].monopileR*s+13}" font-size="9" text-anchor="middle" fill="#8a929a">pile position, rock placed across it</text>`;
  if(cutLayer && cutLayer.wedges.length){
    const w0=cutLayer.wedges[0];
    svg+=`<text x="8" y="${H-22}" font-size="9" fill="#a06a34">exclusion zone: ${w0.angle.toFixed(0)}\u00b0`+
         `${w0.minWidth>0?`, minimum ${w0.minWidth.toFixed(1)} m wide at the pile`:''}`+
         `${sc.wedgeSideSlopes!==false?', side slopes both faces':''}</text>`;
    const cont=sc.layers.filter((L,i)=>!gs[i].takesWedges).map(L=>L.name);
    if(cont.length) svg+=`<text x="8" y="${H-10}" font-size="9" fill="#8a929a">${cont.join(' and ')} continuous beneath the exclusion zone</text>`;
  }
  svg+='</svg>';
  return svg;
}

R.scour = function(page){
  head(page,'Scour protection design','Shape, lay phase and the rock layers. Each layer carries its own extent, slope, tolerances, material and dumping rate, so a filter and an armour with different geometry and different rock are handled properly.');

  const top=card('Installation condition');
  const g1=el('div',{class:'grid two'});
  g1.appendChild(selField('Default lay phase for new layers',sc.layPhase,
    [{value:'pre',label:'Pre-lay, before the pile'},{value:'post',label:'Post-lay, after the pile'}],
    v=>{sc.layPhase=v; refresh();},
    'Only the starting value for a layer added later. Each layer carries its own lay phase, set beside its shape below.'));
  g1.appendChild(selField('Geometry',sc.geometryType,
    [{value:'pancake',label:'Pancake — full disc, pre-lay only'},

  g2.appendChild(numField('Upper',sc.seabedTolMax,'m',v=>{sc.seabedTolMax=v; refresh();}));

  tol.appendChild(g2);

    proc.appendChild(notice('error','Tolerances are excluded from the quantity being ordered. A vertical or horizontal tolerance can add a large share of the volume, and leaving it out is how a campaign runs short of rock offshore. Only use this to look at the as-drawn design.'));
