function download(name,text,mime){
  const b=new Blob([text],{type:mime||'application/json'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(u);
}
function exportProject(){
  download((STATE.project.name||'project').replace(/[^a-z0-9\-_]+/gi,'_')+'.json', JSON.stringify(STATE,null,2));
  saveNow(true);
}
function migrate(d){
  // accept v2 files, which carried scour.filter / scour.armour instead of scour.layers
  if(d.scour && !d.scour.layers && (d.scour.filter||d.scour.armour)){
    const conv=(old,id,name,bears)=> newLayer({id,name,grading:old.grading||'',
      thicknessNom:old.thicknessNom, vertTolMin:old.vertTolMin, vertTolMax:old.vertTolMax,
      extentMode:'factor', topExtentFactor:old.topExtentFactor,
      horizTolMin:old.horizTolMin, horizTolMax:old.horizTolMax,
      innerMode:'clearance', innerClearance:d.scour.monopileClearance||1.5,
      toeMode:'slope', slopeRatio:old.slopeRatio, seabedBearing:bears,
      dumpRateTph:{min:400,nom:600,max:900},
      material:{solidDensity:old.material?old.material.solidDensity:2.65, densityMode:'porosity',
        porosity:old.material?old.material.porosity:0.4,
        packingFactor:1-(old.material?old.material.porosity:0.4), volumeAllowance:1}});
    d.scour.layers=[];
    if(d.scour.filter) d.scour.layers.push(conv(d.scour.filter,'filter','Filter',true));
    if(d.scour.armour) d.scour.layers.push(conv(d.scour.armour,'armour','Armour',false));
    delete d.scour.filter; delete d.scour.armour;
  }
  const base=exampleState();
  d.meta=Object.assign({version:TOOL_VERSION,created:new Date().toISOString(),scenarioName:'Base case'},d.meta||{});
  if(!d.meta.mode) d.meta.mode='user';
  d.cycle=Object.assign({},base.cycle,d.cycle||{});
  d.weather=Object.assign({},base.weather,d.weather||{});
  d.quarry=Object.assign({},base.quarry,d.quarry||{});
  d.scour=Object.assign({},base.scour,d.scour||{});
  if(d.quarry) delete d.quarry.stockpileCapacityT;
  if(!d.scour.groups) d.scour.groups=[];
  if(d.quarry){ if(d.quarry.lat===undefined) d.quarry.lat=0;
                if(d.quarry.lon===undefined) d.quarry.lon=0;
                if(d.quarry.autoDistance===undefined) d.quarry.autoDistance=false; }
  if(d.project){ if(d.project.siteLat===undefined) d.project.siteLat=0;
                 if(d.project.siteLon===undefined) d.project.siteLon=0;
                 if(!Array.isArray(d.project.pileSets)) d.project.pileSets=[];
                 if(d.project.waterDepthMin===undefined) d.project.waterDepthMin=d.project.waterDepth||0;
                 if(d.project.waterDepthMax===undefined) d.project.waterDepthMax=d.project.waterDepth||0; }
  // a legacy "nominal plus contingency" basis excluded the tolerances entirely;
  // carry the contingency over but put it on top of the upper bound
  if(d.scour.procurementBasis==='contingency') d.scour.procurementBasis='envelope';
  (d.turbines||[]).forEach(t=>{ if(t.groupId===undefined) t.groupId=null; });
  (d.scour.layers||[]).forEach(L=>{
    const t=newLayer({});
    Object.keys(t).forEach(k=>{ if(L[k]===undefined) L[k]=t[k]; });
    if(L.layPhase===undefined) L.layPhase = d.scour.layPhase || 'post';
    if(L.applyWedges===undefined) L.applyWedges = true;
    if(L.volumeBasis===undefined) L.volumeBasis = 'frustum';
    if(L.extentMode===undefined) L.extentMode = (L.topExtentFactor>0) ? 'factor' : 'wall';
    if(L.shape===undefined) L.shape='';
    if(L.wallFactor===undefined) L.wallFactor = 1.55;
    if(L.crestRadius===undefined) L.crestRadius = 19.5;
    L.material=Object.assign({},t.material,L.material||{});
    if(L.material.packingFactor===undefined) L.material.packingFactor=1-(L.material.porosity||0.35);
  });
  return d;
}

  auto.addEventListener('change',e=>{ AUTOSAVE=e.target.checked; if(AUTOSAVE) scheduleAutosave(); updateSaveStatus(); });

      {title:'Delete the stored copy',ok:'Delete',danger:true});
  });
  window.addEventListener('beforeunload',e=>{

    e.returnValue='You have unsaved changes.';

/* =========================================================================
   PAGE: DESIGN GROUPS
   -------------------------------------------------------------------------
   A field is rarely one design repeated. Locations fall into bands sharing a
   pile diameter, a rock grade and a layer thickness, and a tender is priced
   band by band with a count against each. A group holds the parameters that
   vary between bands; everything else stays on the layer.
   ========================================================================= */
function newGroup(name, over){
  return Object.assign({id:'G'+Math.random().toString(36).slice(2,8), name:name||'Group',
    mpOD:0, note:'', layers:{}}, over||{});
}
function groupLayerOverride(G, L){
  if(!G.layers[L.id]) G.layers[L.id]={};
  return G.layers[L.id];
}
/* A blank override falls back to the layer, so only what genuinely differs is
   stored and the base design stays the single source for the rest. */
function ovNum(label, G, L, key, unit, hint){
  const o=groupLayerOverride(G,L);
  const base=(key==='solidDensity')?L.material.solidDensity
           :(key==='packingFactor')?Engine.packingOf(L.material)
           :(key==='volumeAllowance')?(L.material.volumeAllowance||1):L[key];
  const fmtBase=(base===undefined||base===null||isNaN(base))?String(base===undefined?'layer':base):fmt(base,3);
  const inp=el('input',{type:'number',step:'any',
    value:(o[key]===undefined||o[key]===''||o[key]===null)?'':o[key],
    placeholder:String(base),
    oninput:e=>{const raw=e.target.value;
      typed(()=>{ if(raw==='') delete o[key]; else o[key]=parseFloat(raw)||0; });}});
  return field(label, unit?el('div',{class:'inp-unit'},[inp,el('span',{class:'unit'},[unit])]):inp,
    hint||('blank = '+fmtBase+' from the layer'));
}

R.groups = function(page){
  head(page,'Design groups','Bands of locations that share a design. Each band carries its own pile diameter, grade, thickness, extent, slope, density and spillage; tolerances, lay phase, corridors and dumping rates stay on the layer so they are defined once.');
  const sc=STATE.scour;
  if(!sc.groups) sc.groups=[];

  const bar=card('Bands');
  bar.appendChild(el('div',{class:'btn-row'},[
    el('button',{class:'btn',onclick:()=>{
      sc.groups.push(newGroup('WBS'+(sc.groups.length+1))); refresh();
    }},['Add band']),
    el('button',{class:'btn ghost',onclick:()=>{
      // one band per distinct pile diameter already in the location table
      const seen=new Map();
      STATE.turbines.forEach(t=>{
        const d=t.monopileDiameter||0;
        if(!seen.has(d)) seen.set(d,[]);
        seen.get(d).push(t);
      });
      if(!seen.size){ uiAlert('Add locations first.'); return; }
      uiConfirm(`This creates ${seen.size} band(s), one per distinct monopile diameter, and assigns every location. Any existing bands are replaced.`,
        ()=>{
          sc.groups=[]; let i=0;
          [...seen.keys()].sort((a,b)=>b-a).forEach(d=>{
            const G=newGroup('WBS'+(++i),{mpOD:d, note:'D '+d+' m'});
            sc.groups.push(G);
            seen.get(d).forEach(t=>t.groupId=G.id);
          });
          refresh();
        }, {title:'Auto-band by pile diameter', ok:'Create bands'});
    }},['Auto-band by pile diameter']),
    el('button',{class:'btn ghost',onclick:()=>{
      uiConfirm('The bands themselves are kept, only the location assignments are cleared.',

        {title:'Unassign all locations', ok:'Unassign', danger:true});
    }},['Unassign all locations'])
  ]));

  if(fromSets) bar.appendChild(notice('info',
    `${fromSets} band${fromSets===1?'':'s'} come from the pile diameter list on the Project tab. Their diameter and location count are set there; everything else, including grade, thickness, extent, slope and tolerances, is set here.`));
  const unassigned=STATE.turbines.filter(t=>!t.groupId).length;
  bar.appendChild(el('p',{class:'sec-note'},[

  page.appendChild(bar);

  if(!sc.groups.length){
    page.appendChild(notice('info','No bands defined. Add one, or auto-band by pile diameter to get started from the locations you already have.'));
  }

};

    dSum+=d; iSum+=i;

/* =========================================================================
   TABULAR IMPORT
   -------------------------------------------------------------------------
   A location schedule normally arrives as a block of copied cells, so it
   should be possible to paste it straight in. The columns vary between
   projects, so the importer detects what it can from the header row and then
   lets the mapping be corrected by hand before anything is written.
   ========================================================================= */
const IMPORT_FIELDS = [
  {k:'ignore',    label:'— ignore —'},
  {k:'id',        label:'Location ID'},
  {k:'x',         label:'X / Easting (m)'},
  {k:'y',         label:'Y / Northing (m)'},
  {k:'lat',       label:'Latitude (deg N)'},
  {k:'lon',       label:'Longitude (deg E)'},
  {k:'mpod',      label:'Monopile OD (m)'},
  {k:'depth',     label:'Water depth (m, positive)'},
  {k:'seabed',    label:'Seabed level (m, negative to LAT)'},
  {k:'grade',     label:'Rock grade'},
  {k:'thickness', label:'Thickness (m)'},
  {k:'extent',    label:'Extent top, from the pile wall (m)'},
  {k:'slope',     label:'Slope 1:n'},
  {k:'density',   label:'Density (t/m³ or kg/m³)'},
  {k:'band',      label:'Design band name'},
];
const BAND_KEYS = ['grade','thickness','extent','slope','mpod','density'];

function splitRows(text){
  const lines = text.replace(/\r\n?/g,'\n').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length) return {rows:[], delim:null};
  const delim = lines[0].indexOf('\t')>=0 ? '\t'
              : (lines[0].indexOf(';')>=0 && lines[0].indexOf(',')<0) ? ';' : ',';
  return {rows: lines.map(l=>l.split(delim).map(c=>c.trim().replace(/^"(.*)"$/,'$1'))), delim};
}
function looksNumeric(v){ return v!=='' && isFinite(parseFloat(String(v).replace(',','.'))); }
function numOf(v){
  if(v===undefined||v===null) return NaN;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
}
function guessField(header, sample){
  const h=(header||'').toLowerCase();
  const has=(...w)=>w.some(x=>h.indexOf(x)>=0);
  if(has('location type','loc type')) return 'ignore';
  // "Seabed Level [ref. LAT]" must not swallow a Latitude column, so the
  // seabed rule needs the word seabed, or a chart datum reference
  if(has('seabed') || (has('lat') && has('ref')) || has('chart datum')) return 'seabed';
  if(has('latitude') || h==='lat' || h==='lat (deg)' || has('lat [')) return 'lat';
  if(has('longitude') || h==='lon' || h==='long' || h==='lng' || has('lon [')) return 'lon';
  if(has('mp od','mpod','mp_od','monopile','pile diam','mp diam')) return 'mpod';
  if(has('depth')) return 'depth';
  if(has('grade','grading','rock class','class name')) return 'grade';
  if(has('thickness')) return 'thickness';
  if(has('extent')) return 'extent';
  if(has('slope')) return 'slope';
  if(has('density')) return 'density';
  if(has('wbs','band','group')) return 'band';
  if(has('easting')||h==='x') return 'x';
  if(has('northing')||h==='y') return 'y';
  if(has('location','turbine','wtg','id','name','position')) return 'id';
  if(sample!==undefined && !looksNumeric(sample)) return 'id';
  return 'ignore';
}
function hasHeader(rows){
  if(rows.length<2) return false;
  const numericFirst = rows[0].filter(looksNumeric).length;
  const numericSecond = rows[1].filter(looksNumeric).length;
  return numericFirst < numericSecond;
}

function openImportModal(text){
  const parsed=splitRows(text);
  if(!parsed.rows.length){ uiAlert('Nothing usable in that paste.'); return; }
  const header = hasHeader(parsed.rows);
  const head = header ? parsed.rows[0] : parsed.rows[0].map((_,i)=>'Column '+(i+1));
  let body = header ? parsed.rows.slice(1) : parsed.rows;
  const nCol = Math.max(...parsed.rows.map(r=>r.length));
  while(head.length<nCol) head.push('Column '+(head.length+1));
  const map = head.map((h,i)=> guessField(header?h:'', body[0]?body[0][i]:undefined));
  // never map two columns to the same single-value field
  ['id','x','y','lat','lon','mpod','depth','seabed','band'].forEach(k=>{
    let seen=false;
    map.forEach((m,i)=>{ if(m===k){ if(seen) map[i]='ignore'; seen=true; } });
  });

  const opts = {mode:'replace', makeBands:true, targetLayer:(STATE.scour.layers[0]||{}).id};
  const back=el('div',{class:'modal-back',onclick:e=>{ if(e.target===back) back.remove(); }});
  const m=el('div',{class:'modal wide'});
  m.appendChild(el('h2',{},['Import locations']));
  m.appendChild(el('p',{class:'sec-note'},[
    `${body.length} data row${body.length===1?'':'s'}, ${nCol} column${nCol===1?'':'s'}, `+
    `${parsed.delim==='\t'?'tab':parsed.delim==='?'?'semicolon':parsed.delim}-separated`+
    (header?', header row detected':', no header row detected')+
    '. Check the mapping below before importing.']));

  const preview=el('div');
  function drawPreview(){
    preview.innerHTML='';
    const sc=el('div',{class:'tbl-scroll'});
    const t=el('table',{class:'data compact'});
    const hr=el('tr');
    head.forEach((h,i)=>{
      const th=el('th');
      const sel=el('select',{onchange:e=>{
        const v=e.target.value;
        if(['id','x','y','lat','lon','mpod','depth','seabed','band'].indexOf(v)>=0)
          map.forEach((mm,j)=>{ if(j!==i && mm===v) map[j]='ignore'; });
        map[i]=v; drawPreview(); drawSummary();
      }});
      IMPORT_FIELDS.forEach(f=>{
        const o=el('option',{value:f.k},[f.label]);
        if(map[i]===f.k) o.setAttribute('selected','selected');
        sel.appendChild(o);
      });
      th.appendChild(el('div',{class:'imp-head'},[h]));
      th.appendChild(sel);
      hr.appendChild(th);
    });
    t.appendChild(hr);
    body.slice(0,6).forEach(r=>{
      t.appendChild(el('tr',{},head.map((_,i)=>el('td',{},[r[i]!==undefined?r[i]:'']))));
    });
    sc.appendChild(t); preview.appendChild(sc);
    if(body.length>6) preview.appendChild(el('p',{class:'sec-note'},[`Showing 6 of ${body.length} rows.`]));
  }
  drawPreview();
  m.appendChild(preview);

  const cfg=el('div',{class:'grid three',style:'margin-top:12px'});
  cfg.appendChild(selField('Existing locations','replace',
    [{value:'replace',label:'Replace them'},{value:'append',label:'Add to them'}],
    v=>{opts.mode=v; drawSummary();}));
  cfg.appendChild(selField('Build design bands from the data','yes',
    [{value:'yes',label:'Yes, one band per distinct design'},{value:'no',label:'No, leave unbanded'}],
    v=>{opts.makeBands=(v==='yes'); drawSummary();}));
  const lsel=el('select',{onchange:e=>{opts.targetLayer=e.target.value; drawSummary();}});
  STATE.scour.layers.forEach(L=>{
    const o=el('option',{value:L.id},[L.name]);
    if(opts.targetLayer===L.id) o.setAttribute('selected','selected');
    lsel.appendChild(o);
  });
  cfg.appendChild(field('Apply rock columns to',lsel,'Grade, thickness, extent, slope and density are written as overrides on this layer.'));
  m.appendChild(cfg);

  const summary=el('div');
  function buildRows(){
    const idx={}; map.forEach((k,i)=>{ if(k!=='ignore' && idx[k]===undefined) idx[k]=i; });
    const get=(r,k)=> idx[k]===undefined ? undefined : r[idx[k]];
    const out=[];
    body.forEach((r,n)=>{
      const rawDepth = idx.depth!==undefined ? numOf(get(r,'depth'))
                     : idx.seabed!==undefined ? Math.abs(numOf(get(r,'seabed'))) : NaN;
      let dens = idx.density!==undefined ? numOf(get(r,'density')) : NaN;
      if(isFinite(dens) && dens>100) dens=dens/1000;    // kg/m3 entered
      out.push({
        id: (idx.id!==undefined && String(get(r,'id')||'').trim()) || ('WTG-'+String(n+1).padStart(3,'0')),
        x: idx.x!==undefined? (numOf(get(r,'x'))||0) : null,
        y: idx.y!==undefined? (numOf(get(r,'y'))||0) : null,
        lat: idx.lat!==undefined? numOf(get(r,'lat')) : NaN,
        lon: idx.lon!==undefined? numOf(get(r,'lon')) : NaN,
        mpod: idx.mpod!==undefined? numOf(get(r,'mpod')) : NaN,
        depth: isFinite(rawDepth)? rawDepth : NaN,
        grade: idx.grade!==undefined? String(get(r,'grade')||'').trim() : '',
        thickness: idx.thickness!==undefined? numOf(get(r,'thickness')) : NaN,
        extent: idx.extent!==undefined? numOf(get(r,'extent')) : NaN,
        slope: idx.slope!==undefined? numOf(get(r,'slope')) : NaN,
        density: dens,
        band: idx.band!==undefined? String(get(r,'band')||'').trim() : ''
      });
    });
    return {rows:out, idx};
  }
  function bandKeyOf(r, idx){
    return BAND_KEYS.filter(k=>idx[k]!==undefined)
      .map(k=> k==='mpod'?r.mpod : k==='grade'?r.grade : r[k]).join('|');
  }
  function drawSummary(){
    summary.innerHTML='';
    const {rows,idx}=buildRows();
    const notes=[];
    if(idx.id===undefined) notes.push('No ID column mapped, so locations will be numbered WTG-001 upward.');
    if(idx.lat!==undefined&&idx.lon!==undefined) notes.push('Latitude and longitude are mapped, so the site position and the sea distance to the quarry are worked out from the field itself.');
    else notes.push('No latitude and longitude mapped. The sea distance will fall back to the site position entered on the Quarry tab.');
    if(idx.x===undefined||idx.y===undefined) notes.push('No local coordinates mapped, so locations sit on a nominal grid. Quantities are unaffected; the layout plot and the in-field move distance use them.');
    if(idx.mpod===undefined) notes.push('No monopile diameter mapped, so the project default will be used.');
    if(idx.depth===undefined&&idx.seabed===undefined) notes.push('No depth mapped, so the project default will be used.');
    if(idx.seabed!==undefined) notes.push('Seabed level is read as a level referenced to LAT and converted to a positive water depth.');
    if(idx.density!==undefined) notes.push('Density above 100 is read as kg/m³ and converted to t/m³.');
    let bandCount=0;
    if(opts.makeBands){
      if(idx.band!==undefined) bandCount=new Set(rows.map(r=>r.band||'(unnamed)')).size;
      else if(BAND_KEYS.some(k=>idx[k]!==undefined)) bandCount=new Set(rows.map(r=>bandKeyOf(r,idx))).size;
      if(bandCount) notes.push(`${bandCount} design band${bandCount===1?'':'s'} will be created from the distinct designs in the data and every location assigned.`);
      else notes.push('No design columns mapped, so no bands will be created.');
    }
    const bad=rows.filter(r=>idx.mpod!==undefined && !(r.mpod>0)).length;
    if(bad) notes.push(`${bad} row(s) have no usable monopile diameter and will fall back to the project default.`);
    summary.appendChild(el('div',{class:'notice info'},[
      `${rows.length} location${rows.length===1?'':'s'} ready to ${opts.mode==='replace'?'replace the current table':'add to the current table'}.`]));
    notes.forEach(n=> summary.appendChild(el('p',{class:'sec-note'},[n])));
  }
  drawSummary();
  m.appendChild(summary);

  m.appendChild(el('div',{class:'btn-row'},[
    el('button',{class:'btn',onclick:()=>{
      const {rows,idx}=buildRows();
      if(!rows.length){ uiAlert('No rows to import.'); return; }
      const cols=Math.ceil(Math.sqrt(rows.length))||1;
      const base = opts.mode==='append' ? STATE.turbines.slice() : [];
      const offset = base.length;
      const targetLayer = STATE.scour.layers.find(L=>L.id===opts.targetLayer) || STATE.scour.layers[0];

      // design bands from distinct designs in the data
      const bandOf=new Map();
      if(opts.makeBands && targetLayer){
        const named = idx.band!==undefined;
        const keys=[];
        rows.forEach(r=>{ const k = named ? (r.band||'(unnamed)') : bandKeyOf(r,idx);
          if(keys.indexOf(k)<0) keys.push(k); });
        if(keys.length && (named || BAND_KEYS.some(k=>idx[k]!==undefined))){
          if(opts.mode==='replace') { STATE.scour.groups=[]; }
          keys.forEach((k,i)=>{
            const sample=rows.find(r=> (named?(r.band||'(unnamed)'):bandKeyOf(r,idx))===k);
            const G=newGroup(named? k : 'WBS'+(STATE.scour.groups.length+1));
            if(idx.mpod!==undefined && sample.mpod>0) G.mpOD=sample.mpod;
            const ov={};
            if(idx.grade!==undefined && sample.grade) ov.grade=sample.grade;
            if(idx.thickness!==undefined && isFinite(sample.thickness)) ov.thicknessNom=sample.thickness;
            if(idx.slope!==undefined && isFinite(sample.slope)) ov.slopeRatio=sample.slope;
            if(idx.extent!==undefined && isFinite(sample.extent)){
              // an extent column is the distance out from the pile wall
              ov.extentMode='wall';
              ov.crestOffset = sample.extent;
            }
            if(idx.density!==undefined && isFinite(sample.density)) ov.solidDensity=sample.density;
            if(Object.keys(ov).length) G.layers[targetLayer.id]=ov;
            STATE.scour.groups.push(G);
            bandOf.set(k,G.id);
          });
        }
      }

      rows.forEach((r,i)=>{
        const k = opts.makeBands ? ((idx.band!==undefined)?(r.band||'(unnamed)'):bandKeyOf(r,idx)) : null;
        base.push({
          id: r.id,
          x: r.x!==null? r.x : ((offset+i)%cols)*1200,
          y: r.y!==null? r.y : Math.floor((offset+i)/cols)*1200,
          lat: isFinite(r.lat)? r.lat : undefined,
          lon: isFinite(r.lon)? r.lon : undefined,
          monopileDiameter: (isFinite(r.mpod)&&r.mpod>0)? r.mpod : STATE.project.monopileDiameter,
          waterDepth: (isFinite(r.depth)&&r.depth>0)? r.depth : STATE.project.waterDepth,
          geometryOverride:'', wedges:[], vesselId:null,
          groupId: (k!==null && bandOf.has(k)) ? bandOf.get(k) : null
        });
      });
      STATE.turbines=base;
      STATE.project.numTurbines=base.length;
      ROUTE_CACHE={key:null,val:null}; QDIST_CACHE.clear();
      if(STATE.meta.mode==='blank') STATE.meta.mode='user';
      if(!STATE.vessels.length) STATE.vessels=[makeVessel('Vessel 1',vesselFromLibrary(DEFAULT_VESSEL_CLASS))];
      back.remove(); refresh();
    }},['Import '+body.length+' rows']),
    el('button',{class:'btn ghost',onclick:()=>back.remove()},['Cancel'])
  ]));
  back.appendChild(m); document.body.appendChild(back);
}

</script>
</body>
</html>
